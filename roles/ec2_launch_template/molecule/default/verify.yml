---
- name: Verify
  hosts: all
  roles:
    - ec2_launch_template_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_launch_template_info_dict[_name].launch_template_id is defined
          - _ec2_launch_template_info_dict[_name].default_version_number == 1
      loop: "{{ ec2_launch_template_list | map(attribute='template_name') }}"
      loop_control:
        label: "{{ _name }}"
        loop_var: _name
...
