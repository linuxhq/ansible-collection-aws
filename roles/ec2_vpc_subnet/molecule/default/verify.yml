---
- name: Verify
  hosts: all

  roles:
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_vpc_subnet_info_dict[_subnet.name].availability_zone == _subnet.az
          - _ec2_vpc_subnet_info_dict[_subnet.name].cidr_block == _subnet.cidr
          - _ec2_vpc_subnet_info_dict[_subnet.name].vpc_id == _ec2_vpc_net_info_dict['molecule'].id
      loop: "{{ ec2_vpc_subnet_list.0.subnets }}"
      loop_control:
        label: "{{ _subnet.name }}"
        loop_var: _subnet
...
