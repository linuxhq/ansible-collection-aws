---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_vpc_net_list:
          - name: molecule-ec2-vpc-subnet
            cidr_block: 10.0.0.0/16

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ec2-vpc-subnet'].id | d(omit) }}"
            subnets:
              - name: molecule-ec2-vpc-subnet-a-00
                az: us-east-1a
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,0) }}"
              - name: molecule-ec2-vpc-subnet-a-01
                az: us-east-1a
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,1) }}"
              - name: molecule-ec2-vpc-subnet-a-02
                az: us-east-1a
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,2) }}"
              - name: molecule-ec2-vpc-subnet-a-03
                az: us-east-1a
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,3) }}"
              - name: molecule-ec2-vpc-subnet-c-00
                az: us-east-1c
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,4) }}"
              - name: molecule-ec2-vpc-subnet-c-01
                az: us-east-1c
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,5) }}"
              - name: molecule-ec2-vpc-subnet-c-02
                az: us-east-1c
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,6) }}"
              - name: molecule-ec2-vpc-subnet-c-03
                az: us-east-1c
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,7) }}"
              - name: molecule-ec2-vpc-subnet-d-00
                az: us-east-1d
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,8) }}"
              - name: molecule-ec2-vpc-subnet-d-01
                az: us-east-1d
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,9) }}"
              - name: molecule-ec2-vpc-subnet-d-02
                az: us-east-1d
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,10) }}"
              - name: molecule-ec2-vpc-subnet-d-03
                az: us-east-1d
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,11) }}"
...
