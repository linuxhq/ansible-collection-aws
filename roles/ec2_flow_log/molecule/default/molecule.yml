---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_flow_log_bucket_name:
          "molecule-ec2-flow-log-{{ _aws_caller_info_account }}"
        ec2_flow_log_bucket_resource:
          "arn:aws:s3:::{{ ec2_flow_log_bucket_name }}"

        ec2_flow_log_list:
          - name: molecule-ec2-flow-log-vpc
            resource_ids:
              - "{{ _ec2_vpc_net_info_dict['molecule-ec2-flow-log'].id | d(omit) }}"
            resource_type: VPC
            traffic_type: ALL
            log_destination_type: s3
            log_destination: "{{ ec2_flow_log_bucket_resource }}"

          - name: molecule-ec2-flow-log-subnet
            resource_ids:
              - "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-flow-log'].id | d(omit) }}"
            resource_type: Subnet
            traffic_type: ACCEPT
            log_destination_type: s3
            log_destination: "{{ ec2_flow_log_bucket_resource }}"

          - name: molecule-ec2-flow-log-tgw
            resource_ids:
              - "{{ _ec2_transit_gateway_info_dict['molecule-ec2-flow-log'].transit_gateway_id |
                    d(omit) }}"
            resource_type: TransitGateway
            log_destination_type: s3
            log_destination: "{{ ec2_flow_log_bucket_resource }}"

          - name: molecule-ec2-flow-log-tgw-attachment
            resource_ids:
              - "{{ _ec2_transit_gateway_vpc_attachment_info_dict[
                      'molecule-ec2-flow-log'
                    ].transit_gateway_attachment_id |
                    d(omit) }}"
            resource_type: TransitGatewayAttachment
            log_destination_type: s3
            log_destination: "{{ ec2_flow_log_bucket_resource }}"

        ec2_flow_log_source_arn:
          "arn:aws:logs:us-east-1:{{ _aws_caller_info_account }}:*"

        ec2_transit_gateway_list:
          - name: molecule-ec2-flow-log

        ec2_transit_gateway_vpc_attachment_list:
          - name: molecule-ec2-flow-log
            subnets:
              - "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-flow-log'].id | d(omit) }}"
            transit_gateway:
              "{{ _ec2_transit_gateway_info_dict['molecule-ec2-flow-log'].transit_gateway_id |
                  d(omit) }}"

        ec2_vpc_net_list:
          - name: molecule-ec2-flow-log
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ec2-flow-log'].id | d(omit) }}"
            subnets:
              - name: molecule-ec2-flow-log
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block }}"

        s3_bucket_list:
          - name: "{{ ec2_flow_log_bucket_name }}"
            force: true
            policy:
              Version: '2012-10-17'
              Statement:
                - Sid: AWSLogDeliveryWrite
                  Effect: Allow
                  Principal:
                    Service: delivery.logs.amazonaws.com
                  Action:
                    - s3:PutObject
                  Resource:
                    - "{{ ec2_flow_log_bucket_resource }}/AWSLogs/{{ _aws_caller_info_account }}/*"
                  Condition:
                    StringEquals:
                      'aws:SourceAccount': "{{ _aws_caller_info_account }}"
                      's3:x-amz-acl': bucket-owner-full-control
                    ArnLike:
                      'aws:SourceArn': "{{ ec2_flow_log_source_arn }}"
                - Sid: AWSLogDeliveryAclCheck
                  Effect: Allow
                  Principal:
                    Service: delivery.logs.amazonaws.com
                  Action:
                    - s3:GetBucketAcl
                  Resource:
                    - "{{ ec2_flow_log_bucket_resource }}"
                  Condition:
                    StringEquals:
                      'aws:SourceAccount': "{{ _aws_caller_info_account }}"
                    ArnLike:
                      'aws:SourceArn': "{{ ec2_flow_log_source_arn }}"
            public_access:
              block_public_acls: true
              block_public_policy: true
              ignore_public_acls: true
              restrict_public_buckets: true
...
