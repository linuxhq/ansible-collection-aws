---
- name: Cleanup
  hosts: all
  roles:
    - aws_caller_info
    - ec2_transit_gateway_info
    - ec2_transit_gateway_vpc_attachment_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  post_tasks:
    # Inventory entries reference fixture ids, so skip entries whose fixtures do not exist.
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_flow_log_list:
          "{{ ec2_flow_log_list |
              map('combine', {'state': 'absent'})
              if 'molecule' in _ec2_vpc_net_info_dict and
                 'molecule' in _ec2_vpc_subnet_info_dict and
                 'molecule' in _ec2_transit_gateway_info_dict and
                 'molecule' in _ec2_transit_gateway_vpc_attachment_info_dict
              else [] }}"
        ec2_transit_gateway_list:
          "{{ ec2_transit_gateway_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_transit_gateway_vpc_attachment_list:
          "{{ ec2_transit_gateway_vpc_attachment_list |
              map('combine', {'state': 'absent'})
              if 'molecule' in _ec2_vpc_subnet_info_dict and
                 'molecule' in _ec2_transit_gateway_info_dict
              else [] }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              map('combine', {'state': 'absent'})
              if 'molecule' in _ec2_vpc_net_info_dict
              else [] }}"
        s3_bucket_list:
          "{{ s3_bucket_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure flow log names and resource ids are set
      ansible.builtin.set_fact:
        __ec2_flow_log_names: "{{ ec2_flow_log_list | map(attribute='name') | list }}"
        __ec2_flow_log_resource_ids: "{{ ec2_flow_log_list | map(attribute='resource_ids') | flatten }}"

    - name: Ensure flow log role is included
      ansible.builtin.include_role:
        name: ec2_flow_log

    - name: Ensure flow logs are deleted
      linuxhq.aws.ec2_flow_log_info:
        resource_ids: "{{ __ec2_flow_log_resource_ids }}"
        validate_certs: true
      register: __ec2_flow_log_deleted
      when: __ec2_flow_log_resource_ids | length > 0

    - name: Ensure flow log deletion is verified
      ansible.builtin.assert:
        that:
          - __ec2_flow_log_deleted.flow_logs | d([]) |
            selectattr('tags.Name', 'defined') |
            selectattr('tags.Name', 'in', __ec2_flow_log_names) |
            list | length == 0

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ec2_transit_gateway_vpc_attachment
        - ec2_transit_gateway
        - ec2_vpc_subnet
        - ec2_vpc_net
        - s3_bucket
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
