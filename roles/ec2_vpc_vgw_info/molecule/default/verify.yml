---
- name: Verify
  hosts: all

  roles:
    - ec2_vpc_net_info
    - ec2_vpc_vgw_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _ec2_vpc_vgw_info_dict['molecule-ec2-vpc-vgw-info'].state == 'available'
          - _ec2_vpc_vgw_info_dict['molecule-ec2-vpc-vgw-info'].resource_tags.Name == 'molecule-ec2-vpc-vgw-info'
          - _ec2_vpc_vgw_info_dict['molecule-ec2-vpc-vgw-info'].resource_tags.molecule == 'ec2_vpc_vgw_info'
          - _ec2_vpc_vgw_info_dict['molecule-ec2-vpc-vgw-info'].type == 'ipsec.1'
          - _ec2_vpc_vgw_info_dict['molecule-ec2-vpc-vgw-info'].vpn_gateway_id is defined
          - _ec2_vpc_vgw_info_dict['molecule-ec2-vpc-vgw-info'].vpc_attachments.0.state == 'attached'
          - _ec2_vpc_vgw_info_dict['molecule-ec2-vpc-vgw-info'].vpc_attachments.0.vpc_id ==
              _ec2_vpc_net_info_dict[ec2_vpc_net_list.0.name].id
...
