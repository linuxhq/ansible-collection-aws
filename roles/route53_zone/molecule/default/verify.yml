---
- name: Verify
  hosts: all
  roles:
    - ec2_vpc_net_info
    - route53_zone_info

  tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _route53_zone_info_dict[_zone.zone].config.private_zone == (_zone.vpc_id is defined)
      loop: "{{ route53_zone_list }}"
      loop_control:
        label: "{{ _zone.zone }}"
        loop_var: _zone
...
