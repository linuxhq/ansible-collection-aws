---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        ec2_vpc_net_list:
          - name: molecule
            cidr_block: 192.168.0.0/24

        route53_zone_list:
          - zone: molecule-pub-00.org
          - zone: molecule-pub-01.org
          - zone: molecule-pub-02.org

          - zone: molecule-pvt-01.org
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
            vpc_region:
              "{{ lookup('ansible.builtin.ini',
                         'region',
                         file='~/.aws/config',
                         section='profile molecule') }}"

          - zone: molecule-pvt-02.org
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
            vpc_region:
              "{{ lookup('ansible.builtin.ini',
                         'region',
                         file='~/.aws/config',
                         section='profile molecule') }}"

          - zone: molecule-pvt-03.org
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
            vpc_region:
              "{{ lookup('ansible.builtin.ini',
                         'region',
                         file='~/.aws/config',
                         section='profile molecule') }}"

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
