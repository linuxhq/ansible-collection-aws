---
- name: Verify
  hosts: all

  tasks:
    - name: Ensure prefix lists are queried
      linuxhq.aws.ec2_vpc_prefix_list_info:
        filters:
          prefix-list-name: "{{ ec2_vpc_prefix_list_entries |
                                map(attribute='name') |
                                list }}"
        validate_certs: true
      register: __ec2_vpc_prefix_list_query

    - name: Ensure prefix lists are verified
      vars:
        __ec2_vpc_prefix_list_current:
          "{{ __ec2_vpc_prefix_list_query.prefix_lists |
              rejectattr('state', 'eq', 'delete-complete') |
              list }}"
        __ec2_vpc_prefix_list_dict:
          "{{ dict(__ec2_vpc_prefix_list_current |
                   json_query('[].prefix_list_name') |
                   zip(__ec2_vpc_prefix_list_current)) }}"
      ansible.builtin.assert:
        that:
          - __ec2_vpc_prefix_list_current | length == 2
          - __ec2_vpc_prefix_list_dict[_pl.name].address_family == 'IPv4'
          - __ec2_vpc_prefix_list_dict[_pl.name].entries |
            sort(attribute='cidr') ==
            _pl.entries | sort(attribute='cidr')
          - __ec2_vpc_prefix_list_dict[_pl.name].max_entries ==
            _pl.max_entries | d(_pl.entries | length)
          - "__ec2_vpc_prefix_list_dict[_pl.name].tags == {'Name': _pl.name}"
          - __ec2_vpc_prefix_list_dict[_pl.name].state in ['create-complete', 'modify-complete']
      loop: "{{ ec2_vpc_prefix_list_entries }}"
      loop_control:
        label: "{{ _pl.name }}"
        loop_var: _pl

    - name: Ensure prefix list entries are replaced
      ansible.builtin.include_role:
        name: ec2_vpc_prefix_list
      vars:
        ec2_vpc_prefix_list_entries:
          - name: molecule-ec2-vpc-prefix-list-localhost
            entries:
              - cidr: 127.0.0.6/32
                description: localhost-6
              - cidr: 127.0.0.7/32
                description: localhost-7
              - cidr: 127.0.0.8/32
                description: localhost-8
              - cidr: 127.0.0.9/32
                description: localhost-9
              - cidr: 127.0.0.10/32
                description: localhost-10
          - name: molecule-ec2-vpc-prefix-list-private
            max_entries: 10
            entries:
              - cidr: 192.168.6.0/24
                description: private-6
              - cidr: 192.168.7.0/24
                description: private-7

    - name: Ensure prefix lists are queried again
      linuxhq.aws.ec2_vpc_prefix_list_info:
        filters:
          prefix-list-name:
            - molecule-ec2-vpc-prefix-list-localhost
            - molecule-ec2-vpc-prefix-list-private
        validate_certs: true
      register: __ec2_vpc_prefix_list_query

    - name: Ensure replaced prefix list entries are verified
      vars:
        __ec2_vpc_prefix_list_dict:
          "{{ __ec2_vpc_prefix_list_query.prefix_lists |
              rejectattr('state', 'eq', 'delete-complete') |
              items2dict(key_name='prefix_list_name', value_name='entries') }}"
      ansible.builtin.assert:
        that:
          - __ec2_vpc_prefix_list_dict['molecule-ec2-vpc-prefix-list-localhost'] |
            map(attribute='cidr') |
            sort == ['127.0.0.10/32', '127.0.0.6/32', '127.0.0.7/32', '127.0.0.8/32', '127.0.0.9/32']
          - __ec2_vpc_prefix_list_dict['molecule-ec2-vpc-prefix-list-private'] |
            map(attribute='cidr') |
            sort == ['192.168.6.0/24', '192.168.7.0/24']
...
