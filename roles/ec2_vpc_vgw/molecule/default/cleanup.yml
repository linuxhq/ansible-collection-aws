---
- name: Cleanup
  hosts: all
  roles:
    - ec2_vpc_net_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_vgw_list:
          - name: molecule
            state: absent
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ec2_vpc_vgw
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
