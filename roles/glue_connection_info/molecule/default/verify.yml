---
- name: Verify
  hosts: all

  roles:
    - ec2_security_group_info
    - ec2_vpc_subnet_info

  post_tasks:
    - name: Ensure role is included without filters or name
      ansible.builtin.include_role:
        name: glue_connection_info
      vars:
        glue_connection_info_name: null

    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _glue_connection_info_dict['molecule-glue-connection-info'].connection_properties.KAFKA_SSL_ENABLED ==
              glue_connection_list.0.connection_properties.KAFKA_SSL_ENABLED
          - _glue_connection_info_dict['molecule-glue-connection-info'].connection_type ==
              glue_connection_list.0.connection_type
          - _glue_connection_info_dict['molecule-glue-connection-info'].description ==
              glue_connection_list.0.name
          - _glue_connection_info_dict['molecule-glue-connection-info'].name ==
              glue_connection_list.0.name
          - _glue_connection_info_dict[
              'molecule-glue-connection-info'
            ].physical_connection_requirements.availability_zone == glue_connection_list.0.availability_zone
          - _glue_connection_info_dict[
              'molecule-glue-connection-info'
            ].physical_connection_requirements.security_group_id_list == glue_connection_list.0.security_groups
          - _glue_connection_info_dict['molecule-glue-connection-info'].physical_connection_requirements.subnet_id ==
              glue_connection_list.0.subnet_id

    - name: Ensure role is included with name
      ansible.builtin.include_role:
        name: glue_connection_info
      vars:
        glue_connection_info_name: molecule-glue-connection-info

    - name: Ensure info with name is verified
      ansible.builtin.assert:
        that:
          - _glue_connection_info_list | length == 1
          - _glue_connection_info_dict.keys() | list == ['molecule-glue-connection-info']
          - _glue_connection_info_dict['molecule-glue-connection-info'].connection_type ==
              glue_connection_list.0.connection_type

    - name: Ensure role is included with filters
      ansible.builtin.include_role:
        name: glue_connection_info
      vars:
        glue_connection_info_filters:
          ConnectionType: "{{ glue_connection_list.0.connection_type }}"
        glue_connection_info_name: null

    - name: Ensure info with filters is verified
      ansible.builtin.assert:
        that:
          - _glue_connection_info_dict['molecule-glue-connection-info'].name == glue_connection_list.0.name

    - name: Ensure role is included with a missing name
      ansible.builtin.include_role:
        name: glue_connection_info
      vars:
        glue_connection_info_name: molecule-glue-connection-info-missing

    - name: Ensure info with a missing name is verified
      ansible.builtin.assert:
        that:
          - _glue_connection_info_list == []
          - _glue_connection_info_dict == {}
...
