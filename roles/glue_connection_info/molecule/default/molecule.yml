---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-glue-connection-info'].id | d(omit) }}"
            security_groups:
              - name: molecule-glue-connection-info-rds
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 3306
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1

        ec2_vpc_net_list:
          - name: molecule-glue-connection-info
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-glue-connection-info'].id | d(omit) }}"
            subnets:
              - name: molecule-glue-connection-info
                az: us-east-1a
                cidr: 192.168.0.0/24

        glue_connection_info_name: "{{ glue_connection_list.0.name }}"

        glue_connection_list:
          - name: molecule-glue-connection-info
            availability_zone: us-east-1a
            connection_properties:
              KAFKA_SSL_ENABLED: 'false'
            connection_type: NETWORK
            security_groups:
              - "{{ _ec2_security_group_info_dict['molecule-glue-connection-info-rds'].group_id |
                    d(omit) }}"
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-glue-connection-info'].id |
                           d(omit) }}"
...
