---
- name: Verify
  hosts: all
  tasks:
    # No info module exists, so a check-mode run reads each policy without changing it.
    - name: Ensure aws iam managed policies are gathered
      amazon.aws.iam_managed_policy:
        name: "{{ _policy.name }}"
        policy: "{{ _policy.policy | to_json }}"
        state: present
        validate_certs: true
      check_mode: true
      register: __iam_managed_policy_query
      loop: "{{ iam_managed_policy_list }}"
      loop_control:
        label: "{{ _policy.name }}"
        loop_var: _policy

    - name: Ensure aws iam managed policies are verified
      ansible.builtin.assert:
        quiet: true
        that:
          - not _query.changed
          - _query.policy.policy_name == _query._policy.name
      loop: "{{ __iam_managed_policy_query.results }}"
      loop_control:
        label: "{{ _query._policy.name }}"
        loop_var: _query
...
