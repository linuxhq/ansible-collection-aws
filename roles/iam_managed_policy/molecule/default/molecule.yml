---
provisioner:
  inventory:
    group_vars:
      all:
        iam_managed_policy_list:
          - name: molecule-admin
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: '*'
                  Resource: '*'

          - name: molecule-s3
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action: 's3:*'
                  Resource: '*'
...
