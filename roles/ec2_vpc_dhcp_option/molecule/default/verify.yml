---
- name: Verify
  hosts: all

  roles:
    - ec2_vpc_dhcp_option_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_vpc_dhcp_option_info_dict[_dopt.name].dhcp_options_id is defined
      loop: "{{ ec2_vpc_dhcp_option_list }}"
      loop_control:
        label: "{{ _dopt.name }}"
        loop_var: _dopt
...
