---
- name: Ensure aws session manager proxy randomized local port is generated
  tags:
    - ssm_proxy
  ansible.builtin.set_fact:
    __ssm_proxy_port_local:
      "{{ 65535 | ansible.builtin.random(start=1024) }}"

- name: Ensure information about aws session manager proxy instance is gathered
  tags:
    - ssm_proxy
  amazon.aws.ec2_instance_info:
    filters:
      instance-state-name: running
      'tag:Name': "{{ ssm_proxy_instance }}"
  register: __ssm_proxy_instance

- name: Ensure aws session manager proxy instance is connected
  tags:
    - ssm_proxy
  linuxhq.aws.ssm_instance_info:
    connection_status: true
    instance_ids:
      - "{{ __ssm_proxy_instance.instances.0.instance_id }}"
    validate_certs: true
  register: __ssm_proxy_connection
  retries: 30
  delay: 10
  until:
    - __ssm_proxy_connection.instances.0.connection_status | d('') == 'connected'

- name: Ensure aws session manager proxy parameters are generated
  tags:
    - ssm_proxy
  ansible.builtin.set_fact:
    __ssm_proxy_document:
      "{{ 'AWS-StartPortForwardingSession'
          if __ssm_proxy_loopback | bool else
          'AWS-StartPortForwardingSessionToRemoteHost' }}"
    __ssm_proxy_parameters:
      "{{ ({} if __ssm_proxy_loopback | bool else {'host': [ssm_proxy_host]}) |
          ansible.builtin.combine({'portNumber': [ssm_proxy_port | string],
                                   'localPortNumber': [__ssm_proxy_port_local | string]}) }}"
  vars:
    # SSM Agent forbids remote host forwarding to loopback targets.
    __ssm_proxy_loopback:
      "{{ ssm_proxy_host | string | trim is ansible.builtin.match(__ssm_proxy_loopback_regex, ignorecase=true) }}"
    __ssm_proxy_loopback_regex:
      '^(localhost([.]localdomain)?|127([.][0-9]{1,3}){3}|(0{0,4}:){2,7}0{0,3}1)$'

- name: Ensure aws session manager proxy is present
  tags:
    - ssm_proxy
  ansible.builtin.command:
    cmd: >
      aws ssm start-session
        --document-name "{{ __ssm_proxy_document }}"
        --parameters '{{ __ssm_proxy_parameters | to_json }}'
        --target "{{ __ssm_proxy_instance.instances.0.instance_id }}"
  changed_when: false
  async: 3600
  poll: 0

- name: Ensure aws session manager proxy local port is present
  tags:
    - ssm_proxy
  ansible.builtin.wait_for:
    connect_timeout: 5
    delay: 0
    host: localhost
    port: "{{ __ssm_proxy_port_local }}"
    sleep: 1
    state: started
    timeout: 60
...
