---
- name: Verify
  hosts: all
  tasks:
    - name: Ensure aws session manager proxy instance is identified
      amazon.aws.ec2_instance_info:
        filters:
          instance-state-name: running
          'tag:Name': "{{ ssm_proxy_instance }}"
        validate_certs: true
      register: __ssm_proxy_instance

    - name: Ensure aws session manager proxy processes are gathered
      ansible.builtin.command:
        cmd: >
          pgrep -f "session-manager-plugin.*{{ __ssm_proxy_instance.instances.0.instance_id }}"
      register: __ssm_proxy_processes
      changed_when: false
      failed_when: false

    - name: Ensure aws session manager proxy is verified
      ansible.builtin.assert:
        that:
          - __ssm_proxy_processes.rc == 0
...
