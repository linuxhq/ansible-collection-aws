---
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    ANSIBLE_DEPRECATION_WARNINGS: false
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        acm_certificate_list:
          - domain_name: molecule.aws.linuxhq.dev
            type: amazon_issued
            zone: aws.linuxhq.dev

          - domain_name: molecule.aws.linuxhq.net
            subject_alternative_names:
              - molecule-san.aws.linuxhq.net
            type: amazon_issued
            zone: aws.linuxhq.net

          - domain_name: molecule.aws.linuxhq.org
            subject_alternative_names:
              - molecule-san1.aws.linuxhq.org
              - molecule-san2.aws.linuxhq.org
            type: amazon_issued
            zone: aws.linuxhq.org

          - domain_name: molecule-import.linuxhq.net
            certificate: "{{ lookup('ansible.builtin.file', molecule_certificate_dir ~ '/molecule-import.linuxhq.net.crt', errors='ignore') | d(omit, true) }}"
            private_key: "{{ lookup('ansible.builtin.file', molecule_certificate_dir ~ '/molecule-import.linuxhq.net.key', errors='ignore') | d(omit, true) }}"
            type: imported

          - domain_name: molecule-import.linuxhq.org
            certificate: "{{ lookup('ansible.builtin.file', molecule_certificate_dir ~ '/molecule-import.linuxhq.org.crt', errors='ignore') | d(omit, true) }}"
            private_key: "{{ lookup('ansible.builtin.file', molecule_certificate_dir ~ '/molecule-import.linuxhq.org.key', errors='ignore') | d(omit, true) }}"
            type: imported

        # prepare.yml generates a short-lived self-signed certificate and key for each imported domain here.
        molecule_certificate_dir: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/certificates"
        molecule_imported_domain_names:
          - molecule-import.linuxhq.net
          - molecule-import.linuxhq.org

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
