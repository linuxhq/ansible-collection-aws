---
- name: Ensure aws certificate manager certificate is absent
  tags:
    - acm_certificate
  community.aws.acm_certificate:
    domain_name: "{{ _certificate.domain_name }}"
    state: absent
    validate_certs: true

- name: Ensure aws certificate manager certificate resource records are absent
  tags:
    - acm_certificate
  amazon.aws.route53:
    record: "{{ _dns.resource_record.name }}"
    state: absent
    type: "{{ _dns.resource_record.type }}"
    validate_certs: true
    value: "{{ _dns.resource_record.value }}"
    zone: "{{ _certificate.zone }}"
  # Imported certificates list their domains without validation records.
  loop: "{{ __acm_certificate_dict[_certificate.domain_name].domain_validation_options |
            d([]) |
            selectattr('resource_record', 'defined') }}"
  loop_control:
    label: "{{ _dns.resource_record.name | d(none) }}"
    loop_var: _dns
...
