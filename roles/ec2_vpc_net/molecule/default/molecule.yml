---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        ec2_vpc_net_list:
          - name: molecule-00
            cidr_block: 10.0.0.0/16
          - name: molecule-01
            cidr_block: 10.1.0.0/16
          - name: molecule-02
            cidr_block: 10.2.0.0/16
          - name: molecule-03
            cidr_block: 10.3.0.0/16
          - name: molecule-04
            cidr_block: 10.4.0.0/16

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
