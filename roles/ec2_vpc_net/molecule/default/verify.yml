---
- name: Verify
  hosts: all

  roles:
    - ec2_vpc_net_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_vpc_net_info_dict[_vpc.name].cidr_block == _vpc.cidr_block
      loop: "{{ ec2_vpc_net_list }}"
      loop_control:
        label: "{{ _vpc.name }}"
        loop_var: _vpc
...
