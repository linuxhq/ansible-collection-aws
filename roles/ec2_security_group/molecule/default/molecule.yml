---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ec2-security-group'].id | d(omit) }}"
            security_groups:
              - name: molecule-ec2-security-group-ftp
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 21
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-ssh
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 22
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-telnet
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 23
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-smtp
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 25
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-domain
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 53
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-http
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 80
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-pop3
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 110
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-imap
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 143
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-ldap
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 389
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-https
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 443
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-ircd
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 6667
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-ircs
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 6697
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
              - name: molecule-ec2-security-group-cluster
                rules:
                  - group_name: molecule-ec2-security-group-cluster
                    proto: -1
                  - group_name: molecule-ec2-security-group-ssh
                    ports:
                      - 22
                    proto: tcp
                rules_egress:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    proto: -1

        ec2_vpc_net_list:
          - name: molecule-ec2-security-group
            cidr_block: 10.0.0.0/16
...
