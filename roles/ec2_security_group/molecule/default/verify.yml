---
- name: Verify
  hosts: all

  roles:
    - ec2_security_group_info
    - ec2_vpc_net_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_security_group_info_dict[_sg.name].group_id is defined
          - _ec2_security_group_info_dict[_sg.name].vpc_id ==
              _ec2_vpc_net_info_dict['molecule'].id
      loop: "{{ ec2_security_group_list.0.security_groups }}"
      loop_control:
        label: "{{ _sg.name }}"
        loop_var: _sg
...
