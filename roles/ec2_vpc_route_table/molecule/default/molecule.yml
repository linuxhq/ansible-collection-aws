---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        ec2_vpc_net_list:
          - name: molecule
            cidr_block: 10.0.0.0/16

        ec2_vpc_igw_list:
          - name: molecule
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
            subnets:
              - name: molecule-pub-a
                az: us-west-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block | ansible.utils.ipsubnet(24,0) }}"
              - name: molecule-pub-b
                az: us-west-1b
                cidr: "{{ ec2_vpc_net_list.0.cidr_block | ansible.utils.ipsubnet(24,1) }}"
              - name: molecule-pub-c
                az: us-west-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block | ansible.utils.ipsubnet(24,2) }}"
              - name: molecule-pvt-a
                az: us-west-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block | ansible.utils.ipsubnet(24,3) }}"
              - name: molecule-pvt-b
                az: us-west-1b
                cidr: "{{ ec2_vpc_net_list.0.cidr_block | ansible.utils.ipsubnet(24,4) }}"
              - name: molecule-pvt-c
                az: us-west-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block | ansible.utils.ipsubnet(24,5) }}"

        ec2_vpc_nat_gateway_info_filters:
          state:
            - available

        ec2_vpc_nat_gateway_list:
          - name: molecule-pub-a
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-pub-a'].id }}"
            wait: true
          - name: molecule-pub-b
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-pub-b'].id }}"
            wait: true
          - name: molecule-pub-c
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-pub-c'].id }}"
            wait: true

        ec2_vpc_route_table_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
            route_tables:
              - name: "molecule-pub"
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id: igw
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-pub-a'].id }}"
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-pub-b'].id }}"
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-pub-c'].id }}"

              - name: "molecule-pvt-a"
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id: "{{ _ec2_vpc_nat_gateway_info_dict['molecule-pub-a'].nat_gateway_id }}"
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-pvt-a'].id }}"

              - name: "molecule-pvt-b"
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id: "{{ _ec2_vpc_nat_gateway_info_dict['molecule-pub-b'].nat_gateway_id }}"
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-pvt-b'].id }}"

              - name: "molecule-pvt-c"
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id: "{{ _ec2_vpc_nat_gateway_info_dict['molecule-pub-c'].nat_gateway_id }}"
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-pvt-c'].id }}"

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
