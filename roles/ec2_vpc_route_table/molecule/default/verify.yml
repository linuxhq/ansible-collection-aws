---
- name: Verify
  hosts: all

  roles:
    - ec2_vpc_nat_gateway_info
    - ec2_vpc_net_info
    - ec2_vpc_route_table_info
    - ec2_vpc_subnet_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_vpc_route_table_info_dict[_rtb.name].vpc_id ==
              _ec2_vpc_net_info_dict['molecule-ec2-vpc-route-table'].id
          - _ec2_vpc_route_table_info_dict[_rtb.name].associations |
            map(attribute='subnet_id') |
            sort ==
              _rtb.subnets | sort
      loop: "{{ ec2_vpc_route_table_list.0.route_tables }}"
      loop_control:
        label: "{{ _rtb.name }}"
        loop_var: _rtb
...
