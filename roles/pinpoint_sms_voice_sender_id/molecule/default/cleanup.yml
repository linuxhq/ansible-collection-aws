---
- name: Cleanup
  hosts: all
  roles:
    - pinpoint_sms_voice_sender_id_info

  post_tasks:
    - name: Ensure deletion protection is disabled
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_sender_id
      when:
        - _pinpoint_sms_voice_sender_id_info_list |
          selectattr('deletion_protection_enabled') | list | length > 0

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        pinpoint_sms_voice_sender_id_list:
          "{{ pinpoint_sms_voice_sender_id_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - pinpoint_sms_voice_sender_id
        - pinpoint_sms_voice_sender_id_info
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup

    - name: Ensure sender id release is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_sender_id_info_list == []
...
