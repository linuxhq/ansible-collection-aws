---
- name: Verify
  hosts: all
  roles:
    - pinpoint_sms_voice_sender_id_info

  post_tasks:
    - name: Ensure sender id is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].deletion_protection_enabled is false
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].message_types |
              map('upper') |
              list == ['TRANSACTIONAL']
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].sender_id_arn is defined
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].tags.molecule ==
              'pinpoint_sms_voice_sender_id'
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].tags | length == 1

    - name: Ensure message type change is refused
      linuxhq.aws.pinpoint_sms_voice_sender_id:
        iso_country_code: DE
        message_types:
          - PROMOTIONAL
        sender_id: MOLECULESID
        state: present
        validate_certs: true
      register: __pinpoint_sms_voice_sender_id_message_types
      failed_when:
        - "'AWS does not allow message types to change' not in
           __pinpoint_sms_voice_sender_id_message_types.msg | d('')"

    - name: Ensure protected inventory list is formatted
      ansible.builtin.set_fact:
        pinpoint_sms_voice_sender_id_protected_list:
          "{{ pinpoint_sms_voice_sender_id_list |
              map('combine',
                  {'deletion_protection_enabled': true,
                   'tags': {'molecule': 'pinpoint_sms_voice_sender_id',
                            'molecule-step': 'protected'}}) }}"

    - name: Ensure deletion protection and tags are updated
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_sender_id
      vars:
        pinpoint_sms_voice_sender_id_list: "{{ pinpoint_sms_voice_sender_id_protected_list }}"

    - name: Ensure updated sender id information is gathered
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_sender_id_info

    - name: Ensure updated sender id is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].deletion_protection_enabled is true
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].tags['molecule-step'] == 'protected'
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].tags | length == 2

    - name: Ensure protected sender id release is refused
      linuxhq.aws.pinpoint_sms_voice_sender_id:
        iso_country_code: DE
        sender_id: MOLECULESID
        state: absent
        validate_certs: true
      register: __pinpoint_sms_voice_sender_id_protected
      failed_when:
        - "'deletion protection is enabled' not in
           __pinpoint_sms_voice_sender_id_protected.msg | d('')"

    - name: Ensure deletion protection is disabled and extra tags are purged
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_sender_id

    - name: Ensure restored sender id information is gathered
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_sender_id_info

    - name: Ensure restored sender id is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].deletion_protection_enabled is false
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].tags.molecule ==
              'pinpoint_sms_voice_sender_id'
          - _pinpoint_sms_voice_sender_id_info_dict['MOLECULESID/DE'].tags | length == 1

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        pinpoint_sms_voice_sender_id_list:
          "{{ pinpoint_sms_voice_sender_id_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - pinpoint_sms_voice_sender_id
        - pinpoint_sms_voice_sender_id_info
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify

    - name: Ensure sender id release is verified
      ansible.builtin.assert:
        that:
          - "'MOLECULESID/DE' not in _pinpoint_sms_voice_sender_id_info_dict"
...
