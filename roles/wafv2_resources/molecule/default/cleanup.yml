---
- name: Cleanup
  hosts: all

  roles:
    - ec2_security_group_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info
    - elb_application_lb_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_security_group_list:
          "{{ ec2_security_group_list |
              map('combine', {'security_groups': ec2_security_group_list.0.security_groups |
                                                 map('combine', {'state': 'absent'})}) }}"
        ec2_vpc_igw_list:
          "{{ ec2_vpc_igw_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              map('combine', {'state': 'absent'}) }}"
        elb_application_lb_list:
          "{{ elb_application_lb_list |
              map('combine', {'state': 'absent'}) }}"
        elb_target_group_list:
          "{{ elb_target_group_list |
              map('combine', {'state': 'absent'}) }}"
        wafv2_resources_list:
          "{{ wafv2_resources_list |
              map('combine', {'state': 'absent'}) }}"
        wafv2_web_acl_list:
          "{{ wafv2_web_acl_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - wafv2_resources
        - wafv2_web_acl
        - elb_application_lb
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup

    - name: Ensure application load balancer network interfaces are deleted
      amazon.aws.ec2_eni_info:
        filters:
          description: ELB app/molecule-wafv2-resources/*
      register: _eni_query
      delay: 10
      retries: 60
      until: _eni_query.network_interfaces | length == 0

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - elb_target_group
        - ec2_security_group
        - ec2_vpc_subnet
        - ec2_vpc_igw
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
