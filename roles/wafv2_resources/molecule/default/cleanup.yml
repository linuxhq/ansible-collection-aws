---
- name: Cleanup
  hosts: all
  roles:
    - ec2_vpc_net_info
    - elb_application_lb_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_security_group_list:
          "{{ [{'vpc_id': _ec2_vpc_net_info_dict['molecule'].id,
                'security_groups': ec2_security_group_list.0.security_groups |
                  map('combine', {'state': 'absent'}) |
                  list}]
              if 'molecule' in _ec2_vpc_net_info_dict
              else [] }}"
        ec2_vpc_igw_list:
          "{{ (ec2_vpc_igw_list |
               map('combine', {'state': 'absent'}))
              if 'molecule' in _ec2_vpc_net_info_dict
              else [] }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ (ec2_vpc_subnet_list |
               map('combine', {'state': 'absent'}))
              if 'molecule' in _ec2_vpc_net_info_dict
              else [] }}"
        elb_application_lb_list:
          "{{ (elb_application_lb_list |
               map('combine', {'state': 'absent'}))
              if 'molecule' in _elb_application_lb_info_dict
              else [] }}"
        elb_target_group_list:
          "{{ (elb_target_group_list |
               map('combine', {'state': 'absent'}))
              if 'molecule' in _ec2_vpc_net_info_dict
              else [] }}"
        wafv2_resources_list:
          "{{ (wafv2_resources_list |
               map('combine', {'state': 'absent'}))
              if 'molecule' in _elb_application_lb_info_dict
              else [] }}"
        wafv2_web_acl_list:
          "{{ wafv2_web_acl_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure web acl associations are deleted
      ansible.builtin.include_role:
        name: wafv2_resources

    - name: Ensure web acl resources are gathered after deletion
      community.aws.wafv2_resources_info:
        name: "{{ _resource.name }}"
        scope: "{{ _resource.scope | upper }}"
        validate_certs: true
      register: __wafv2_resources_info
      loop: "{{ wafv2_resources_list }}"
      loop_control:
        label: "{{ _resource.name }}"
        loop_var: _resource

    - name: Ensure deleted web acl associations are verified
      ansible.builtin.assert:
        that:
          - _info._resource.arn not in _info.resource_arns | d([])
      loop: "{{ __wafv2_resources_info.results }}"
      loop_control:
        label: "{{ _info._resource.name }}"
        loop_var: _info

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - wafv2_web_acl
        - elb_application_lb
        - elb_target_group
        - ec2_security_group
        - ec2_vpc_subnet
        - ec2_vpc_igw
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
