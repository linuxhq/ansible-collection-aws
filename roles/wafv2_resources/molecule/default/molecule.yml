---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            security_groups:
              - name: molecule

        ec2_vpc_igw_list:
          - name: molecule
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"

        ec2_vpc_net_list:
          - name: molecule
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            subnets:
              - name: molecule-a
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,0) }}"
              - name: molecule-c
                az: us-east-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,1) }}"

        elb_application_lb_list:
          - name: molecule
            security_groups:
              - "{{ _ec2_security_group_info_dict['molecule'].group_id |
                    d(omit) }}"
            subnets:
              - "{{ _ec2_vpc_subnet_info_dict['molecule-a'].id | d(omit) }}"
              - "{{ _ec2_vpc_subnet_info_dict['molecule-c'].id | d(omit) }}"
            listeners:
              - Protocol: HTTP
                Port: 80
                DefaultActions:
                  - Type: forward
                    TargetGroupName: molecule
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"

        elb_target_group_list:
          - name: molecule
            health_check_interval: 10
            health_check_path: /healthcheck
            health_check_port: 8080
            health_check_protocol: http
            healthy_threshold_count: 3
            modify_targets: false
            port: 8080
            protocol: http
            stickiness_enabled: true
            target_type: instance
            unhealthy_threshold_count: 3
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"

        wafv2_resources_list:
          - arn: "{{ _elb_application_lb_info_dict['molecule'].load_balancer_arn |
                     d(omit) }}"
            name: molecule
            scope: regional

        wafv2_web_acl_list:
          - name: molecule
            scope: regional
            default_action: Allow
            rules:
              - name: AWS-AWSManagedRulesAmazonIpReputationList
                priority: 0
                override_action:
                  none: {}
                statement:
                  managed_rule_group_statement:
                    name: AWSManagedRulesAmazonIpReputationList
                    vendor_name: AWS
                visibility_config:
                  cloud_watch_metrics_enabled: true
                  metric_name: AWS-AWSManagedRulesAmazonIpReputationList
                  sampled_requests_enabled: true
...
