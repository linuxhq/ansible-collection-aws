---
- name: Verify
  hosts: all
  roles:
    - aws_az_info
    - aws_caller_info

    - role: lambda_info
      lambda_info_function_name: "{{ lambda_list.0.name }}"
      lambda_info_query: mappings

  post_tasks:
    - name: Ensure aws lambda event source mappings are verified
      ansible.builtin.assert:
        that:
          - _lambda_info_dict[lambda_list.0.name].mappings |
            map(attribute='event_source_arn') | sort ==
            lambda_event_list |
            map(attribute='source_params.source_arn') | sort
...
