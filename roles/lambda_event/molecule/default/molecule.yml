---
provisioner:
  inventory:
    group_vars:
      all:
        iam_role_list:
          - name: molecule-lambda-event-pass
            assume_role_policy_document:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: lambda.amazonaws.com
                  Action:
                    - sts:AssumeRole
            create_instance_profile: false
            delete_instance_profile: true
            managed_policies:
              - AmazonSQSFullAccess
              - ReadOnlyAccess

        lambda_event_list:
          - lambda_function_arn: "arn:aws:lambda:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:function:molecule-lambda-event-pass"
            event_source: sqs
            source_params:
              batch_size: 10
              enabled: true
              source_arn: "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-bounce"

          - lambda_function_arn: "arn:aws:lambda:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:function:molecule-lambda-event-pass"
            event_source: sqs
            source_params:
              batch_size: 10
              enabled: true
              source_arn: "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-complaint"

          - lambda_function_arn: "arn:aws:lambda:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:function:molecule-lambda-event-pass"
            event_source: sqs
            source_params:
              batch_size: 10
              enabled: true
              source_arn: "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-delivery"

        lambda_list:
          - name: molecule-lambda-event-pass
            architecture: x86_64
            environment_variables:
              MOLECULE: 'true'
            handler: lambda_function.lambda_handler
            memory_size: 128
            region: "{{ _aws_az_info_list_l.0[:-1] }}"
            role: "arn:aws:iam::{{ _aws_caller_info_account }}:role/molecule-lambda-event-pass"
            runtime: python3.11
            tracing_mode: PassThrough
            zip_file: "{{ role_path | d }}/files/pass.zip"

        sqs_queue_list:
          - name: molecule-lambda-event-bounce
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS:
                      - "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sqs:*
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-bounce"
                - Effect: Allow
                  Principal:
                    Service: sns.amazonaws.com
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-bounce"
                  Condition:
                    ArnEquals:
                      'aws:SourceArn':
                        "arn:aws:sns:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-bounce"

          - name: molecule-lambda-event-complaint
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS:
                      - "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sqs:*
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-complaint"
                - Effect: Allow
                  Principal:
                    Service: sns.amazonaws.com
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-complaint"
                  Condition:
                    ArnEquals:
                      'aws:SourceArn':
                        "arn:aws:sns:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-complaint"

          - name: molecule-lambda-event-delivery
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS:
                      - "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sqs:*
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-delivery"
                - Effect: Allow
                  Principal:
                    Service: sns.amazonaws.com
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-delivery"
                  Condition:
                    ArnEquals:
                      'aws:SourceArn':
                        "arn:aws:sns:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-lambda-event-delivery"
...
