---
- name: Cleanup
  hosts: all

  roles:
    - aws_az_info
    - aws_caller_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        iam_role_list:
          "{{ iam_role_list |
              map('combine', {'state': 'absent'}) }}"
        lambda_list:
          "{{ lambda_list |
              map('combine', {'state': 'absent'}) }}"
        lambda_event_list:
          "{{ lambda_event_list |
              map('combine', {'state': 'absent'}) }}"
        sqs_queue_list:
          "{{ sqs_queue_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - lambda_event
        - lambda
        - sqs_queue
        - iam_role
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
