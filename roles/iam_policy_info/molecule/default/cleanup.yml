---
- name: Cleanup
  hosts: all
  roles:
    - iam_policy_info

  post_tasks:
    # Removing an inline policy fails when its group, role, or user no longer exists.
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        iam_group_list:
          "{{ iam_group_list |
              map('combine', {'state': 'absent'}) }}"
        iam_policy_list:
          "{{ ((iam_policy_list |
                selectattr('iam_type', '==', 'group') |
                selectattr('iam_name', 'in', _iam_policy_info_group_dict)) +
               (iam_policy_list |
                selectattr('iam_type', '==', 'role') |
                selectattr('iam_name', 'in', _iam_policy_info_role_dict)) +
               (iam_policy_list |
                selectattr('iam_type', '==', 'user') |
                selectattr('iam_name', 'in', _iam_policy_info_user_dict))) |
              map('combine', {'state': 'absent'}) }}"
        iam_role_list:
          "{{ iam_role_list |
              map('combine', {'state': 'absent'}) }}"
        iam_user_list:
          "{{ iam_user_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - iam_policy
        - iam_role
        - iam_user
        - iam_group
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup

    # IAM is eventually consistent, so a deleted entity can still be listed briefly.
    - name: Ensure fixtures are absent
      linuxhq.aws.iam_policy_info:
        validate_certs: true
      register: __iam_policy_info_deleted
      retries: 12
      delay: 5
      until:
        - __iam_policy_info_deleted.group_policies | map(attribute='name') |
            intersect(['molecule-ec2', 'molecule-rds']) | list == []
        - __iam_policy_info_deleted.role_policies | map(attribute='name') |
            intersect(['molecule-s3']) | list == []
        - __iam_policy_info_deleted.user_policies | map(attribute='name') |
            intersect(['molecule-ec2']) | list == []
...
