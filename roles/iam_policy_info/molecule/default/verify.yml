---
- name: Verify
  hosts: all

  tasks:
    - name: Ensure role is included without filters
      ansible.builtin.include_role:
        name: iam_policy_info

    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _iam_policy_info_group_dict['molecule-iam-policy-info-rds'].all_policy_names is defined
          - _iam_policy_info_group_dict['molecule-iam-policy-info-rds'].policies.0.policy_document == iam_policy_list.1.policy_json
          - _iam_policy_info_group_dict['molecule-iam-policy-info-rds'].policy_names is defined
          - _iam_policy_info_group_dict['molecule-iam-policy-info-rds'].policy_names.0 == iam_policy_list.1.policy_name
          - _iam_policy_info_role_dict['molecule-iam-policy-info-s3'].policies.0.policy_document == iam_policy_list.2.policy_json
          - _iam_policy_info_role_dict['molecule-iam-policy-info-s3'].policy_names.0 == iam_policy_list.2.policy_name
          - _iam_policy_info_user_dict['molecule-iam-policy-info-ec2'].all_policy_names is defined
          - _iam_policy_info_user_dict['molecule-iam-policy-info-ec2'].policies.0.policy_document == iam_policy_list.0.policy_json
          - _iam_policy_info_user_dict['molecule-iam-policy-info-ec2'].policy_names is defined
          - _iam_policy_info_user_dict['molecule-iam-policy-info-ec2'].policy_names.0 == iam_policy_list.0.policy_name

    - name: Ensure role is included with group and policy names
      ansible.builtin.include_role:
        name: iam_policy_info
      vars:
        iam_policy_info_group_name: molecule-iam-policy-info-rds
        iam_policy_info_policy_name: MoleculeRdsFullAccess
        iam_policy_info_role_name: null
        iam_policy_info_user_name: null

    - name: Ensure info with group and policy names is verified
      ansible.builtin.assert:
        that:
          - _iam_policy_info_group_dict.keys() | list == ['molecule-iam-policy-info-rds']
          - _iam_policy_info_group_dict['molecule-iam-policy-info-rds'].policy_names == ['MoleculeRdsFullAccess']
          - _iam_policy_info_group_dict['molecule-iam-policy-info-rds'].policies.0.policy_document ==
              iam_policy_list.1.policy_json
          - _iam_policy_info_role_list == []
          - _iam_policy_info_user_list == []

    - name: Ensure role is included with role and policy names
      ansible.builtin.include_role:
        name: iam_policy_info
      vars:
        iam_policy_info_group_name: null
        iam_policy_info_policy_name: MoleculeS3FullAccess
        iam_policy_info_role_name: molecule-iam-policy-info-s3
        iam_policy_info_user_name: null

    - name: Ensure info with role and policy names is verified
      ansible.builtin.assert:
        that:
          - _iam_policy_info_role_dict.keys() | list == ['molecule-iam-policy-info-s3']
          - _iam_policy_info_role_dict['molecule-iam-policy-info-s3'].policy_names == ['MoleculeS3FullAccess']
          - _iam_policy_info_role_dict['molecule-iam-policy-info-s3'].policies.0.policy_document ==
              iam_policy_list.2.policy_json
          - _iam_policy_info_group_list == []
          - _iam_policy_info_user_list == []

    - name: Ensure role is included with user and policy names
      ansible.builtin.include_role:
        name: iam_policy_info
      vars:
        iam_policy_info_group_name: null
        iam_policy_info_policy_name: MoleculeEc2FullAccess
        iam_policy_info_role_name: null
        iam_policy_info_user_name: molecule-iam-policy-info-ec2

    - name: Ensure info with user and policy names is verified
      ansible.builtin.assert:
        that:
          - _iam_policy_info_user_dict.keys() | list == ['molecule-iam-policy-info-ec2']
          - _iam_policy_info_user_dict['molecule-iam-policy-info-ec2'].policy_names == ['MoleculeEc2FullAccess']
          - _iam_policy_info_user_dict['molecule-iam-policy-info-ec2'].policies.0.policy_document ==
              iam_policy_list.0.policy_json
          - _iam_policy_info_group_list == []
          - _iam_policy_info_role_list == []

    - name: Ensure role is included with an unmatched policy name
      ansible.builtin.include_role:
        name: iam_policy_info
      vars:
        iam_policy_info_group_name: molecule-iam-policy-info-rds
        iam_policy_info_policy_name: MoleculeMissing

    - name: Ensure info with an unmatched policy name is verified
      ansible.builtin.assert:
        that:
          - _iam_policy_info_group_dict.keys() | list == ['molecule-iam-policy-info-rds']
          - _iam_policy_info_group_dict['molecule-iam-policy-info-rds'].policy_names == []

    - name: Ensure role is included with a nonexistent role name
      ansible.builtin.include_role:
        name: iam_policy_info
      vars:
        iam_policy_info_group_name: null
        iam_policy_info_role_name: molecule-iam-policy-info-missing
        iam_policy_info_user_name: null

    - name: Ensure info with a nonexistent role name is verified
      ansible.builtin.assert:
        that:
          - _iam_policy_info_group_list == []
          - _iam_policy_info_role_list == []
          - _iam_policy_info_user_list == []
...
