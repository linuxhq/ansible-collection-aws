---
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    ANSIBLE_DEPRECATION_WARNINGS: false
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        iam_group_list:
          - name: molecule-ec2
          - name: molecule-rds

        iam_policy_list:
          - iam_name: molecule-ec2
            iam_type: user
            policy_json:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ec2:*
                  Resource:
                    - '*'
            policy_name: MoleculeEc2FullAccess

          - iam_name: molecule-rds
            iam_type: group
            policy_json:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - rds:*
                  Resource:
                    - '*'
            policy_name: MoleculeRdsFullAccess

          - iam_name: molecule-s3
            iam_type: role
            policy_json:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:*
                  Resource:
                    - '*'
            policy_name: MoleculeS3FullAccess

        iam_role_list:
          - name: molecule-s3
            assume_role_policy_document:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ec2.amazonaws.com
                  Action:
                    - sts:AssumeRole
            create_instance_profile: false
            delete_instance_profile: true

        iam_user_list:
          - name: molecule-ec2
          - name: molecule-rds

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
