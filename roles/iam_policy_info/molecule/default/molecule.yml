---
provisioner:
  inventory:
    group_vars:
      all:
        iam_group_list:
          - name: molecule-iam-policy-info-ec2
          - name: molecule-iam-policy-info-rds

        iam_policy_list:
          - iam_name: molecule-iam-policy-info-ec2
            iam_type: user
            policy_json:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ec2:*
                  Resource:
                    - '*'
            policy_name: MoleculeEc2FullAccess

          - iam_name: molecule-iam-policy-info-rds
            iam_type: group
            policy_json:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - rds:*
                  Resource:
                    - '*'
            policy_name: MoleculeRdsFullAccess

          - iam_name: molecule-iam-policy-info-s3
            iam_type: role
            policy_json:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - s3:*
                  Resource:
                    - '*'
            policy_name: MoleculeS3FullAccess

        iam_role_list:
          - name: molecule-iam-policy-info-s3
            assume_role_policy_document:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ec2.amazonaws.com
                  Action:
                    - sts:AssumeRole
            create_instance_profile: false
            delete_instance_profile: true

        iam_user_list:
          - name: molecule-iam-policy-info-ec2
          - name: molecule-iam-policy-info-rds
...
