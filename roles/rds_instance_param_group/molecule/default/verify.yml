---
- name: Verify
  hosts: all

  roles:
    - rds_instance_param_group_info

  tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _rds_instance_param_group_info_dict[_pg.name].db_parameter_group_family == _pg.engine
      loop: "{{ rds_instance_param_group_list }}"
      loop_control:
        label: "{{ _pg.name }}"
        loop_var: _pg
...
