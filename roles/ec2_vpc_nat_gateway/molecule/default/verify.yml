---
- name: Verify
  hosts: all
  roles:
    - ec2_vpc_nat_gateway_info
    - ec2_vpc_subnet_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_vpc_nat_gateway_info_dict[_nat.name].state == 'available'
          - _ec2_vpc_nat_gateway_info_dict[_nat.name].subnet_id == _nat.subnet_id
      loop: "{{ ec2_vpc_nat_gateway_list }}"
      loop_control:
        label: "{{ _nat.name }}"
        loop_var: _nat
...
