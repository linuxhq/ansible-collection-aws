---
provisioner:
  inventory:
    group_vars:
      all:
        iam_group_list:
          - name: molecule-iam-group-admin
            managed_policies:
              - AdministratorAccess
            purge_policies: true
            users:
              - molecule-iam-group-admin

          - name: molecule-iam-group-kopia
            managed_policies:
              - AmazonS3FullAccess
            purge_policies: true
            users:
              - molecule-iam-group-kopia

          - name: molecule-iam-group-molecule
            managed_policies:
              - AmazonEC2FullAccess
              - AmazonVPCReadOnlyAccess
            purge_policies: true
            users:
              - molecule-iam-group-molecule

        iam_user_list:
          - name: molecule-iam-group-admin
            purge_policies: true
          - name: molecule-iam-group-kopia
            purge_policies: true
          - name: molecule-iam-group-molecule
            purge_policies: true
...
