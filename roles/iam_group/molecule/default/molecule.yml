---
provisioner:
  inventory:
    group_vars:
      all:
        iam_group_list:
          - name: molecule-admin
            managed_policies:
              - AdministratorAccess
            purge_policies: true
            users:
              - molecule-admin

          - name: molecule-kopia
            managed_policies:
              - AmazonS3FullAccess
            purge_policies: true
            users:
              - molecule-kopia

          - name: molecule-molecule
            managed_policies:
              - AmazonEC2FullAccess
              - AmazonVPCReadOnlyAccess
            purge_policies: true
            users:
              - molecule-molecule

        iam_user_list:
          - name: molecule-admin
            purge_policies: true
          - name: molecule-kopia
            purge_policies: true
          - name: molecule-molecule
            purge_policies: true
...
