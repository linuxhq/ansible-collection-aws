---
- name: Verify
  hosts: all

  tasks:
    - name: Ensure aws iam group members are gathered
      amazon.aws.iam_user_info:
        group: "{{ _group.name }}"
        validate_certs: true
      register: __iam_group_query
      loop: "{{ iam_group_list }}"
      loop_control:
        label: "{{ _group.name }}"
        loop_var: _group

    - name: Ensure aws iam group members are verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _query.iam_users |
            map(attribute='user_name') |
            sort == _query._group.users |
            sort
      loop: "{{ __iam_group_query.results }}"
      loop_control:
        label: "{{ _query._group.name }}"
        loop_var: _query
...
