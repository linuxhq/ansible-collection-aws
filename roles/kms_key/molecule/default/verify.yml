---
- name: Verify
  hosts: all
  roles:
    - aws_caller_info
    - kms_key_info

  post_tasks:
    - name: Ensure aws kms keys are verified
      ansible.builtin.assert:
        that:
          - _kms_key_info_dict[_key.name].aliases.0 == _key.name
          - _kms_key_info_dict[_key.name].aws_account_id == _aws_caller_info_account
          - _kms_key_info_dict[_key.name].key_id is defined
      loop: "{{ kms_key_list }}"
      loop_control:
        label: "{{ _key.name }}"
        loop_var: _key
...
