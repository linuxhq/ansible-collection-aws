---
- name: Verify
  hosts: all

  roles:
    - route53_record_info

  tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _route53_record_info_list |
            selectattr('zone', 'match', _record.0.zone) |
            map(attribute='resource_record_sets') |
            flatten |
            selectattr('name', 'match', _record.1.record) |
            map(attribute='resource_records') |
            flatten |
            map(attribute='value') |
            first == _record.1.value
      loop:
        "{{ q('ansible.builtin.subelements',
              route53_record_list,
              'records') }}"
      loop_control:
        label: "{{ _record.1.record }}"
        loop_var: _record
...
