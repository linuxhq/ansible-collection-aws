---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        ec2_ami_info_list:
          - name: 'AlmaLinux OS 9'
            filters:
              owner-alias: aws-marketplace
              product-code: 3kukoxmnoighcsbjd0u4nq9ds
              product-code.type: marketplace
              is-public: true
              virtualization-type: hvm

        ec2_instance_list:
          - name: molecule-a
            exact_count: 3
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t2.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-pvt-a'].id }}"
          - name: molecule-b
            exact_count: 3
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t2.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-pvt-b'].id }}"
          - name: molecule-c
            exact_count: 3
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t2.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-pvt-c'].id }}"

        ec2_vpc_net_list:
          - name: molecule
            cidr_block: 10.0.0.0/16

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
            subnets:
              - name: molecule-pub-a
                az: us-west-1a
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,0) }}"
              - name: molecule-pub-b
                az: us-west-1b
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,1) }}"
              - name: molecule-pub-c
                az: us-west-1c
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,2) }}"
              - name: molecule-pvt-a
                az: us-west-1a
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,3) }}"
              - name: molecule-pvt-b
                az: us-west-1b
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,4) }}"
              - name: molecule-pvt-c
                az: us-west-1c
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,5) }}"

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
