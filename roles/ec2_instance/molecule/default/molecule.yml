---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_ami_info_list:
          - name: 'AlmaLinux OS 9'
            filters:
              owner-alias: aws-marketplace
              product-code: 3kukoxmnoighcsbjd0u4nq9ds
              product-code.type: marketplace
              is-public: true
              virtualization-type: hvm

        ec2_instance_list:
          - name: molecule-ec2-instance-a
            exact_count: 3
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t3a.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-instance-pvt-a'].id |
                               d(omit) }}"
          - name: molecule-ec2-instance-c
            exact_count: 3
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t3a.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-instance-pvt-c'].id |
                               d(omit) }}"
          - name: molecule-ec2-instance-d
            exact_count: 3
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t3a.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-instance-pvt-d'].id |
                               d(omit) }}"

        ec2_vpc_net_list:
          - name: molecule-ec2-instance
            cidr_block: 10.0.0.0/16

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ec2-instance'].id | d(omit) }}"
            subnets:
              - name: molecule-ec2-instance-pub-a
                az: us-east-1a
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,0) }}"
              - name: molecule-ec2-instance-pub-d
                az: us-east-1d
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,1) }}"
              - name: molecule-ec2-instance-pub-c
                az: us-east-1c
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,2) }}"
              - name: molecule-ec2-instance-pvt-a
                az: us-east-1a
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,3) }}"
              - name: molecule-ec2-instance-pvt-d
                az: us-east-1d
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,4) }}"
              - name: molecule-ec2-instance-pvt-c
                az: us-east-1c
                cidr: "{{ '10.0.0.0/16' | ansible.utils.ipsubnet(24,5) }}"
...
