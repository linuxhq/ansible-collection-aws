---
- name: Verify
  hosts: all
  roles:
    - ec2_ami_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

    - role: ec2_instance_info
      ec2_instance_info_filters:
        instance-state-name:
          - running

  post_tasks:
    - name: Ensure info is verified
      vars:
        __ec2_instance_matches:
          "{{ _ec2_instance_info_list |
              selectattr('tags.Name', 'eq', _i.name) |
              list }}"
      ansible.builtin.assert:
        quiet: true
        that:
          - __ec2_instance_matches | length == _i.exact_count
          - __ec2_instance_matches |
            map(attribute='instance_type') |
            unique == [_i.instance_type]
          - __ec2_instance_matches |
            map(attribute='subnet_id') |
            unique == [_i.vpc_subnet_id]
      loop: "{{ ec2_instance_list }}"
      loop_control:
        label: "{{ _i.name }}"
        loop_var: _i
...
