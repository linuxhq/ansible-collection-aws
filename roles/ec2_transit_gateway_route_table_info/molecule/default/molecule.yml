---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_transit_gateway_list:
          - name: molecule-ec2-transit-gateway-route-table-info

        ec2_transit_gateway_route_table_list:
          - name: molecule-ec2-transit-gateway-route-table-info-00
            tags:
              molecule: ec2_transit_gateway_route_table_info
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule-ec2-transit-gateway-route-table-info'].transit_gateway_id |
                  d(omit) }}"
            routes:
              - destination_cidr_block: 192.168.0.0/24
                blackhole: true
              - destination_cidr_block: 192.168.1.0/24
                transit_gateway_attachment_id:
                  "{{ _ec2_transit_gateway_vpc_attachment_info_dict['molecule-ec2-transit-gateway-route-table-info'].transit_gateway_attachment_id |
                      d(omit) }}"

          - name: molecule-ec2-transit-gateway-route-table-info-rtb
            purge_routes: true
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule-ec2-transit-gateway-route-table-info'].transit_gateway_id |
                  d(omit) }}"
            routes:
              - destination_cidr_block: 10.10.0.0/16
                blackhole: true
              - destination_cidr_block: 10.20.0.0/16
                transit_gateway_attachment_id:
                  "{{ _ec2_transit_gateway_vpc_attachment_info_dict['molecule-ec2-transit-gateway-route-table-info'].transit_gateway_attachment_id |
                      d(omit) }}"

        ec2_transit_gateway_vpc_attachment_list:
          - name: molecule-ec2-transit-gateway-route-table-info
            subnets:
              - "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-transit-gateway-route-table-info'].id | d(omit) }}"
            transit_gateway:
              "{{ _ec2_transit_gateway_info_dict['molecule-ec2-transit-gateway-route-table-info'].transit_gateway_id |
                  d(omit) }}"

        ec2_vpc_net_list:
          - name: molecule-ec2-transit-gateway-route-table-info
            cidr_block: 10.0.0.0/16

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ec2-transit-gateway-route-table-info'].id | d(omit) }}"
            subnets:
              - name: molecule-ec2-transit-gateway-route-table-info
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24, 0) }}"
...
