---
- name: Cleanup
  hosts: all
  roles:
    - ec2_transit_gateway_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  post_tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_transit_gateway_list:
          "{{ ec2_transit_gateway_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_transit_gateway_route_table_list:
          - name: molecule
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id | d(omit) }}"
            routes:
              - destination_cidr_block: 192.168.0.0/24
                state: absent
              - destination_cidr_block: 192.168.1.0/24
                state: absent
          - name: molecule-rtb
            state: absent
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id | d(omit) }}"

        ec2_transit_gateway_vpc_attachment_list:
          - name: molecule
            state: absent
            subnets:
              - "{{ _ec2_vpc_subnet_info_dict['molecule'].id | d(omit) }}"
            transit_gateway:
              "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id | d(omit) }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              selectattr('vpc_id', 'defined') |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ec2_transit_gateway_route_table
        - ec2_transit_gateway_vpc_attachment
        - ec2_transit_gateway
        - ec2_vpc_subnet
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
