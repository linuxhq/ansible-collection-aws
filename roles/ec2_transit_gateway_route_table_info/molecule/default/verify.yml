---
- name: Verify
  hosts: all

  roles:
    - ec2_transit_gateway_info

  post_tasks:
    - name: Ensure role is included without filters
      ansible.builtin.include_role:
        name: ec2_transit_gateway_route_table_info

    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _ec2_transit_gateway_route_table_info_dict['molecule-00'].state == 'available'
          - _ec2_transit_gateway_route_table_info_dict['molecule-00'].tags.molecule ==
              'ec2_transit_gateway_route_table_info'
          - _ec2_transit_gateway_route_table_info_dict['molecule-00'].transit_gateway_id ==
              _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id
          - _ec2_transit_gateway_route_table_info_dict['molecule-00'].transit_gateway_route_table_id is defined
          - _ec2_transit_gateway_route_table_info_dict['molecule-00'].routes |
            length == 2
          - _ec2_transit_gateway_route_table_info_dict['molecule-rtb'].state == 'available'
          - _ec2_transit_gateway_route_table_info_dict['molecule-rtb'].transit_gateway_id ==
              _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id
          - _ec2_transit_gateway_route_table_info_dict['molecule-rtb'].transit_gateway_route_table_id is defined
          - _ec2_transit_gateway_route_table_info_dict['molecule-rtb'].routes |
            length == 2

    - name: Ensure route table id filter target is generated
      ansible.builtin.set_fact:
        ec2_transit_gateway_route_table_info_id_filter:
          "{{ _ec2_transit_gateway_route_table_info_dict['molecule-rtb'].transit_gateway_route_table_id }}"

    - name: Ensure role is included with route table id
      ansible.builtin.include_role:
        name: ec2_transit_gateway_route_table_info
      vars:
        ec2_transit_gateway_route_table_info_transit_gateway_route_table_ids:
          - "{{ ec2_transit_gateway_route_table_info_id_filter }}"

    - name: Ensure info with route table id is verified
      ansible.builtin.assert:
        that:
          - _ec2_transit_gateway_route_table_info_list | length == 1
          - _ec2_transit_gateway_route_table_info_dict['molecule-rtb'].transit_gateway_route_table_id ==
              ec2_transit_gateway_route_table_info_id_filter

    - name: Ensure role is included with a missing route table id
      ansible.builtin.include_role:
        name: ec2_transit_gateway_route_table_info
      vars:
        ec2_transit_gateway_route_table_info_transit_gateway_route_table_ids:
          - tgw-rtb-0123456789abcdef0

    - name: Ensure info with a missing route table id is verified
      ansible.builtin.assert:
        that:
          - _ec2_transit_gateway_route_table_info_list == []
          - _ec2_transit_gateway_route_table_info_dict == {}

    - name: Ensure role is included with filters
      ansible.builtin.include_role:
        name: ec2_transit_gateway_route_table_info
      vars:
        ec2_transit_gateway_route_table_info_filters:
          tag:Name: molecule-00

    - name: Ensure info with filters is verified
      ansible.builtin.assert:
        that:
          - _ec2_transit_gateway_route_table_info_list | length == 1
          - _ec2_transit_gateway_route_table_info_dict.keys() |
            list == ['molecule-00']
...
