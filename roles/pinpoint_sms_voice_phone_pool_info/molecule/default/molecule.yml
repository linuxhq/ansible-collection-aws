---
provisioner:
  inventory:
    group_vars:
      all:
        pinpoint_sms_voice_phone_number_list:
          - name: molecule-pinpoint-sms-voice-phone-pool-info-simulator
            iso_country_code: US
            message_type: TRANSACTIONAL
            number_capabilities:
              - SMS
            number_type: SIMULATOR

        pinpoint_sms_voice_phone_pool_info_filters:
          message-type:
            "{{ pinpoint_sms_voice_phone_pool_list |
                map(attribute='message_type') }}"

        pinpoint_sms_voice_phone_pool_list:
          - name: molecule-pinpoint-sms-voice-phone-pool-info
            tags:
              molecule: pinpoint_sms_voice_phone_pool_info
            origination_identity:
              "{{ _pinpoint_sms_voice_phone_number_info_dict[
                    'molecule-pinpoint-sms-voice-phone-pool-info-simulator'
                  ].phone_number_id |
                  d(omit) }}"
            iso_country_code: US
            message_type: TRANSACTIONAL
...
