---
- name: Verify
  hosts: all

  roles:
    - pinpoint_sms_voice_phone_number_info

  post_tasks:
    - name: Ensure role is included without filters
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_pool_info

    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-sms-voice-phone-pool-info'].message_type ==
              'TRANSACTIONAL'
          - _pinpoint_sms_voice_phone_pool_info_dict[
              'molecule-pinpoint-sms-voice-phone-pool-info'
            ].origination_identities |
              length == 1
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-sms-voice-phone-pool-info'].pool_arn is defined
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-sms-voice-phone-pool-info'].pool_id is defined
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-sms-voice-phone-pool-info'].status == 'ACTIVE'
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-sms-voice-phone-pool-info'].tags.molecule ==
              'pinpoint_sms_voice_phone_pool_info'

    - name: Ensure pool id filter target is generated
      ansible.builtin.set_fact:
        pinpoint_sms_voice_phone_pool_info_id_filter:
          "{{ _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-sms-voice-phone-pool-info'].pool_id }}"

    - name: Ensure role is included with pool id
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_pool_info
      vars:
        pinpoint_sms_voice_phone_pool_info_pool_ids:
          - "{{ pinpoint_sms_voice_phone_pool_info_id_filter }}"
          - pool-00000000000000000000000000000000

    - name: Ensure info with pool id is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_phone_pool_info_list | length == 1
          - _pinpoint_sms_voice_phone_pool_info_list.0.pool_id ==
              pinpoint_sms_voice_phone_pool_info_id_filter

    - name: Ensure role is included with a missing pool id
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_pool_info
      vars:
        pinpoint_sms_voice_phone_pool_info_pool_ids:
          - pool-00000000000000000000000000000000

    - name: Ensure info with a missing pool id is empty
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_phone_pool_info_list == []
          - _pinpoint_sms_voice_phone_pool_info_dict == {}

    - name: Ensure role is included with filters
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_pool_info
      vars:
        pinpoint_sms_voice_phone_pool_info_filters:
          message-type: TRANSACTIONAL

    - name: Ensure info with filters is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-sms-voice-phone-pool-info'].pool_id is defined
...
