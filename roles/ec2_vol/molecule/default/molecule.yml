---
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    ANSIBLE_DEPRECATION_WARNINGS: false
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        ec2_ami_info_list:
          - name: 'AlmaLinux OS 9'
            filters:
              owner-alias: aws-marketplace
              product-code: 3kukoxmnoighcsbjd0u4nq9ds
              product-code.type: marketplace
              is-public: true
              virtualization-type: hvm

        ec2_instance_info_filters:
          instance-state-name:
            - running

        ec2_instance_list:
          - name: molecule-a
            exact_count: 1
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t2.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-a'].id }}"
          - name: molecule-c
            exact_count: 1
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t2.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-c'].id }}"

        ec2_vol_list:
          - instance: "{{ _ec2_instance_info_dict['molecule-a'].instance_id }}"
            volumes:
              - name: molecule-vol-a-01
                device_name: sdf
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-vol-a-02
                device_name: sdg
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-vol-a-03
                device_name: sdh
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-vol-a-04
                device_name: sdi
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-vol-a-05
                device_name: sdj
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-vol-a-06
                device_name: sdk
                volume_size: "{{ 10 | random(start=1) }}"

          - instance: "{{ _ec2_instance_info_dict['molecule-c'].instance_id }}"
            volumes:
              - name: molecule-vol-c-01
                device_name: sdf
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-vol-c-02
                device_name: sdg
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-vol-c-03
                device_name: sdh
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-vol-c-04
                device_name: sdi
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-vol-c-05
                device_name: sdj
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-vol-c-06
                device_name: sdk
                volume_size: "{{ 10 | random(start=1) }}"

        ec2_vpc_net_list:
          - name: molecule
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
            subnets:
              - name: molecule-a
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block | ansible.utils.ipsubnet(25, 0) }}"
              - name: molecule-c
                az: us-east-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block | ansible.utils.ipsubnet(25, 1) }}"

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
