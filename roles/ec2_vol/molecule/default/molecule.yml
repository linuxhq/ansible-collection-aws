---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_ami_info_list:
          - name: 'AlmaLinux OS 9'
            filters:
              owner-alias: aws-marketplace
              product-code: 3kukoxmnoighcsbjd0u4nq9ds
              product-code.type: marketplace
              is-public: true
              virtualization-type: hvm

        ec2_instance_info_filters:
          instance-state-name:
            - running

        ec2_instance_list:
          - name: molecule-ec2-vol-a
            exact_count: 1
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t3a.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vol-a'].id |
                               d(omit) }}"
          - name: molecule-ec2-vol-c
            exact_count: 1
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t3a.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vol-c'].id |
                               d(omit) }}"

        ec2_vol_list:
          - instance: "{{ _ec2_instance_info_dict['molecule-ec2-vol-a'].instance_id |
                          d(omit) }}"
            volumes:
              - name: molecule-ec2-vol-vol-a-01
                device_name: sdf
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-ec2-vol-vol-a-02
                device_name: sdg
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-ec2-vol-vol-a-03
                device_name: sdh
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-ec2-vol-vol-a-04
                device_name: sdi
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-ec2-vol-vol-a-05
                device_name: sdj
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-ec2-vol-vol-a-06
                device_name: sdk
                volume_size: "{{ 10 | random(start=1) }}"

          - instance: "{{ _ec2_instance_info_dict['molecule-ec2-vol-c'].instance_id |
                          d(omit) }}"
            volumes:
              - name: molecule-ec2-vol-vol-c-01
                device_name: sdf
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-ec2-vol-vol-c-02
                device_name: sdg
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-ec2-vol-vol-c-03
                device_name: sdh
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-ec2-vol-vol-c-04
                device_name: sdi
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-ec2-vol-vol-c-05
                device_name: sdj
                volume_size: "{{ 10 | random(start=1) }}"
              - name: molecule-ec2-vol-vol-c-06
                device_name: sdk
                volume_size: "{{ 10 | random(start=1) }}"

        ec2_vpc_net_list:
          - name: molecule-ec2-vol
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ec2-vol'].id | d(omit) }}"
            subnets:
              - name: molecule-ec2-vol-a
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25, 0) }}"
              - name: molecule-ec2-vol-c
                az: us-east-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25, 1) }}"
...
