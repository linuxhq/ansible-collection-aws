---
- name: Cleanup
  hosts: all
  roles:
    - ec2_ami_info
    - ec2_instance_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_instance_list:
          "{{ ec2_instance_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vol_list:
          - instance: "{{ ec2_vol_list.0.instance }}"
            volumes:
              "{{ ec2_vol_list.0.volumes |
                  map('combine', {'state': 'absent'}) }}"
          - instance: "{{ ec2_vol_list.1.instance }}"
            volumes:
              "{{ ec2_vol_list.1.volumes |
                  map('combine', {'state': 'absent'}) }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ec2_vol
        - ec2_instance
        - ec2_vpc_subnet
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
