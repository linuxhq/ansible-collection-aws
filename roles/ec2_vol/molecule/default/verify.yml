---
- name: Verify
  hosts: all
  roles:
    - ec2_vol_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_vol_info_dict[_vol.name].id is defined
      loop: "{{ ec2_vol_list |
                map(attribute='volumes') |
                flatten }}"
      loop_control:
        label: "{{ _vol.name }}"
        loop_var: _vol
...
