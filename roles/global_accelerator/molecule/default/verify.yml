---
- name: Verify
  hosts: all
  roles:
    - ec2_security_group_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info
    - elb_application_lb_info

  post_tasks:
    - name: Ensure global accelerator info role is included with endpoint groups
      ansible.builtin.include_role:
        name: global_accelerator_info
      vars:
        global_accelerator_info_include_endpoint_groups: true

    - name: Ensure endpoint groups stay on the listener whose ports overlap
      ansible.builtin.assert:
        that:
          - __global_accelerator_listeners | length == 2
          - __global_accelerator_listener_80.port_ranges | length == 1
          - __global_accelerator_listener_80.port_ranges.0.to_port == 81
          - __global_accelerator_listener_80.endpoint_groups | length == 1
          - __global_accelerator_listener_80.endpoint_groups.0.endpoint_group_region == 'us-east-1'
          - __global_accelerator_listener_80.endpoint_groups.0.traffic_dial_percentage == 50
          - __global_accelerator_listener_80.endpoint_groups.0.endpoint_descriptions | length == 1
          - __global_accelerator_listener_80.endpoint_groups.0.endpoint_descriptions.0.endpoint_id ==
              _elb_application_lb_info_dict['molecule-http-80'].load_balancer_arn
          - __global_accelerator_listener_80.endpoint_groups.0.endpoint_descriptions.0.weight == 200
          - __global_accelerator_listener_443.port_ranges | length == 1
          - __global_accelerator_listener_443.port_ranges.0.to_port == 444
          - __global_accelerator_listener_443.endpoint_groups | length == 1
          - __global_accelerator_listener_443.endpoint_groups.0.endpoint_group_region == 'us-east-1'
          - __global_accelerator_listener_443.endpoint_groups.0.traffic_dial_percentage == 100
          - __global_accelerator_listener_443.endpoint_groups.0.endpoint_descriptions | length == 1
          - __global_accelerator_listener_443.endpoint_groups.0.endpoint_descriptions.0.endpoint_id ==
              _elb_application_lb_info_dict['molecule-http-80'].load_balancer_arn
          - __global_accelerator_listener_443.endpoint_groups.0.endpoint_descriptions.0.weight == 128
      vars:
        __global_accelerator_listeners:
          "{{ _global_accelerator_info_dict['molecule-global-accelerator-00'].listeners }}"
        __global_accelerator_listener_80:
          "{{ __global_accelerator_listeners |
              selectattr('port_ranges.0.from_port', 'equalto', 80) |
              first }}"
        __global_accelerator_listener_443:
          "{{ __global_accelerator_listeners |
              selectattr('port_ranges.0.from_port', 'equalto', 443) |
              first }}"

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
            security_groups:
              "{{ ec2_security_group_list.0.security_groups |
                  map('combine', {'state': 'absent'}) }}"
        ec2_vpc_igw_list:
          "{{ ec2_vpc_igw_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              map('combine', {'state': 'absent'}) }}"
        elb_application_lb_list:
          "{{ elb_application_lb_list |
              map('combine', {'state': 'absent'}) }}"
        elb_target_group_list:
          "{{ elb_target_group_list |
              map('combine', {'state': 'absent'}) }}"
        global_accelerator_list:
          "{{ global_accelerator_list_update |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure network interface owning roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - global_accelerator
        - elb_application_lb
        - elb_target_group
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify

    - name: Ensure information about leftover aws virtual private cloud nat gateways is gathered
      amazon.aws.ec2_vpc_nat_gateway_info:
        filters:
          state:
            - available
            - pending
          vpc-id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
        validate_certs: true
      register: __global_accelerator_nat_gateway_info

    - name: Ensure leftover aws virtual private cloud nat gateways are absent
      amazon.aws.ec2_vpc_nat_gateway:
        nat_gateway_id: "{{ _nat.nat_gateway_id }}"
        release_eip: true
        state: absent
        validate_certs: true
        wait: true
      loop: "{{ __global_accelerator_nat_gateway_info.result }}"
      loop_control:
        label: "{{ _nat.nat_gateway_id }}"
        loop_var: _nat

    - name: Ensure aws network interfaces are released
      amazon.aws.ec2_eni_info:
        filters:
          vpc-id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
        validate_certs: true
      register: __global_accelerator_eni_info
      delay: 15
      retries: 40
      until:
        - __global_accelerator_eni_info.network_interfaces | length == 0

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - ec2_security_group
        - ec2_vpc_subnet
        - ec2_vpc_igw
        - ec2_vpc_net
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify
...
