---
- name: Verify
  hosts: all
  roles:
    - iam_user_info

  post_tasks:
    - name: Ensure aws iam users are verified
      ansible.builtin.assert:
        that:
          - _iam_user_info_dict[_user.name].user_id is defined
      loop: "{{ iam_user_list }}"
      loop_control:
        label: "{{ _user.name }}"
        loop_var: _user
...
