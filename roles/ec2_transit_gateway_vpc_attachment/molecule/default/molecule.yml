---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_transit_gateway_info_filters:
          state:
            - available

        ec2_transit_gateway_list:
          - name: molecule

        ec2_transit_gateway_vpc_attachment_list:
          - name: molecule
            subnets:
              - "{{ _ec2_vpc_subnet_info_dict['molecule'].id | d(omit) }}"
            transit_gateway: "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id |
                                 d(omit) }}"

        ec2_vpc_net_list:
          - name: molecule
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            subnets:
              - name: molecule
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block }}"
...
