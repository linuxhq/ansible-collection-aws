---
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        ssm_document_list_create:
          - name: molecule-command-shell
            tags:
              molecule: ssm_document
            document_type: Command
            content:
              schemaVersion: '2.2'
              description: Run a shell command
              mainSteps:
                - action: aws:runShellScript
                  name: runShellScript
                  inputs:
                    runCommand:
                      - echo molecule
          - name: molecule-command-env
            tags:
              molecule: ssm_document
            document_type: Command
            content:
              schemaVersion: '2.2'
              description: Print environment
              mainSteps:
                - action: aws:runShellScript
                  name: printEnvironment
                  inputs:
                    runCommand:
                      - env | sort
          - name: molecule-session-shell
            tags:
              molecule: ssm_document
            document_type: Session
            content:
              schemaVersion: '1.0'
              description: Session Manager shell preferences
              sessionType: Standard_Stream
              inputs:
                idleSessionTimeout: 60
                runAsEnabled: false
                shellProfile:
                  linux: cd
                  windows: ''

        ssm_document_list_update:
          - name: molecule-command-shell
            tags:
              molecule: ssm_document
            document_type: Command
            content:
              schemaVersion: '2.2'
              description: Run an updated shell command
              mainSteps:
                - action: aws:runShellScript
                  name: runShellScript
                  inputs:
                    runCommand:
                      - echo molecule-updated
          - name: molecule-command-env
            tags:
              molecule: ssm_document
            document_type: Command
            content:
              schemaVersion: '2.2'
              description: Print updated environment
              mainSteps:
                - action: aws:runShellScript
                  name: printEnvironment
                  inputs:
                    runCommand:
                      - env | sort
                      - pwd
          - name: molecule-session-shell
            tags:
              molecule: ssm_document
            document_type: Session
            content:
              schemaVersion: '1.0'
              description: Updated Session Manager shell preferences
              sessionType: Standard_Stream
              inputs:
                idleSessionTimeout: 60
                runAsEnabled: false
                shellProfile:
                  linux: pwd
                  windows: ''

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
