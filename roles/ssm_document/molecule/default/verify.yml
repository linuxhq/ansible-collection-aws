---
- name: Verify
  hosts: all
  tasks:
    - name: Ensure document info is gathered
      ansible.builtin.include_role:
        name: ssm_document_info
      vars:
        ssm_document_info_filters:
          Owner: Self
          Name: "{{ ssm_document_list | map(attribute='name') | list }}"

    - name: Ensure documents are verified
      ansible.builtin.assert:
        that:
          - _ssm_document_info_dict[_document.name].content == _document.content
          - _ssm_document_info_dict[_document.name].document_type == _document.document_type
          - _ssm_document_info_dict[_document.name].status == 'Active'
          - _ssm_document_info_dict[_document.name].tags.molecule == 'ssm_document'
          - _ssm_document_info_dict[_document.name].tags.Name == _document.name
      loop: "{{ ssm_document_list }}"
      loop_control:
        label: "{{ _document.name }}"
        loop_var: _document

    - name: Ensure document content is changed
      ansible.builtin.include_role:
        name: ssm_document
      vars:
        ssm_document_list:
          - name: molecule-command-shell
            tags:
              molecule: ssm_document
            document_type: Command
            content:
              schemaVersion: '2.2'
              description: Run an updated shell command
              mainSteps:
                - action: aws:runShellScript
                  name: runShellScript
                  inputs:
                    runCommand:
                      - echo molecule-updated
          - name: molecule-command-env
            tags:
              molecule: ssm_document
            document_type: Command
            content:
              schemaVersion: '2.2'
              description: Print updated environment
              mainSteps:
                - action: aws:runShellScript
                  name: printEnvironment
                  inputs:
                    runCommand:
                      - env | sort
                      - pwd
          - name: molecule-session-shell
            tags:
              molecule: ssm_document
            document_type: Session
            content:
              schemaVersion: '1.0'
              description: Updated Session Manager shell preferences
              sessionType: Standard_Stream
              inputs:
                idleSessionTimeout: 60
                runAsEnabled: false
                shellProfile:
                  linux: pwd
                  windows: ''

    - name: Ensure changed document info is gathered
      ansible.builtin.include_role:
        name: ssm_document_info
      vars:
        ssm_document_info_filters:
          Owner: Self
          Name: "{{ ssm_document_list | map(attribute='name') | list }}"

    - name: Ensure changed document content is verified
      ansible.builtin.assert:
        that:
          - _ssm_document_info_dict['molecule-command-shell'].status == 'Active'
          - _ssm_document_info_dict['molecule-command-shell'].content.description ==
              'Run an updated shell command'
          - _ssm_document_info_dict['molecule-command-shell'].content.mainSteps.0.inputs.runCommand ==
              ['echo molecule-updated']
          - _ssm_document_info_dict['molecule-command-env'].status == 'Active'
          - _ssm_document_info_dict['molecule-command-env'].content.description ==
              'Print updated environment'
          - _ssm_document_info_dict['molecule-command-env'].content.mainSteps.0.inputs.runCommand ==
              ['env | sort', 'pwd']
          - _ssm_document_info_dict['molecule-session-shell'].status == 'Active'
          - _ssm_document_info_dict['molecule-session-shell'].content.description ==
              'Updated Session Manager shell preferences'
          - _ssm_document_info_dict['molecule-session-shell'].content.inputs.shellProfile.linux == 'pwd'

    - name: Ensure default document versions are queried
      linuxhq.aws.ssm_document_info:
        document_version: $DEFAULT
        name: "{{ _document.name }}"
      register: __ssm_document_default
      loop: "{{ ssm_document_list }}"
      loop_control:
        label: "{{ _document.name }}"
        loop_var: _document

    - name: Ensure changed versions are the default versions
      ansible.builtin.assert:
        that:
          - "'updated' in _default.document.content.description | lower"
      loop: "{{ __ssm_document_default.results }}"
      loop_control:
        label: "{{ _default._document.name }}"
        loop_var: _default
...
