---
driver:
  name: vagrant
  options:
    managed: true

platforms:
  - name: almalinux9
    box: bento/almalinux-9.6
    cpus: 4
    memory: 4096

provisioner:
  inventory:
    group_vars:
      all:
        profile_list:
          - name: molecule
            config:
              output: json
              region: us-east-1
            credentials:
              aws_access_key_id:
                "{{ lookup('ansible.builtin.ini',
                           'aws_access_key_id',
                           file='~/.aws/credentials',
                           section='molecule') }}"
              aws_secret_access_key:
                "{{ lookup('ansible.builtin.ini',
                           'aws_secret_access_key',
                           file='~/.aws/credentials',
                           section='molecule') }}"

          - name: dummy
            config:
              output: yaml
              region: us-east-1
            credentials:
              aws_access_key_id: DUMMY012345678901234
              aws_secret_access_key: DuMmYDuMmYDuMmYDuMmYDuMmYDuMmYDuMmYDuMmY
...
