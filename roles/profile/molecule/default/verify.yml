---
- name: Verify
  hosts: all

  environment:
    PATH: '/opt/awscli/bin'

  tasks:
    - name: Ensure profile awscli command is executed
      ansible.builtin.command:
        cmd:
          aws sts get-caller-identity
            --profile molecule
            --output text
            --query Account
      register: __profile_account
      changed_when: false

    - name: Ensure profile account is displayed
      ansible.builtin.debug:
        msg: "{{ __profile_account.stdout }}"

    - name: Ensure profile account is verified
      ansible.builtin.assert:
        that:
          - __profile_account.stdout is match('^[0-9]{12}$')
...
