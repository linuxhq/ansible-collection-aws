---
- name: Cleanup
  hosts: all
  roles:
    - notifications_contacts_info

  post_tasks:
    - name: Ensure deleted contact arn is saved
      ansible.builtin.set_fact:
        notifications_contacts_info_deleted_arn:
          "{{ (_notifications_contacts_info_dict[notifications_contacts_list.0.email_address] |
               d({})).arn | d(none) }}"

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        notifications_contacts_list:
          "{{ notifications_contacts_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - notifications_contacts
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup

    - name: Ensure role is included with a deleted contact arn
      ansible.builtin.include_role:
        name: notifications_contacts_info
      vars:
        notifications_contacts_info_arn: "{{ notifications_contacts_info_deleted_arn }}"
      when:
        - notifications_contacts_info_deleted_arn is truthy

    - name: Ensure info with a deleted contact arn is empty
      ansible.builtin.assert:
        that:
          - _notifications_contacts_info_list == []
          - _notifications_contacts_info_dict == {}
      when:
        - notifications_contacts_info_deleted_arn is truthy
...
