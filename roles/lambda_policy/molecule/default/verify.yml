---
- name: Verify
  hosts: all
  roles:
    - aws_az_info
    - aws_caller_info
    - elb_target_group_info

  post_tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        elb_target_group_list:
          "{{ elb_target_group_list |
              map('combine', {'state': 'absent'}) }}"
        lambda_policy_list:
          "{{ lambda_policy_list |
              map('combine', {'state': 'absent'}) }}"
        lambda_list:
          "{{ lambda_list |
              map('combine', {'state': 'absent'}) }}"
        iam_role_list:
          "{{ iam_role_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - lambda_policy
        - elb_target_group
        - lambda
        - iam_role
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify
...
