---
- name: Verify
  hosts: all

  roles:
    - aws_az_info
    - aws_caller_info

    - role: lambda_info
      lambda_info_function_name: "{{ lambda_list.0.name }}"
      lambda_info_query: policy

  post_tasks:
    - name: Ensure aws lambda policies are verified
      ansible.builtin.assert:
        that:
          - _lambda_info_dict[lambda_list.0.name].policy.statement |
            map(attribute='sid') |
            sort ==
              lambda_policy_list |
              map(attribute='statement_id') |
              sort
...
