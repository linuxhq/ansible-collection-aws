---
provisioner:
  inventory:
    group_vars:
      all:
        elb_target_group_list:
          - name: molecule-lambda
            modify_targets: false
            target_type: lambda

        iam_role_list:
          - name: molecule-pass
            assume_role_policy_document:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: lambda.amazonaws.com
                  Action:
                    - sts:AssumeRole
            create_instance_profile: false
            delete_instance_profile: true
            managed_policies:
              - ReadOnlyAccess

        lambda_list:
          - name: molecule-pass
            architecture: x86_64
            environment_variables:
              MOLECULE: 'true'
            handler: lambda_function.lambda_handler
            memory_size: 128
            region: "{{ _aws_az_info_list_l.0[:-1] }}"
            role: "arn:aws:iam::{{ _aws_caller_info_account }}:role/molecule-pass"
            runtime: python3.11
            tracing_mode: PassThrough
            zip_file: "{{ role_path | d }}/files/pass.zip"

        lambda_policy_list:
          - action: lambda:InvokeFunction
            function_name: molecule-pass
            principal: elasticloadbalancing.amazonaws.com
            source_arn: "{{ _elb_target_group_info_dict['molecule-lambda'].target_group_arn |
                            d(omit) }}"
            statement_id: molecule-elb-target-group
...
