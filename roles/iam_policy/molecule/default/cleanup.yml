---
- name: Cleanup
  hosts: all
  roles:
    - iam_policy_info

  post_tasks:
    # Removing an inline policy fails when its group or user no longer exists.
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        iam_group_list:
          "{{ iam_group_list |
              map('combine', {'state': 'absent'}) }}"
        iam_policy_list:
          "{{ ((iam_policy_list |
                selectattr('iam_type', '==', 'group') |
                selectattr('iam_name', 'in', _iam_policy_info_group_dict)) +
               (iam_policy_list |
                selectattr('iam_type', '==', 'user') |
                selectattr('iam_name', 'in', _iam_policy_info_user_dict))) |
              map('combine', {'state': 'absent'}) }}"
        iam_user_list:
          "{{ iam_user_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - iam_policy
        - iam_user
        - iam_group
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
