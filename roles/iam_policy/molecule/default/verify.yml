---
- name: Verify
  hosts: all
  roles:
    - iam_policy_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _iam_policy_info_user_dict[iam_policy_list.0.iam_name].policy_names ==
              [iam_policy_list.0.policy_name]
          - _iam_policy_info_user_dict[iam_policy_list.0.iam_name].policies.0.policy_document ==
              iam_policy_list.0.policy_json
          - _iam_policy_info_group_dict[iam_policy_list.1.iam_name].policy_names ==
              [iam_policy_list.1.policy_name]
          - _iam_policy_info_group_dict[iam_policy_list.1.iam_name].policies.0.policy_document ==
              iam_policy_list.1.policy_json
...
