---
provisioner:
  inventory:
    group_vars:
      all:
        iam_group_list:
          - name: molecule-rds

        iam_policy_list:
          - iam_name: molecule-ec2
            iam_type: user
            policy_json:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - ec2:*
                  Resource:
                    - '*'
            policy_name: MoleculeEc2FullAccess

          - iam_name: molecule-rds
            iam_type: group
            policy_json:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - rds:*
                  Resource:
                    - '*'
            policy_name: MoleculeRdsFullAccess

        iam_user_list:
          - name: molecule-ec2
...
