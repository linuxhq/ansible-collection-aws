---
- name: Verify
  hosts: all

  roles:
    - aws_caller_info
    - kms_key_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _kms_key_info_dict['molecule-kms-key-info-root'].aliases.0 == kms_key_list.0.name
          - _kms_key_info_dict['molecule-kms-key-info-root'].aws_account_id == _aws_caller_info_account
          - _kms_key_info_dict['molecule-kms-key-info-root'].key_arn is defined
          - _kms_key_info_dict['molecule-kms-key-info-root'].key_id is defined
          - _kms_key_info_dict['molecule-kms-key-info-root'].key_policies.0 == kms_key_list.0.policy
          - _kms_key_info_dict['molecule-kms-key-info-admin'].aliases.0 == kms_key_list.1.name
          - _kms_key_info_dict['molecule-kms-key-info-admin'].aws_account_id == _aws_caller_info_account
          - _kms_key_info_dict['molecule-kms-key-info-admin'].key_arn is defined
          - _kms_key_info_dict['molecule-kms-key-info-admin'].key_id is defined
...
