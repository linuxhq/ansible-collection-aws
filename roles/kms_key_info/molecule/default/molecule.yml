---
provisioner:
  inventory:
    group_vars:
      all:
        iam_role_list:
          - name: molecule-kms-key-info-admin
            assume_role_policy_document:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS: "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sts:AssumeRole
            create_instance_profile: false
            managed_policies:
              - AdministratorAccess

        kms_key_list:
          - name: molecule-kms-key-info-root
            pending_window: 7
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS: "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action: kms:*
                  Resource: '*'

          - name: molecule-kms-key-info-admin
            pending_window: 7
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS: "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action: kms:*
                  Resource: '*'
                - Effect: Allow
                  Principal:
                    AWS: '*'
                  Action: kms:*
                  Resource: '*'
                  Condition:
                    ArnEquals:
                      'aws:PrincipalArn':
                        - "arn:aws:iam::{{ _aws_caller_info_account }}:role/molecule-kms-key-info-admin"
...
