---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        iam_role_list:
          - name: admin
            assume_role_policy_document:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS: "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sts:AssumeRole
            create_instance_profile: false
            managed_policies:
              - AdministratorAccess

        kms_key_list:
          - name: molecule-root
            pending_window: 7
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS: "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action: kms:*
                  Resource: '*'

          - name: molecule-admin
            pending_window: 7
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS: "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action: kms:*
                  Resource: '*'
                - Effect: Allow
                  Principal:
                    AWS: '*'
                  Action: kms:*
                  Resource: '*'
                  Condition:
                    ArnEquals:
                      'aws:PrincipalArn':
                        - "arn:aws:iam::{{ _aws_caller_info_account }}:role/admin"

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
