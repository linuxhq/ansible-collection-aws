---
- name: Verify
  hosts: all
  roles:
    - ec2_vpc_igw_info
    - ec2_vpc_net_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _ec2_vpc_igw_info_dict['molecule'].attachments.0.state == 'available'
          - _ec2_vpc_igw_info_dict['molecule'].attachments.0.vpc_id == _ec2_vpc_net_info_dict['molecule'].id
...
