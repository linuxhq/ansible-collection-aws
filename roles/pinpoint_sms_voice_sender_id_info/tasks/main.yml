---
- name: Ensure information about aws end user messaging sms sender ids is gathered
  tags:
    - pinpoint_sms_voice_sender_id_info
  linuxhq.aws.pinpoint_sms_voice_sender_id_info:
    filters: "{{ pinpoint_sms_voice_sender_id_info_filters }}"
    max_results: "{{ pinpoint_sms_voice_sender_id_info_max_results or omit }}"
    owner: "{{ pinpoint_sms_voice_sender_id_info_owner or omit }}"
    sender_ids: "{{ pinpoint_sms_voice_sender_id_info_sender_ids or omit }}"
    validate_certs: true
  register: __pinpoint_sms_voice_sender_id_info_query

- name: Ensure list of aws end user messaging sms sender ids is generated
  tags:
    - pinpoint_sms_voice_sender_id_info
  ansible.builtin.set_fact:
    _pinpoint_sms_voice_sender_id_info_list:
      "{{ __pinpoint_sms_voice_sender_id_info_query.sender_ids | d([]) }}"

- name: Ensure dict of aws end user messaging sms sender ids is generated
  tags:
    - pinpoint_sms_voice_sender_id_info
  ansible.builtin.set_fact:
    _pinpoint_sms_voice_sender_id_info_dict:
      "{{ dict(_pinpoint_sms_voice_sender_id_info_list |
               map(attribute='sender_id') |
               zip(_pinpoint_sms_voice_sender_id_info_list |
                   map(attribute='iso_country_code')) |
               map('join', '/') |
               zip(_pinpoint_sms_voice_sender_id_info_list)) }}"
...
