---
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    ANSIBLE_DEPRECATION_WARNINGS: false
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        pinpoint_sms_voice_sender_id_list:
          - sender_id: MOLECULEINF
            iso_country_code: DE
            deletion_protection_enabled: false
            message_types:
              - TRANSACTIONAL
            tags:
              molecule: pinpoint_sms_voice_sender_id_info

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
