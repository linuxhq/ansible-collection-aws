---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_vpc_igw_list:
          - name: molecule
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"

        ec2_vpc_nat_gateway_info_filters:
          state:
            - available

        ec2_vpc_nat_gateway_list:
          - name: molecule-pub-a
            tags:
              molecule: ec2_vpc_nat_gateway_info
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-pub-a'].id |
                           d(omit) }}"
            wait: true
          - name: molecule-pub-c
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-pub-c'].id |
                           d(omit) }}"
            wait: true
          - name: molecule-pub-d
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-pub-d'].id |
                           d(omit) }}"
            wait: true

        ec2_vpc_net_list:
          - name: molecule
            cidr_block: 10.0.0.0/16

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            subnets:
              - name: molecule-pub-a
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,0) }}"
              - name: molecule-pub-c
                az: us-east-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,1) }}"
              - name: molecule-pub-d
                az: us-east-1d
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,2) }}"
...
