---
- name: Cleanup
  hosts: all
  roles:
    - ec2_vpc_net_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        route53_zone_list:
          "{{ (route53_zone_list | rejectattr('vpc_region', 'defined') | list +
               route53_zone_list | selectattr('vpc_id', 'defined') | list) |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - route53_zone
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
