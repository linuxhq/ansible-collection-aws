---
- name: Verify
  hosts: all

  roles:
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  post_tasks:
    - name: Ensure role is included without name
      ansible.builtin.include_role:
        name: rds_subnet_group_info
      vars:
        rds_subnet_group_info_name: null

    - name: Ensure info without name is verified
      ansible.builtin.assert:
        that:
          - _rds_subnet_group_info_dict['molecule-rds-subnet-group-info'].db_subnet_group_arn is defined
          - _rds_subnet_group_info_dict['molecule-rds-subnet-group-info'].db_subnet_group_description ==
              rds_subnet_group_list.0.name
          - _rds_subnet_group_info_dict['molecule-rds-subnet-group-info'].db_subnet_group_name ==
              rds_subnet_group_list.0.name
          - (_rds_subnet_group_info_dict['molecule-rds-subnet-group-info'].subnets |
             map(attribute='subnet_identifier') |
             sort) == (rds_subnet_group_list.0.subnets |
             sort)
          - _rds_subnet_group_info_dict['molecule-rds-subnet-group-info'].vpc_id ==
              _ec2_vpc_net_info_dict['molecule-rds-subnet-group-info'].id
          - _rds_subnet_group_info_dict['molecule-rds-subnet-group-info'].tags.Name == rds_subnet_group_list.0.name

    - name: Ensure role is included with name
      ansible.builtin.include_role:
        name: rds_subnet_group_info
      vars:
        rds_subnet_group_info_name: molecule-rds-subnet-group-info

    - name: Ensure info with name is verified
      ansible.builtin.assert:
        that:
          - _rds_subnet_group_info_list | length == 1
          - _rds_subnet_group_info_list.0.db_subnet_group_name == rds_subnet_group_list.0.name
          - _rds_subnet_group_info_dict.keys() |
            list == [rds_subnet_group_list.0.name]
          - _rds_subnet_group_info_dict['molecule-rds-subnet-group-info'].db_subnet_group_arn is defined

    - name: Ensure role is included with a missing name
      ansible.builtin.include_role:
        name: rds_subnet_group_info
      vars:
        rds_subnet_group_info_name: molecule-rds-subnet-group-info-missing

    - name: Ensure info with a missing name is verified
      ansible.builtin.assert:
        that:
          - _rds_subnet_group_info_list == []
          - _rds_subnet_group_info_dict == {}
...
