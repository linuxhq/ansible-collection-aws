---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_vpc_net_list:
          - name: molecule-rds-subnet-group-info
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-rds-subnet-group-info'].id | d(omit) }}"
            subnets:
              - name: molecule-rds-subnet-group-info-a
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,0) }}"
              - name: molecule-rds-subnet-group-info-c
                az: us-east-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,1) }}"

        rds_subnet_group_info_name: "{{ rds_subnet_group_list.0.name }}"

        rds_subnet_group_list:
          - name: molecule-rds-subnet-group-info
            subnets:
              - "{{ _ec2_vpc_subnet_info_dict['molecule-rds-subnet-group-info-a'].id | d(omit) }}"
              - "{{ _ec2_vpc_subnet_info_dict['molecule-rds-subnet-group-info-c'].id | d(omit) }}"
...
