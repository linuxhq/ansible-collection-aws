---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-efs'].id | d(omit) }}"
            security_groups:
              - name: molecule-efs-efs1
                rules:
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 2049
                    proto: tcp
              - name: molecule-efs-efs2
                rules:
                  - cidr_ip: 10.0.0.0/8
                    ports:
                      - 2049
                    proto: tcp
                rules_egress:
                  - cidr_ip: 10.0.0.0/8
                    ports:
                      - 0-65535
                    proto: tcp

        ec2_vpc_net_list:
          - name: molecule-efs
            cidr_block: 10.0.0.0/16

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-efs'].id | d(omit) }}"
            subnets:
              - name: molecule-efs-a
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,0) }}"
              - name: molecule-efs-c
                az: us-east-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,1) }}"
              - name: molecule-efs-d
                az: us-east-1d
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,2) }}"

        efs_list:
          - name: molecule-efs-efs1
            encrypt: true
            targets:
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-efs-a'].id |
                               d(omit) }}"
                security_groups:
                  - "{{ _ec2_security_group_info_dict['molecule-efs-efs1'].group_id |
                        d(omit) }}"
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-efs-c'].id |
                               d(omit) }}"
                security_groups:
                  - "{{ _ec2_security_group_info_dict['molecule-efs-efs1'].group_id |
                        d(omit) }}"
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-efs-d'].id |
                               d(omit) }}"
                security_groups:
                  - "{{ _ec2_security_group_info_dict['molecule-efs-efs1'].group_id |
                        d(omit) }}"

          - name: molecule-efs-efs2
            encrypt: true
            targets:
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-efs-a'].id |
                               d(omit) }}"
                security_groups:
                  - "{{ _ec2_security_group_info_dict['molecule-efs-efs2'].group_id |
                        d(omit) }}"
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-efs-c'].id |
                               d(omit) }}"
                security_groups:
                  - "{{ _ec2_security_group_info_dict['molecule-efs-efs2'].group_id |
                        d(omit) }}"
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-efs-d'].id |
                               d(omit) }}"
                security_groups:
                  - "{{ _ec2_security_group_info_dict['molecule-efs-efs2'].group_id |
                        d(omit) }}"
...
