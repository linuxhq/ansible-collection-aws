---
- name: Cleanup
  hosts: all
  roles:
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  tasks:
    # The efs role skips items without targets; state absent ignores them.
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            security_groups:
              "{{ ec2_security_group_list.0.security_groups |
                  map('combine', {'state': 'absent'}) }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          - state: absent
            subnets: "{{ ec2_vpc_subnet_list.0.subnets }}"
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
        efs_list:
          - name: molecule-efs1
            state: absent
            targets:
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-a'].id | d(omit) }}"
          - name: molecule-efs2
            state: absent
            targets:
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-a'].id | d(omit) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - efs
        - ec2_security_group
        - ec2_vpc_subnet
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
