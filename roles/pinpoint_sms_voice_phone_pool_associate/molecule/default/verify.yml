---
- name: Verify
  hosts: all
  roles:
    - pinpoint_sms_voice_phone_number_info
    - pinpoint_sms_voice_phone_pool_info
    - pinpoint_sms_voice_sender_id_info

  post_tasks:
    - name: Ensure sender id belongs to this scenario
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_sender_id_info_list | length == 1
          - _pinpoint_sms_voice_sender_id_info_list.0.tags.molecule ==
              'pinpoint_sms_voice_phone_pool_associate'

    - name: Ensure pool origination identities are verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-pool'].origination_identities |
            map(attribute='origination_identity') |
            sort ==
            [_pinpoint_sms_voice_phone_number_info_dict['molecule-pinpoint-simulator-1'].phone_number_id,
             _pinpoint_sms_voice_phone_number_info_dict['molecule-pinpoint-simulator-2'].phone_number_id,
             'MOLECULEPA'] |
            sort
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-pool'].origination_identities |
            selectattr('origination_identity', 'eq', 'MOLECULEPA') |
            map(attribute='iso_country_code') |
            list == ['DE']
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-pool'].origination_identities |
            selectattr('origination_identity', 'eq', 'MOLECULEPA') |
            map(attribute='origination_identity_arn') |
            list == [_pinpoint_sms_voice_sender_id_info_list.0.sender_id_arn]

    - name: Ensure sender id association is queried by arn
      linuxhq.aws.pinpoint_sms_voice_phone_pool_associate:
        iso_country_code: DE
        origination_identity: "{{ _pinpoint_sms_voice_sender_id_info_list.0.sender_id_arn }}"
        pool_id: "{{ _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-pool'].pool_id }}"
        state: present
        validate_certs: true
      register: __pinpoint_sms_voice_phone_pool_associate_query

    - name: Ensure sender id association is verified
      ansible.builtin.assert:
        that:
          - __pinpoint_sms_voice_phone_pool_associate_query is not changed
          - __pinpoint_sms_voice_phone_pool_associate_query.association.origination_identity == 'MOLECULEPA'
          - __pinpoint_sms_voice_phone_pool_associate_query.association.origination_identity_arn ==
            _pinpoint_sms_voice_sender_id_info_list.0.sender_id_arn
          - __pinpoint_sms_voice_phone_pool_associate_query.association.iso_country_code == 'DE'

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        pinpoint_sms_voice_phone_number_list:
          - "{{ pinpoint_sms_voice_phone_number_list.0 |
                combine({'phone_number_id':
                         _pinpoint_sms_voice_phone_number_info_dict[
                           'molecule-pinpoint-simulator-1'
                         ].phone_number_id,
                         'state':
                         'absent'}) }}"
          - "{{ pinpoint_sms_voice_phone_number_list.1 |
                combine({'phone_number_id':
                         _pinpoint_sms_voice_phone_number_info_dict[
                           'molecule-pinpoint-simulator-2'
                         ].phone_number_id,
                         'state':
                         'absent'}) }}"
        pinpoint_sms_voice_phone_pool_associate_list:
          - pool_id: "{{ _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-pool'].pool_id }}"
            iso_country_code: US
            associations:
              "{{ pinpoint_sms_voice_phone_pool_associate_list.0.associations[1:] |
                  map('combine', {'state': 'absent'}) }}"
          - pool_id: "{{ _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-pool'].pool_id }}"
            iso_country_code: DE
            associations:
              - origination_identity: MOLECULEPA
                state: absent
        pinpoint_sms_voice_phone_pool_list:
          "{{ pinpoint_sms_voice_phone_pool_list |
              map('combine',
                  {'pool_id':
                   _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-pool'].pool_id,
                   'state':
                   'absent'}) }}"
        pinpoint_sms_voice_sender_id_list:
          "{{ pinpoint_sms_voice_sender_id_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure role is included
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_pool_associate

    - name: Ensure sender id disassociation is queried by arn
      linuxhq.aws.pinpoint_sms_voice_phone_pool_associate:
        iso_country_code: DE
        origination_identity: "{{ _pinpoint_sms_voice_sender_id_info_list.0.sender_id_arn }}"
        pool_id: "{{ _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-pool'].pool_id }}"
        state: absent
        validate_certs: true
      register: __pinpoint_sms_voice_phone_pool_disassociate_query

    - name: Ensure sender id disassociation is verified
      ansible.builtin.assert:
        that:
          - __pinpoint_sms_voice_phone_pool_disassociate_query is not changed
          - __pinpoint_sms_voice_phone_pool_disassociate_query.association == {}

    - name: Ensure remaining pool information is gathered
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_pool_info

    - name: Ensure remaining pool origination identities are verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-pool'].origination_identities |
            map(attribute='origination_identity') |
            list ==
            [_pinpoint_sms_voice_phone_number_info_dict['molecule-pinpoint-simulator-1'].phone_number_id]
          - _pinpoint_sms_voice_phone_pool_info_dict['molecule-pinpoint-pool'].origination_identities |
            map(attribute='iso_country_code') |
            list == ['US']

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - pinpoint_sms_voice_phone_pool
        - pinpoint_sms_voice_phone_number
        - pinpoint_sms_voice_sender_id
        - pinpoint_sms_voice_sender_id_info
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify

    - name: Ensure sender id release is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_sender_id_info_list == []
...
