---
- name: Prepare
  hosts: all
  tasks:
    - name: Ensure sender id information is gathered
      ansible.builtin.command:
        cmd: >
          aws pinpoint-sms-voice-v2 describe-sender-ids
            --filters Name=sender-id,Values=MOLECULE Name=iso-country-code,Values=DE
            --query SenderIds[].SenderIdArn
            --output json
      register: __pinpoint_sms_voice_sender_id_query
      changed_when: false

    - name: Ensure existing sender id tags are gathered
      ansible.builtin.command:
        cmd: >
          aws pinpoint-sms-voice-v2 list-tags-for-resource
            --resource-arn {{ __pinpoint_sms_voice_sender_id_query.stdout | from_json | first }}
            --query Tags
            --output json
      register: __pinpoint_sms_voice_sender_id_tags
      changed_when: false
      when:
        - __pinpoint_sms_voice_sender_id_query.stdout |
          from_json |
          length > 0

    - name: Ensure existing sender id belongs to this scenario
      ansible.builtin.assert:
        that:
          - (__pinpoint_sms_voice_sender_id_tags.stdout |
             from_json |
             items2dict(key_name='Key', value_name='Value')).get('molecule-scenario') ==
            'pinpoint_sms_voice_phone_pool_associate'
      when:
        - __pinpoint_sms_voice_sender_id_query.stdout |
          from_json |
          length > 0

    - name: Ensure sender id is requested
      ansible.builtin.command:
        cmd: >
          aws pinpoint-sms-voice-v2 request-sender-id
            --sender-id MOLECULE
            --iso-country-code DE
            --message-types TRANSACTIONAL
            --no-deletion-protection-enabled
            --tags Key=molecule-scenario,Value=pinpoint_sms_voice_phone_pool_associate
      changed_when: true
      when:
        - __pinpoint_sms_voice_sender_id_query.stdout |
          from_json |
          length == 0
...
