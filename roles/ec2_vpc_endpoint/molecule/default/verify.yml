---
- name: Verify
  hosts: all

  roles:
    - ec2_vpc_net_info

  post_tasks:
    - name: Ensure role is included
      ansible.builtin.include_role:
        name: ec2_vpc_endpoint_info
      vars:
        ec2_vpc_endpoint_info_filters:
          vpc-id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"

    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _ec2_vpc_endpoint_info_dict['molecule'].vpc_endpoint_id is defined
          - _ec2_vpc_endpoint_info_dict['molecule'].service_name ==
              ec2_vpc_endpoint_list.0.service
...
