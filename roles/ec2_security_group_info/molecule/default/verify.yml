---
- name: Verify
  hosts: all

  roles:
    - ec2_security_group_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-ftp'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-ftp'].tags.molecule == 'ec2_security_group_info'
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-ssh'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-telnet'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-smtp'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-domain'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-http'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-pop3'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-imap'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-ldap'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-https'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-ircd'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-ircs'].group_id is defined
          - _ec2_security_group_info_dict['molecule-ec2-security-group-info-cluster'].group_id is defined

    - name: Ensure aws security group relationships are confirmed
      vars:
        __cluster: "{{ _ec2_security_group_info_dict['molecule-ec2-security-group-info-cluster'] }}"
        __cluster_self:
          "{{ __cluster.ip_permissions |
              selectattr('ip_protocol', 'eq', '-1') |
              list }}"
        __cluster_ssh:
          "{{ __cluster.ip_permissions |
              selectattr('ip_protocol', 'eq', 'tcp') |
              selectattr('from_port', 'defined') |
              selectattr('from_port', 'eq', 22) |
              selectattr('to_port', 'eq', 22) |
              list }}"
      ansible.builtin.assert:
        that:
          - __cluster.ip_permissions | length == 2
          - __cluster_self | length == 1
          - __cluster_self.0.user_id_group_pairs |
            map(attribute='group_id') |
            list == [__cluster.group_id]
          - __cluster_self.0.ip_ranges |
            d([]) |
            length == 0
          - __cluster_ssh | length == 1
          - __cluster_ssh.0.user_id_group_pairs |
            map(attribute='group_id') |
            list == [_ec2_security_group_info_dict['molecule-ec2-security-group-info-ssh'].group_id]
          - __cluster_ssh.0.ip_ranges |
            d([]) |
            length == 0
...
