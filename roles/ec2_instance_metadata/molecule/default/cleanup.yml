---
# Molecule runs cleanup after a failed step, before it prunes the ephemeral directory; verify has not restored
# the saved original then. The first cleanup of the next run restores it if this one could not.
- name: Cleanup
  hosts: all
  tasks:
    - name: Ensure saved aws instance metadata region defaults file is checked
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/original-instance-metadata-defaults.json"
      register: __ec2_instance_metadata_saved

    - name: Ensure original aws instance metadata region defaults are restored
      ansible.builtin.include_tasks: restore.yml
      when: __ec2_instance_metadata_saved.stat.exists
...
