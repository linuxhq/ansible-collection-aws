---
- name: Ensure original aws instance metadata region defaults are loaded
  ansible.builtin.set_fact:
    __ec2_instance_metadata_original_dict: >-
      {{ lookup('ansible.builtin.file',
         lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/original-instance-metadata-defaults.json') |
         from_json }}

# A default that was not set at the account level is cleared again.
- name: Ensure original aws instance metadata region defaults are restored
  linuxhq.aws.ec2_instance_metadata:
    http_endpoint: "{{ _original.value.http_endpoint | d('no-preference') }}"
    http_put_response_hop_limit: "{{ _original.value.http_put_response_hop_limit | d(-1) }}"
    http_tokens: "{{ _original.value.http_tokens | d('no-preference') }}"
    instance_metadata_tags: "{{ _original.value.instance_metadata_tags | d('no-preference') }}"
    region: "{{ _original.key }}"
    validate_certs: true
  loop: "{{ __ec2_instance_metadata_original_dict | dict2items }}"
  loop_control:
    label: "{{ _original.key }}"
    loop_var: _original

- name: Ensure restored aws instance metadata region defaults are gathered
  linuxhq.aws.ec2_instance_metadata_info:
    region: "{{ _original.key }}"
    validate_certs: true
  register: __ec2_instance_metadata_restored
  loop: "{{ __ec2_instance_metadata_original_dict | dict2items }}"
  loop_control:
    label: "{{ _original.key }}"
    loop_var: _original

- name: Ensure restored aws instance metadata region defaults are verified
  ansible.builtin.assert:
    quiet: true
    that:
      - _restored.account_level.http_endpoint | d(none) == _restored._original.value.http_endpoint | d(none)
      - _restored.account_level.http_put_response_hop_limit | d(none) ==
          _restored._original.value.http_put_response_hop_limit | d(none)
      - _restored.account_level.http_tokens | d(none) == _restored._original.value.http_tokens | d(none)
      - _restored.account_level.instance_metadata_tags | d(none) ==
          _restored._original.value.instance_metadata_tags | d(none)
  loop: "{{ __ec2_instance_metadata_restored.results }}"
  loop_control:
    label: "{{ _restored._original.key }}"
    loop_var: _restored

- name: Ensure saved aws instance metadata region defaults file is absent
  ansible.builtin.file:
    path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/original-instance-metadata-defaults.json"
    state: absent
...
