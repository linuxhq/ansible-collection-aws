---
provisioner:
  inventory:
    group_vars:
      all:
        wafv2_ip_set_info_name: "{{ wafv2_ip_set_list.0.name }}"

        wafv2_ip_set_list:
          - name: molecule-wafv2-ip-set-info-cloudflare
            addresses:
              - 1.1.1.1/32
            ip_address_version: ipv4
            scope: regional

          - name: molecule-wafv2-ip-set-info-google
            addresses:
              - 8.8.8.8/32
              - 8.8.8.4/32
            ip_address_version: ipv4
            scope: regional
...
