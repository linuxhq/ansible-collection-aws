---
- name: Verify
  hosts: all

  tasks:
    - name: Ensure role is included without filters
      ansible.builtin.include_role:
        name: wafv2_ip_set_info
      vars:
        wafv2_ip_set_info_name: null

    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-cloudflare'].arn is defined
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-cloudflare'].addresses |
            length == 1
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-cloudflare'].ip_address_version == 'IPV4'
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-cloudflare'].id is defined
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-google'].arn is defined
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-google'].addresses | length == 2
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-google'].ip_address_version == 'IPV4'
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-google'].id is defined
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-cloudflare'].tags.Name == 'molecule-wafv2-ip-set-info-cloudflare'
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-google'].tags.Name == 'molecule-wafv2-ip-set-info-google'

    - name: Ensure ip set id filter target is generated
      ansible.builtin.set_fact:
        wafv2_ip_set_info_id_filter:
          "{{ _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-cloudflare'].id }}"

    - name: Ensure role is included with ip set id
      ansible.builtin.include_role:
        name: wafv2_ip_set_info
      vars:
        wafv2_ip_set_info_id: "{{ wafv2_ip_set_info_id_filter }}"
        wafv2_ip_set_info_name: null

    - name: Ensure info with ip set id is verified
      ansible.builtin.assert:
        that:
          - _wafv2_ip_set_info_list | length == 1
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-cloudflare'].id == wafv2_ip_set_info_id_filter

    - name: Ensure role is included with ip set name
      ansible.builtin.include_role:
        name: wafv2_ip_set_info
      vars:
        wafv2_ip_set_info_name: molecule-wafv2-ip-set-info-google

    - name: Ensure info with ip set name is verified
      ansible.builtin.assert:
        that:
          - _wafv2_ip_set_info_list | length == 1
          - _wafv2_ip_set_info_dict.keys() | list == ['molecule-wafv2-ip-set-info-google']
          - _wafv2_ip_set_info_dict['molecule-wafv2-ip-set-info-google'].addresses | length == 2

    - name: Ensure role is included with a missing ip set name
      ansible.builtin.include_role:
        name: wafv2_ip_set_info
      vars:
        wafv2_ip_set_info_name: molecule-wafv2-ip-set-info-missing

    - name: Ensure info with a missing ip set name is verified
      ansible.builtin.assert:
        that:
          - _wafv2_ip_set_info_list == []
          - _wafv2_ip_set_info_dict == {}
...
