---
- name: Cleanup
  hosts: all
  roles:
    - aws_az_info
    - aws_caller_info
    - route53_zone_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        route53_zone_list:
          "{{ route53_zone_list |
              map('combine', {'state': 'absent'}) }}"
        ses_identity_list:
          "{{ ses_identity_list |
              selectattr('zone', 'in', _route53_zone_info_dict) |
              map('combine', {'state': 'absent'}) }}"
        sns_topic_list:
          "{{ sns_topic_list |
              map('combine', {'state': 'absent'}) }}"
        sqs_queue_list:
          "{{ sqs_queue_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ses_identity
        - sns_topic
        - sqs_queue
        - route53_zone
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
