---
provisioner:
  inventory:
    group_vars:
      all:
        iam_role_assume_role_policy_document:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal:
                Service: ec2.amazonaws.com
              Action:
                - sts:AssumeRole

        iam_role_list:
          "{{ iam_role_name_list |
              map(
                'combine', {
                  'assume_role_policy_document': iam_role_assume_role_policy_document,
                  'create_instance_profile': false,
                  'delete_instance_profile': true,
                  'managed_policies': iam_role_managed_policy_list
                }
              ) }}"

        iam_role_managed_policy_list:
          - AmazonEC2ReadOnlyAccess
          - AmazonVPCReadOnlyAccess

        iam_role_name_list:
          - name: molecule-iam-role-00
          - name: molecule-iam-role-01
          - name: molecule-iam-role-02
          - name: molecule-iam-role-03
          - name: molecule-iam-role-04
          - name: molecule-iam-role-05
          - name: molecule-iam-role-06
          - name: molecule-iam-role-07
          - name: molecule-iam-role-08
          - name: molecule-iam-role-09
          - name: molecule-iam-role-10
          - name: molecule-iam-role-11
          - name: molecule-iam-role-12
...
