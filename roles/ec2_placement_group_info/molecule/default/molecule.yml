---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_placement_group_info_filters:
          group-name:
            "{{ ec2_placement_group_list |
                d([]) |
                map(attribute='placement_groups') |
                flatten |
                map(attribute='name') }}"

        ec2_placement_group_list:
          - strategy: cluster
            placement_groups:
              - name: molecule-ec2-placement-group-info-cluster-1
              - name: molecule-ec2-placement-group-info-cluster-2
              - name: molecule-ec2-placement-group-info-cluster-3
              - name: molecule-ec2-placement-group-info-cluster-4
              - name: molecule-ec2-placement-group-info-cluster-5
              - name: molecule-ec2-placement-group-info-cluster-6

          - strategy: partition
            placement_groups:
              - name: molecule-ec2-placement-group-info-partition-1
                partition_count: 3
              - name: molecule-ec2-placement-group-info-partition-2
                partition_count: 3
              - name: molecule-ec2-placement-group-info-partition-3
                partition_count: 3
              - name: molecule-ec2-placement-group-info-partition-4
                partition_count: 5
              - name: molecule-ec2-placement-group-info-partition-5
                partition_count: 5
              - name: molecule-ec2-placement-group-info-partition-6
                partition_count: 5
              - name: molecule-ec2-placement-group-info-partition-7
                partition_count: 7
              - name: molecule-ec2-placement-group-info-partition-8
                partition_count: 7
              - name: molecule-ec2-placement-group-info-partition-9
                partition_count: 7

          - strategy: spread
            placement_groups:
              - name: molecule-ec2-placement-group-info-spread-1
              - name: molecule-ec2-placement-group-info-spread-2
              - name: molecule-ec2-placement-group-info-spread-3
              - name: molecule-ec2-placement-group-info-spread-4
              - name: molecule-ec2-placement-group-info-spread-5
              - name: molecule-ec2-placement-group-info-spread-6
...
