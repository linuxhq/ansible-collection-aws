---
- name: Verify
  hosts: all
  roles:
    - ec2_customer_gateway_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_customer_gateway_info_list |
            selectattr('customer_gateway_name', 'eq', _cgw.name) |
            selectattr('ip_address', 'eq', _cgw.ip_address) |
            list | length == 1
      loop: "{{ ec2_customer_gateway_list_update }}"
      loop_control:
        label: "{{ _cgw.name }}"
        loop_var: _cgw
...
