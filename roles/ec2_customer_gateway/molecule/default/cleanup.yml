---
- name: Cleanup
  hosts: all
  pre_tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_customer_gateway_list:
          "{{ ec2_customer_gateway_list |
              map('combine', {'state': 'absent'}) }}"

  roles:
    - ec2_customer_gateway

  post_tasks:
    - name: Ensure information about remaining customer gateways is gathered
      ansible.builtin.include_role:
        name: ec2_customer_gateway_info

    - name: Ensure removed customer gateways are absent
      ansible.builtin.assert:
        that:
          - _ec2_customer_gateway_info_list |
            selectattr('customer_gateway_name', 'in', ec2_customer_gateway_list | map(attribute='name')) |
            rejectattr('state', 'in', ['deleting', 'deleted']) | list == []
...
