---
- name: Cleanup
  hosts: all
  pre_tasks:
    # The module matches gateways by address, so converge leaves one gateway per address set.
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_customer_gateway_list:
          "{{ (ec2_customer_gateway_list_create +
               ec2_customer_gateway_list_update) |
              map('combine', {'state': 'absent'}) }}"

  roles:
    - ec2_customer_gateway
...
