---
- name: Verify
  hosts: all
  tasks:
    - name: Ensure ec2 serial console access is verified
      block:
        - name: Ensure ec2 serial console access is gathered
          linuxhq.aws.ec2_serial_console_info:
            region: "{{ _region }}"
            validate_certs: true
          register: __ec2_serial_console_result
          loop: "{{ ec2_serial_console_regions }}"
          loop_control:
            label: "{{ _region | d(none) }}"
            loop_var: _region

        - name: Ensure gathered ec2 serial console access is verified
          ansible.builtin.assert:
            quiet: true
            that:
              - not _result.changed
              - _result.serial_console_access.serial_console_access_enabled
          loop: "{{ __ec2_serial_console_result.results }}"
          loop_control:
            label: "{{ _result._region | d(none) }}"
            loop_var: _result

        - name: Ensure ec2 serial console access is disabled
          ansible.builtin.include_role:
            name: ec2_serial_console
          vars:
            ec2_serial_console_state: absent

        - name: Ensure ec2 serial console access is gathered after disabling
          linuxhq.aws.ec2_serial_console_info:
            region: "{{ _region }}"
            validate_certs: true
          register: __ec2_serial_console_absent_result
          loop: "{{ ec2_serial_console_regions }}"
          loop_control:
            label: "{{ _region | d(none) }}"
            loop_var: _region

        - name: Ensure disabled ec2 serial console access is verified
          ansible.builtin.assert:
            quiet: true
            that:
              - not _result.changed
              - not _result.serial_console_access.serial_console_access_enabled
          loop: "{{ __ec2_serial_console_absent_result.results }}"
          loop_control:
            label: "{{ _result._region | d(none) }}"
            loop_var: _result

      always:
        - name: Ensure original aws ec2 serial console access is loaded
          ansible.builtin.set_fact:
            __ec2_serial_console_original_dict: >-
              {{ lookup('ansible.builtin.file',
                 lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/original-serial-console-access.json') |
                 from_json }}

        - name: Ensure original aws ec2 serial console access is restored
          linuxhq.aws.ec2_serial_console:
            region: "{{ _original.key }}"
            state: "{{ 'present' if _original.value else 'absent' }}"
            validate_certs: true
          loop: "{{ __ec2_serial_console_original_dict | dict2items }}"
          loop_control:
            label: "{{ _original.key }}"
            loop_var: _original

        - name: Ensure restored aws ec2 serial console access is gathered
          linuxhq.aws.ec2_serial_console_info:
            region: "{{ _original.key }}"
            validate_certs: true
          register: __ec2_serial_console_restored
          loop: "{{ __ec2_serial_console_original_dict | dict2items }}"
          loop_control:
            label: "{{ _original.key }}"
            loop_var: _original

        - name: Ensure restored aws ec2 serial console access is verified
          ansible.builtin.assert:
            quiet: true
            that:
              - _restored.serial_console_access.serial_console_access_enabled == _restored._original.value
          loop: "{{ __ec2_serial_console_restored.results }}"
          loop_control:
            label: "{{ _restored._original.key }}"
            loop_var: _restored

        - name: Ensure saved aws ec2 serial console access file is absent
          ansible.builtin.file:
            path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/original-serial-console-access.json"
            state: absent
...
