---
# Molecule runs cleanup after a failed step, before it prunes the ephemeral directory; verify has not restored
# the saved original then. The first cleanup of the next run restores it if this one could not.
- name: Cleanup
  hosts: all
  tasks:
    - name: Ensure saved aws ec2 serial console access file is checked
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/original-serial-console-access.json"
      register: __ec2_serial_console_saved

    - name: Ensure original aws ec2 serial console access is restored
      ansible.builtin.include_tasks: restore.yml
      when: __ec2_serial_console_saved.stat.exists
...
