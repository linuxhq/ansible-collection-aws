---
- name: Verify
  hosts: all
  roles:
    - aws_caller_info
    - ec2_security_group_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info
    - eks_cluster_info
    - kms_key_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _eks_cluster_info_dict['molecule-eks1'].status == 'ACTIVE'
          - _eks_cluster_info_dict['molecule-eks1'].encryption_config ==
            [dict(provider=dict(key_arn=_kms_key_info_dict['molecule-eks'].key_arn),
                  resources=['secrets'])]
          - _eks_cluster_info_dict['molecule-eks1'].version == '1.34'
          - not _eks_cluster_info_dict['molecule-eks1'].resources_vpc_config.endpoint_private_access
          - _eks_cluster_info_dict['molecule-eks1'].resources_vpc_config.endpoint_public_access
          - _eks_cluster_info_dict['molecule-eks1'].resources_vpc_config.public_access_cidrs ==
            ['69.107.10.200/29']
          - _eks_cluster_info_dict['molecule-eks1'].tags.Name == 'molecule-eks1'
          - _eks_cluster_info_dict['molecule-eks2'].status == 'ACTIVE'
          - _eks_cluster_info_dict['molecule-eks2'].encryption_config | d([]) == []
          - _eks_cluster_info_dict['molecule-eks2'].version == '1.35'
          - _eks_cluster_info_dict['molecule-eks2'].resources_vpc_config.endpoint_private_access
          - not _eks_cluster_info_dict['molecule-eks2'].resources_vpc_config.endpoint_public_access
          - _eks_cluster_info_dict['molecule-eks2'].tags.Name == 'molecule-eks2'

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id }}"
            security_groups:
              "{{ ec2_security_group_list.0.security_groups |
                  map('combine', {'state': 'absent'}) }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              map('combine', {'state': 'absent'}) }}"
        eks_cluster_list:
          "{{ eks_cluster_list_update |
              map('combine', {'state': 'absent'}) }}"
        iam_role_list:
          "{{ iam_role_list |
              map('combine', {'state': 'absent'}) }}"
        kms_key_list:
          "{{ kms_key_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - eks_cluster
        - kms_key
        - ec2_security_group
        - ec2_vpc_subnet
        - ec2_vpc_net
        - iam_role
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify
...
