---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            security_groups:
              - name: molecule-eks
                rules:
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 443
                    proto: tcp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1

        ec2_vpc_net_list:
          - name: molecule
            cidr_block: 10.0.0.0/16

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            subnets:
              - name: molecule-a
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,0) }}"
              - name: molecule-c
                az: us-east-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,1) }}"
              - name: molecule-d
                az: us-east-1d
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,2) }}"

        eks_cluster_list:
          - name: molecule-eks1
            encryption_config:
              - provider:
                  key_arn: "{{ _kms_key_info_dict['molecule-eks'].key_arn |
                               d(omit) }}"
            resources_vpc_config:
              endpoint_private_access: true
              endpoint_public_access: false
              security_group_ids:
                - "{{ _ec2_security_group_info_dict['molecule-eks'].group_id |
                      d(omit) }}"
              subnet_ids:
                - "{{ _ec2_vpc_subnet_info_dict['molecule-a'].id | d(omit) }}"
                - "{{ _ec2_vpc_subnet_info_dict['molecule-c'].id | d(omit) }}"
                - "{{ _ec2_vpc_subnet_info_dict['molecule-d'].id | d(omit) }}"
            role_arn: "arn:aws:iam::{{ _aws_caller_info_account }}:role/MoleculeEksClusterRole"
            version: '1.33'
            wait: true

          - name: molecule-eks2
            resources_vpc_config:
              endpoint_private_access: false
              endpoint_public_access: true
              security_group_ids:
                - "{{ _ec2_security_group_info_dict['molecule-eks'].group_id |
                      d(omit) }}"
              subnet_ids:
                - "{{ _ec2_vpc_subnet_info_dict['molecule-a'].id | d(omit) }}"
                - "{{ _ec2_vpc_subnet_info_dict['molecule-c'].id | d(omit) }}"
                - "{{ _ec2_vpc_subnet_info_dict['molecule-d'].id | d(omit) }}"
            role_arn: "arn:aws:iam::{{ _aws_caller_info_account }}:role/MoleculeEksClusterRole"
            version: '1.34'
            wait: true

        iam_role_list:
          - name: MoleculeEksClusterRole
            assume_role_policy_document:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: eks.amazonaws.com
                  Action:
                    - sts:AssumeRole
            create_instance_profile: false
            delete_instance_profile: true
            managed_policies:
              - AmazonEKSClusterPolicy

        kms_key_info_filters:
          alias: molecule-eks

        kms_key_list:
          - name: molecule-eks
            pending_window: 7
...
