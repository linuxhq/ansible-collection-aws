---
- name: Verify
  hosts: all
  roles:
    - cloudwatchlogs_log_group_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _cloudwatchlogs_log_group_info_dict[_log_group.name].retention_in_days ==
              _log_group.retention
      loop: "{{ cloudwatchlogs_log_group_list_update }}"
      loop_control:
        label: "{{ _log_group.name }}"
        loop_var: _log_group
...
