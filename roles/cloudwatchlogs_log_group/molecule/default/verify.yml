---
- name: Verify
  hosts: all

  tasks:
    - name: Ensure information about log groups is gathered
      ansible.builtin.include_role:
        name: cloudwatchlogs_log_group_info

    - name: Ensure log groups are verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _cloudwatchlogs_log_group_info_dict[_log_group.name].retention_in_days ==
              _log_group.retention
      loop: "{{ cloudwatchlogs_log_group_list }}"
      loop_control:
        label: "{{ _log_group.name }}"
        loop_var: _log_group

    - name: Ensure log group retention is changed
      ansible.builtin.include_role:
        name: cloudwatchlogs_log_group
      vars:
        cloudwatchlogs_log_group_list:
          - name: molecule-00
            retention: 30
          - name: molecule-01
            retention: 60
          - name: molecule-02
            retention: 120

    - name: Ensure information about changed log groups is gathered
      ansible.builtin.include_role:
        name: cloudwatchlogs_log_group_info

    - name: Ensure changed log group retention is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _cloudwatchlogs_log_group_info_dict['molecule-00'].retention_in_days == 30
          - _cloudwatchlogs_log_group_info_dict['molecule-01'].retention_in_days == 60
          - _cloudwatchlogs_log_group_info_dict['molecule-02'].retention_in_days == 120
...
