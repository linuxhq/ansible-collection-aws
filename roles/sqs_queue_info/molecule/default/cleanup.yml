---
- name: Cleanup
  hosts: all
  roles:
    - aws_az_info
    - aws_caller_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        sqs_queue_list:
          "{{ sqs_queue_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - sqs_queue
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup

    # Live, ListQueues can return a deleted queue for up to a minute.
    - name: Ensure aws simple queue service queues are deleted
      linuxhq.aws.sqs_queue_info:
        queue_name_prefix: molecule-info-
        region: "{{ _aws_az_info_list_l.0[:-1] }}"
      register: __sqs_queue_info_deleted
      retries: 30
      delay: 5
      until:
        - __sqs_queue_info_deleted.queues == []
...
