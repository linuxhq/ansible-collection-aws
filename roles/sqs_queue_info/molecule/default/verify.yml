---
- name: Verify
  hosts: all
  roles:
    - aws_az_info
    - aws_caller_info

  post_tasks:
    - name: Ensure aws simple queue service queue attributes are available
      linuxhq.aws.sqs_queue_info:
        queue_name_prefix: molecule-info-
        region: "{{ _aws_az_info_list_l.0[:-1] }}"
      register: __sqs_queue_info_verify
      retries: 30
      delay: 1
      until:
        - __sqs_queue_info_verify.queues | length == 3
        - __sqs_queue_info_verify.queues |
            selectattr('queue_arn', 'defined') |
            length == 3

    - name: Ensure role is included without name
      ansible.builtin.include_role:
        name: sqs_queue_info
      vars:
        sqs_queue_info_name: null

    - name: Ensure info without name is verified
      ansible.builtin.assert:
        that:
          - _sqs_queue_info_dict['molecule-info-bounce'].queue_arn is defined
          - _sqs_queue_info_dict['molecule-info-bounce'].sqs_managed_sse_enabled | bool
          - _sqs_queue_info_dict['molecule-info-complaint'].queue_arn is defined
          - _sqs_queue_info_dict['molecule-info-complaint'].sqs_managed_sse_enabled | bool
          - _sqs_queue_info_dict['molecule-info-delivery'].queue_arn is defined
          - _sqs_queue_info_dict['molecule-info-delivery'].sqs_managed_sse_enabled | bool

    - name: Ensure role is included with name
      ansible.builtin.include_role:
        name: sqs_queue_info
      vars:
        sqs_queue_info_name: molecule-info-bounce

    - name: Ensure info with name is verified
      ansible.builtin.assert:
        that:
          - _sqs_queue_info_list | length == 1
          - _sqs_queue_info_list.0.name == 'molecule-info-bounce'
          - _sqs_queue_info_dict.keys() | list == ['molecule-info-bounce']
          - _sqs_queue_info_dict['molecule-info-bounce'].queue_arn is defined
          - _sqs_queue_info_dict['molecule-info-bounce'].sqs_managed_sse_enabled | bool

    - name: Ensure role is included with queue name prefix
      ansible.builtin.include_role:
        name: sqs_queue_info
      vars:
        sqs_queue_info_queue_name_prefix: molecule-

    - name: Ensure info with queue name prefix is verified
      ansible.builtin.assert:
        that:
          - _sqs_queue_info_list | length == 3
          - _sqs_queue_info_dict.keys() | sort ==
              ['molecule-info-bounce', 'molecule-info-complaint', 'molecule-info-delivery']

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        sqs_queue_list:
          "{{ sqs_queue_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - sqs_queue
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify
...
