---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        secretsmanager_secret_info_list:
          "{{ secretsmanager_secret_list }}"

        secretsmanager_secret_list:
          - name: molecule-secret-1
            recovery_window: 0
            secret:
              - key: molecule-key-1
                value: WnvpxzicuneCE7PM7upC7aVNFwYoz7wE

          - name: molecule-secret-2
            recovery_window: 0
            secret:
              - key: molecule-key-1
                value: JUJMm9adCgL7FPtF7qiuHjyXYne7ivbX
              - key: molecule-key-2
                value: ggfiFwtaauCRwwNfxJUE3oRjoHr3ETLL

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
