---
- name: Verify
  hosts: all

  roles:
    - efs_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _efs_info_dict['molecule-efs1'].encrypted | bool
          - _efs_info_dict['molecule-efs1'].mount_point is defined
          - _efs_info_dict['molecule-efs1'].mount_targets | length == 3
          - _efs_info_dict['molecule-efs1'].performance_mode == 'generalPurpose'
          - _efs_info_dict['molecule-efs1'].tags.molecule == 'efs_info'
          - _efs_info_dict['molecule-efs2'].encrypted | bool
          - _efs_info_dict['molecule-efs2'].mount_point is defined
          - _efs_info_dict['molecule-efs2'].mount_targets | length == 3
          - _efs_info_dict['molecule-efs2'].performance_mode == 'generalPurpose'
...
