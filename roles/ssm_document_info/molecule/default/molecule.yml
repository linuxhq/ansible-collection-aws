---
provisioner:
  inventory:
    group_vars:
      all:
        ssm_document_info_name: molecule-ssm-document-info-command-shell
        ssm_document_list:
          - name: molecule-ssm-document-info-command-shell
            tags:
              molecule: ssm_document_info
            document_type: Command
            content:
              schemaVersion: '2.2'
              description: Run a shell command
              mainSteps:
                - action: aws:runShellScript
                  name: runShellScript
                  inputs:
                    runCommand:
                      - echo molecule

          - name: molecule-ssm-document-info-command-env
            document_type: Command
            content:
              schemaVersion: '2.2'
              description: Print environment
              mainSteps:
                - action: aws:runShellScript
                  name: printEnvironment
                  inputs:
                    runCommand:
                      - env | sort

          - name: molecule-ssm-document-info-session-shell
            document_type: Session
            content:
              schemaVersion: '1.0'
              description: Session Manager shell preferences
              sessionType: Standard_Stream
              inputs:
                idleSessionTimeout: 60
                runAsEnabled: false
                shellProfile:
                  linux: cd
                  windows: ''
...
