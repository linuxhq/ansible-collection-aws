---
- name: Cleanup
  hosts: all
  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ssm_document_list:
          "{{ ssm_document_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ssm_document
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup

    - name: Ensure role is included with a removed name
      ansible.builtin.include_role:
        name: ssm_document_info
      vars:
        ssm_document_info_name: molecule-command-shell

    - name: Ensure info with a removed name is verified
      ansible.builtin.assert:
        that:
          - _ssm_document_info_list == []
          - _ssm_document_info_dict == {}
...
