---
- name: Verify
  hosts: all

  tasks:
    - name: Ensure role is included with command shell name
      ansible.builtin.include_role:
        name: ssm_document_info
      vars:
        ssm_document_info_name: molecule-ssm-document-info-command-shell

    - name: Ensure info with command shell name is verified
      ansible.builtin.assert:
        that:
          - _ssm_document_info_dict['molecule-ssm-document-info-command-shell'].document_type == 'Command'
          - _ssm_document_info_dict['molecule-ssm-document-info-command-shell'].tags.molecule == 'ssm_document_info'
          - _ssm_document_info_dict['molecule-ssm-document-info-command-shell'].content.mainSteps.0.name == 'runShellScript'

    - name: Ensure role is included with command env name
      ansible.builtin.include_role:
        name: ssm_document_info
      vars:
        ssm_document_info_name: molecule-ssm-document-info-command-env

    - name: Ensure info with command env name is verified
      ansible.builtin.assert:
        that:
          - _ssm_document_info_dict['molecule-ssm-document-info-command-env'].document_type == 'Command'
          - _ssm_document_info_dict['molecule-ssm-document-info-command-env'].content.mainSteps.0.name == 'printEnvironment'

    - name: Ensure role is included with session shell name
      ansible.builtin.include_role:
        name: ssm_document_info
      vars:
        ssm_document_info_name: molecule-ssm-document-info-session-shell

    - name: Ensure info with session shell name is verified
      ansible.builtin.assert:
        that:
          - _ssm_document_info_dict['molecule-ssm-document-info-session-shell'].document_type == 'Session'
          - _ssm_document_info_dict['molecule-ssm-document-info-session-shell'].content.sessionType == 'Standard_Stream'

    - name: Ensure role is included with filters
      ansible.builtin.include_role:
        name: ssm_document_info
      vars:
        ssm_document_info_filters:
          Name: molecule-ssm-document-info-command-shell
        ssm_document_info_name: null

    - name: Ensure info with filters is verified
      ansible.builtin.assert:
        that:
          - _ssm_document_info_list | length == 1
          - _ssm_document_info_dict['molecule-ssm-document-info-command-shell'].document_type == 'Command'
          - _ssm_document_info_dict['molecule-ssm-document-info-command-shell'].content.mainSteps.0.name == 'runShellScript'
...
