---
- name: Verify
  hosts: all
  roles:
    - ec2_eip_info
    - ec2_vpc_net_info

  post_tasks:
    - name: Ensure aws elastic network interfaces are discoverable
      amazon.aws.ec2_eni_info:
        filters:
          tag:Name: molecule-eip-*
        validate_certs: true
      register: _ec2_eni_molecule_info

    - name: Ensure dict of aws elastic network interfaces is generated
      ansible.builtin.set_fact:
        _ec2_eni_molecule_dict:
          "{{ _ec2_eni_molecule_info.network_interfaces |
              json_query('[].{key: tags.Name, value: id}') |
              items2dict }}"

    - name: Ensure association is verified
      ansible.builtin.assert:
        that:
          - _ec2_eni_molecule_dict | length == 2
          - _ec2_eip_info_dict['molecule-eip-01'].network_interface_id ==
            _ec2_eni_molecule_dict['molecule-eip-01']
          - _ec2_eip_info_dict['molecule-eip-01'].association_id is defined
          - _ec2_eip_info_dict['molecule-eip-02'].network_interface_id ==
            _ec2_eni_molecule_dict['molecule-eip-02']
          - _ec2_eip_info_dict['molecule-eip-02'].association_id is defined
          - _ec2_eip_info_dict['molecule-eip-03'].public_ip is defined
          - _ec2_eip_info_dict['molecule-eip-04'].public_ip is defined
          - _ec2_eip_info_dict['molecule-eip-05'].public_ip is defined

    # Leave molecule-eip-02 detached but still listed with its device_id.
    - name: Ensure aws elastic ip address is disassociated outside the role
      amazon.aws.ec2_eip:
        device_id: "{{ _ec2_eni_molecule_dict['molecule-eip-02'] }}"
        in_vpc: true
        public_ip: "{{ _ec2_eip_info_dict['molecule-eip-02'].public_ip }}"
        release_on_disassociation: false
        state: absent
        validate_certs: true

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_eip_list:
          "{{ ec2_eip_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_igw_list:
          "{{ ec2_vpc_igw_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure aws elastic ip addresses are released
      ansible.builtin.include_role:
        name: ec2_eip

    - name: Ensure information about remaining aws elastic ips is gathered
      amazon.aws.ec2_eip_info:
        filters:
          tag:Name: molecule-eip-*
        validate_certs: true
      register: _ec2_eip_molecule_remaining

    - name: Ensure every aws elastic ip address is released
      ansible.builtin.assert:
        that:
          - _ec2_eip_molecule_remaining.addresses | length == 0

    - name: Ensure aws elastic network interfaces are absent
      amazon.aws.ec2_eni:
        eni_id: "{{ _eni }}"
        state: absent
        validate_certs: true
      loop: "{{ _ec2_eni_molecule_dict.values() | list }}"
      loop_control:
        loop_var: _eni

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - ec2_vpc_subnet
        - ec2_vpc_igw
        - ec2_vpc_net
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify
...
