---
- name: Converge
  hosts: all
  roles:
    - role: ec2_vpc_net
      tags:
        - molecule-idempotence-notest
      check_mode: false

    - role: ec2_vpc_igw
      tags:
        - molecule-idempotence-notest
      check_mode: false

    - role: ec2_vpc_subnet
      tags:
        - molecule-idempotence-notest
      check_mode: false

    - role: ec2_vpc_subnet_info
      tags:
        - molecule-idempotence-notest

  tasks:
    - name: Ensure aws elastic network interface is present
      tags:
        - molecule-idempotence-notest
      amazon.aws.ec2_eni:
        name: molecule-eip
        private_ip_address: "{{ ec2_vpc_subnet_list.0.subnets.0.cidr | ansible.utils.nthhost(10) }}"
        state: present
        subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-a'].id }}"
        validate_certs: true
      check_mode: false

    - name: Ensure aws elastic network interface is discoverable
      amazon.aws.ec2_eni_info:
        filters:
          tag:Name: molecule-eip
        validate_certs: true
      register: _ec2_eni_molecule_info

    - name: Ensure role is imported with an empty list
      tags:
        - molecule-idempotence-notest
      ansible.builtin.import_role:
        name: ec2_eip
      vars:
        ec2_eip_list: []

    - name: Ensure role is imported
      ansible.builtin.import_role:
        name: ec2_eip
...
