---
- name: Verify
  hosts: all
  roles:
    - role: ec2_transit_gateway_info
      ec2_transit_gateway_info_filters:
        state:
          - available

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_transit_gateway_info_dict[_tgw.name].transit_gateway_id is defined
      loop: "{{ ec2_transit_gateway_list }}"
      loop_control:
        label: "{{ _tgw.name }}"
        loop_var: _tgw
...
