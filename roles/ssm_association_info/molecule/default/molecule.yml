---
provisioner:
  inventory:
    group_vars:
      all:
        ssm_association_info_filters:
          AssociationName: "{{ ssm_association_list.0.association_name }}"

        ssm_association_list:
          - name: AWS-UpdateSSMAgent
            association_name: molecule-ssm-association-info
            tags:
              molecule: ssm_association_info
            schedule_expression: 'cron(0 0 * * ? *)'
            targets:
              - key: InstanceIds
                values: ['*']
...
