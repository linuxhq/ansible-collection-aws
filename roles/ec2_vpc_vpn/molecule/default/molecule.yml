---
provisioner:
  inventory:
    group_vars:
      all:
        cloudwatchlogs_log_group_info_log_group_name: molecule-ec2-vpc-vpn

        cloudwatchlogs_log_group_list:
          - name: molecule-ec2-vpc-vpn
            retention: 1

        ec2_customer_gateway_list:
          - name: molecule-ec2-vpc-vpn-00
            ip_address: 1.1.1.10
          - name: molecule-ec2-vpc-vpn-01
            ip_address: 1.1.1.11
          - name: molecule-ec2-vpc-vpn-02
            ip_address: 1.1.1.12

        ec2_transit_gateway_info_filters:
          state:
            - available

        ec2_transit_gateway_list:
          - name: molecule-ec2-vpc-vpn

        ec2_vpc_vpn_list:
          - name: molecule-ec2-vpc-vpn-00
            customer_gateway_id:
              "{{ _ec2_customer_gateway_info_dict['molecule-ec2-vpc-vpn-00'].customer_gateway_id |
                  d(omit) }}"
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule-ec2-vpc-vpn'].transit_gateway_id |
                  d(omit) }}"
            tunnel_bandwidth: large

          - name: molecule-ec2-vpc-vpn-01
            customer_gateway_id:
              "{{ _ec2_customer_gateway_info_dict['molecule-ec2-vpc-vpn-01'].customer_gateway_id |
                  d(omit) }}"
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule-ec2-vpc-vpn'].transit_gateway_id |
                  d(omit) }}"
            enable_acceleration: false
            outside_ip_address_type: PublicIpv4
            static_only: true
            tunnel_options:
              - ike_versions: [ikev2]
                phase1_encryption_algorithms: [AES256]
                phase1_integrity_algorithms: [SHA2-256]
                phase1_dh_group_numbers: [16]
                phase2_encryption_algorithms: [AES256]
                phase2_integrity_algorithms: [SHA2-256]
                phase2_dh_group_numbers: [16]
              - ike_versions: [ikev2]
                phase1_encryption_algorithms: [AES256]
                phase1_integrity_algorithms: [SHA2-256]
                phase1_dh_group_numbers: [16]
                phase2_encryption_algorithms: [AES256]
                phase2_integrity_algorithms: [SHA2-256]
                phase2_dh_group_numbers: [16]

          - name: molecule-ec2-vpc-vpn-02
            customer_gateway_id:
              "{{ _ec2_customer_gateway_info_dict['molecule-ec2-vpc-vpn-02'].customer_gateway_id |
                  d(omit) }}"
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule-ec2-vpc-vpn'].transit_gateway_id |
                  d(omit) }}"
            tunnel_inside_ip_version: ipv6
            wait_timeout: 1200
            tunnel_options:
              - tunnel_inside_ipv6_cidr: fd00::100/126
              - tunnel_inside_ipv6_cidr: fd00::200/126
...
