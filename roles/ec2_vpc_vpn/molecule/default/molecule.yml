---
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    ANSIBLE_DEPRECATION_WARNINGS: false
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        cloudwatchlogs_log_group_info_log_group_name: molecule-ec2-vpc-vpn

        cloudwatchlogs_log_group_list:
          - name: molecule-ec2-vpc-vpn
            retention: 1

        ec2_customer_gateway_list:
          - name: molecule-00
            ip_address: 1.1.1.10
          - name: molecule-01
            ip_address: 1.1.1.11
          - name: molecule-02
            ip_address: 1.1.1.12

        ec2_transit_gateway_info_filters:
          state:
            - available

        ec2_transit_gateway_list:
          - name: molecule

        ec2_vpc_vpn_list:
          - name: molecule-00
            customer_gateway_id:
              "{{ _ec2_customer_gateway_info_dict['molecule-00'].customer_gateway_id |
                  d(omit) }}"
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id |
                  d(omit) }}"
            tunnel_bandwidth: large

          - name: molecule-01
            customer_gateway_id:
              "{{ _ec2_customer_gateway_info_dict['molecule-01'].customer_gateway_id |
                  d(omit) }}"
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id |
                  d(omit) }}"
            enable_acceleration: false
            outside_ip_address_type: PublicIpv4
            static_only: true
            tunnel_options:
              - ike_versions: [ikev2]
                phase1_encryption_algorithms: [AES256]
                phase1_integrity_algorithms: [SHA2-256]
                phase1_dh_group_numbers: [16]
                phase2_encryption_algorithms: [AES256]
                phase2_integrity_algorithms: [SHA2-256]
                phase2_dh_group_numbers: [16]
              - ike_versions: [ikev2]
                phase1_encryption_algorithms: [AES256]
                phase1_integrity_algorithms: [SHA2-256]
                phase1_dh_group_numbers: [16]
                phase2_encryption_algorithms: [AES256]
                phase2_integrity_algorithms: [SHA2-256]
                phase2_dh_group_numbers: [16]

          - name: molecule-02
            customer_gateway_id:
              "{{ _ec2_customer_gateway_info_dict['molecule-02'].customer_gateway_id |
                  d(omit) }}"
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id |
                  d(omit) }}"
            tunnel_inside_ip_version: ipv6
            wait_timeout: 1200
            tunnel_options:
              - tunnel_inside_ipv6_cidr: fd00::100/126
              - tunnel_inside_ipv6_cidr: fd00::200/126

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
