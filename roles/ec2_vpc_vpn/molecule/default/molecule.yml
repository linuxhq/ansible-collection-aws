---
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    ANSIBLE_DEPRECATION_WARNINGS: false
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        cloudwatchlogs_log_group_info_log_group_name: molecule-ec2-vpc-vpn

        cloudwatchlogs_log_group_list:
          - name: molecule-ec2-vpc-vpn
            retention: 1

        ec2_customer_gateway_list:
          - name: molecule-00
            ip_address: 1.1.1.10
          - name: molecule-01
            ip_address: 1.1.1.11

        ec2_transit_gateway_info_filters:
          state:
            - available

        ec2_transit_gateway_list:
          - name: molecule

        ec2_vpc_vpn_list_create:
          - name: molecule-00
            customer_gateway_id:
              "{{ _ec2_customer_gateway_info_dict['molecule-00'].customer_gateway_id }}"
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id }}"
            tunnel_bandwidth: large

          - name: molecule-01
            customer_gateway_id:
              "{{ _ec2_customer_gateway_info_dict['molecule-01'].customer_gateway_id }}"
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id }}"
            enable_acceleration: false
            outside_ip_address_type: PublicIpv4
            static_only: true
            tunnel_options:
              - ike_versions: [ikev2]
                phase1_encryption_algorithms: [AES256]
                phase1_integrity_algorithms: [SHA2-256]
                phase1_dh_group_numbers: [16]
                phase2_encryption_algorithms: [AES256]
                phase2_integrity_algorithms: [SHA2-256]
                phase2_dh_group_numbers: [16]
              - ike_versions: [ikev2]
                phase1_encryption_algorithms: [AES256]
                phase1_integrity_algorithms: [SHA2-256]
                phase1_dh_group_numbers: [16]
                phase2_encryption_algorithms: [AES256]
                phase2_integrity_algorithms: [SHA2-256]
                phase2_dh_group_numbers: [16]

        ec2_vpc_vpn_list_update:
          - name: molecule-00
            customer_gateway_id:
              "{{ _ec2_customer_gateway_info_dict['molecule-00'].customer_gateway_id }}"
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id }}"
            pre_shared_key_storage: SecretsManager
            skip_tunnel_replacement: true
            tunnel_bandwidth: large
            wait_timeout: 1200
            tunnel_options:
              - dpd_timeout_action: restart
                dpd_timeout_seconds: 45
                enable_tunnel_lifecycle_control: true
                log_options:
                  cloud_watch_log_options:
                    bgp_log_enabled: true
                    bgp_log_group_arn:
                      "{{ _cloudwatchlogs_log_group_info_dict['molecule-ec2-vpc-vpn'].arn }}"
                    bgp_log_output_format: text
                    log_enabled: true
                    log_group_arn:
                      "{{ _cloudwatchlogs_log_group_info_dict['molecule-ec2-vpc-vpn'].arn }}"
                    log_output_format: text
                phase1_lifetime_seconds: 27000
                phase2_lifetime_seconds: 3000
                rekey_fuzz_percentage: 50
                rekey_margin_time_seconds: 1500
                replay_window_size: 2048
                startup_action: add

          - name: molecule-01
            customer_gateway_id:
              "{{ _ec2_customer_gateway_info_dict['molecule-01'].customer_gateway_id }}"
            transit_gateway_id:
              "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id }}"
            enable_acceleration: false
            local_ipv4_network_cidr: 10.20.0.0/16
            outside_ip_address_type: PublicIpv4
            pre_shared_key_storage: Standard
            static_only: true
            tunnel_bandwidth: standard
            wait_timeout: 1200
            tunnel_options:
              - phase1_encryption_algorithms: [AES128]
                phase2_encryption_algorithms: [AES128]
              - phase1_encryption_algorithms: [AES128]
                phase2_encryption_algorithms: [AES128]

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
