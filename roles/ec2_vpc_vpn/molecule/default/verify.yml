---
- name: Verify
  hosts: all
  roles:
    - ec2_customer_gateway_info
    - ec2_transit_gateway_info
    - ec2_vpc_vpn_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _ec2_vpc_vpn_info_dict['molecule-00'].vpn_connection_id is defined
          - _ec2_vpc_vpn_info_dict['molecule-00'].customer_gateway_id == ec2_vpc_vpn_list_update.0.customer_gateway_id
          - _ec2_vpc_vpn_info_dict['molecule-00'].transit_gateway_id == ec2_vpc_vpn_list_update.0.transit_gateway_id
          - _ec2_vpc_vpn_info_dict['molecule-00'].state == 'available'
          - _ec2_vpc_vpn_info_dict['molecule-00'].tags.Name == 'molecule-00'
          - _ec2_vpc_vpn_info_dict['molecule-01'].vpn_connection_id is defined
          - _ec2_vpc_vpn_info_dict['molecule-01'].customer_gateway_id == ec2_vpc_vpn_list_update.1.customer_gateway_id
          - _ec2_vpc_vpn_info_dict['molecule-01'].transit_gateway_id == ec2_vpc_vpn_list_update.1.transit_gateway_id
          - _ec2_vpc_vpn_info_dict['molecule-01'].state == 'available'
          - _ec2_vpc_vpn_info_dict['molecule-01'].tags.Name == 'molecule-01'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.static_routes_only
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.local_ipv4_network_cidr == '10.20.0.0/16'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options | length == 2
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.0.phase1_encryption_algorithms.0.value == 'AES128'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.0.phase2_encryption_algorithms.0.value == 'AES128'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.0.ike_versions.0.value == 'ikev2'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.0.phase1_integrity_algorithms.0.value == 'SHA2-256'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.0.phase2_integrity_algorithms.0.value == 'SHA2-256'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.0.phase1_dh_group_numbers.0.value == 16
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.0.phase2_dh_group_numbers.0.value == 16
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.1.phase1_encryption_algorithms.0.value == 'AES128'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.1.phase2_encryption_algorithms.0.value == 'AES128'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.1.ike_versions.0.value == 'ikev2'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.1.phase1_integrity_algorithms.0.value == 'SHA2-256'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.1.phase2_integrity_algorithms.0.value == 'SHA2-256'
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.1.phase1_dh_group_numbers.0.value == 16
          - _ec2_vpc_vpn_info_dict['molecule-01'].options.tunnel_options.1.phase2_dh_group_numbers.0.value == 16

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_vpc_vpn_list:
          "{{ ec2_vpc_vpn_list_update |
              map('combine', {'state': 'absent'}) }}"
        ec2_customer_gateway_list:
          "{{ ec2_customer_gateway_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure role is included
      ansible.builtin.include_role:
        name: ec2_vpc_vpn

    - name: Ensure vpn connections are deleted
      amazon.aws.ec2_vpc_vpn_info:
        filters:
          tag:Name: "{{ ec2_vpc_vpn_list | map(attribute='name') | list }}"
        validate_certs: true
      register: __ec2_vpc_vpn_deleted
      no_log: true
      until:
        - __ec2_vpc_vpn_deleted.vpn_connections |
          rejectattr('state', 'eq', 'deleted') |
          list | length == 0
      retries: 40
      delay: 15

    - name: Ensure transit gateway is deleted once its vpn attachments are released
      amazon.aws.ec2_transit_gateway:
        state: absent
        transit_gateway_id: "{{ _ec2_transit_gateway_info_dict['molecule'].transit_gateway_id }}"
        validate_certs: true
        wait: true
        wait_timeout: 600
      register: __ec2_transit_gateway_deleted
      until:
        - __ec2_transit_gateway_deleted is succeeded
      retries: 40
      delay: 15

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - ec2_customer_gateway
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify
...
