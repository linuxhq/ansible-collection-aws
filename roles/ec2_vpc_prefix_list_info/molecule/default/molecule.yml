---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_vpc_prefix_list_entries:
          - name: molecule-ec2-vpc-prefix-list-info-localhost
            tags:
              molecule: ec2_vpc_prefix_list_info
            entries:
              - cidr: 127.0.0.1/32
                description: localhost-1
              - cidr: 127.0.0.2/32
                description: localhost-2
              - cidr: 127.0.0.3/32
                description: localhost-3
              - cidr: 127.0.0.4/32
                description: localhost-4
              - cidr: 127.0.0.5/32
                description: localhost-5
          - name: molecule-ec2-vpc-prefix-list-info-private
            entries:
              - cidr: 192.168.1.0/24
                description: private-1
              - cidr: 192.168.2.0/24
                description: private-2
              - cidr: 192.168.3.0/24
                description: private-3
              - cidr: 192.168.4.0/24
                description: private-4
              - cidr: 192.168.5.0/24
                description: private-5

        ec2_vpc_prefix_list_info_filters:
          prefix-list-name:
            "{{ ec2_vpc_prefix_list_entries |
                d([]) |
                map(attribute='name') }}"
...
