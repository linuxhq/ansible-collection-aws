---
- name: Verify
  hosts: all
  tasks:
    - name: Ensure info is verified
      block:
        - name: Ensure information about aws ec2 serial console access is gathered
          ansible.builtin.include_role:
            name: ec2_serial_console_info

        - name: Ensure gathered info is verified
          ansible.builtin.assert:
            quiet: true
            that:
              - _ec2_serial_console_info_dict[_region].serial_console_access_enabled
          loop: "{{ ec2_serial_console_info_regions }}"
          loop_control:
            label: "{{ _region }}"
            loop_var: _region

      always:
        - name: Ensure original aws ec2 serial console access is loaded
          ansible.builtin.set_fact:
            __ec2_serial_console_original_dict: >-
              {{ lookup('ansible.builtin.file',
                 lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') ~ '/original-serial-console-access.json') |
                 from_json }}

        - name: Ensure original aws ec2 serial console access is restored
          linuxhq.aws.ec2_serial_console:
            region: "{{ _original.key }}"
            state: "{{ 'present' if _original.value else 'absent' }}"
            validate_certs: true
          loop: "{{ __ec2_serial_console_original_dict | dict2items }}"
          loop_control:
            label: "{{ _original.key }}"
            loop_var: _original

        - name: Ensure restored aws ec2 serial console access is gathered
          linuxhq.aws.ec2_serial_console_info:
            region: "{{ _original.key }}"
            validate_certs: true
          register: __ec2_serial_console_restored
          loop: "{{ __ec2_serial_console_original_dict | dict2items }}"
          loop_control:
            label: "{{ _original.key }}"
            loop_var: _original

        - name: Ensure restored aws ec2 serial console access is verified
          ansible.builtin.assert:
            quiet: true
            that:
              - _restored.serial_console_access.serial_console_access_enabled == _restored._original.value
          loop: "{{ __ec2_serial_console_restored.results }}"
          loop_control:
            label: "{{ _restored._original.key }}"
            loop_var: _restored

        - name: Ensure saved aws ec2 serial console access file is absent
          ansible.builtin.file:
            path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/original-serial-console-access.json"
            state: absent
...
