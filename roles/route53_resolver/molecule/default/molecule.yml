---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-route53-resolver'].id | d(omit) }}"
            security_groups:
              - name: molecule-route53-resolver
                rules:
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 53
                      - 443
                    proto: tcp
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 53
                    proto: udp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1

        ec2_vpc_net_list:
          - name: molecule-route53-resolver
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-route53-resolver'].id | d(omit) }}"
            subnets:
              - name: molecule-route53-resolver-a
                az:
                  "{{ lookup('ansible.builtin.ini',
                             'region',
                             file='~/.aws/config',
                             section='profile molecule') ~ 'a' }}"
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,0) }}"
              - name: molecule-route53-resolver-c
                az:
                  "{{ lookup('ansible.builtin.ini',
                             'region',
                             file='~/.aws/config',
                             section='profile molecule') ~ 'c' }}"
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,1) }}"

        route53_resolver_list:
          - name: molecule-route53-resolver-cloudflare
            tags:
              molecule: route53_resolver
            direction: OUTBOUND
            ip_addresses:
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-route53-resolver-a'].id |
                               d(none) }}"
                ip: 192.168.0.123
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-route53-resolver-c'].id |
                               d(none) }}"
                ip: 192.168.0.251
            protocols:
              - Do53
            security_group_ids:
              - "{{ _ec2_security_group_info_dict['molecule-route53-resolver'].group_id |
                    d(omit) }}"

          - name: molecule-route53-resolver-google
            tags:
              molecule: route53_resolver
            direction: OUTBOUND
            ip_addresses:
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-route53-resolver-a'].id |
                               d(none) }}"
                ip: 192.168.0.124
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-route53-resolver-c'].id |
                               d(none) }}"
                ip: 192.168.0.252
            protocols:
              - Do53
            security_group_ids:
              - "{{ _ec2_security_group_info_dict['molecule-route53-resolver'].group_id |
                    d(omit) }}"
...
