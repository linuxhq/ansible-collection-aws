---
provisioner:
  options:
    diff: false
  inventory:
    group_vars:
      all:
        ec2_ami_info_list:
          - name: al2023-ami-2023
            filters:
              architecture: x86_64
              owner-alias: amazon
              is-public: true
              virtualization-type: hvm

        ec2_instance_list:
          - name: molecule-ssm-instance-info
            exact_count: 1
            iam_instance_profile: molecule-ssm-instance-info-instance
            image_id: "{{ _ec2_ami_info_latest['al2023-ami-2023'] }}"
            instance_type: t3a.medium
            security_groups:
              - molecule-ssm-instance-info
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ssm-instance-info-pvt'].id |
                               d(omit) }}"

        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ssm-instance-info'].id | d(omit) }}"
            security_groups:
              - name: molecule-ssm-instance-info
                rules:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1

        ec2_vpc_igw_list:
          - name: molecule-ssm-instance-info
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ssm-instance-info'].id | d(omit) }}"

        ec2_vpc_nat_gateway_list:
          - name: molecule-ssm-instance-info-pub
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ssm-instance-info-pub'].id |
                           d(omit) }}"
            wait: true

        ec2_vpc_net_list:
          - name: molecule-ssm-instance-info
            cidr_block: 192.168.0.0/24

        ec2_vpc_route_table_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ssm-instance-info'].id | d(omit) }}"
            route_tables:
              - name: molecule-ssm-instance-info-pub
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id: igw
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-ssm-instance-info-pub'].id |
                        d(omit) }}"
              - name: molecule-ssm-instance-info-pvt
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id: "{{ _ec2_vpc_nat_gateway_info_dict['molecule-ssm-instance-info-pub'].nat_gateway_id |
                                    d(omit) }}"
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-ssm-instance-info-pvt'].id |
                        d(omit) }}"

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ssm-instance-info'].id | d(omit) }}"
            subnets:
              - name: molecule-ssm-instance-info-pub
                az: us-east-1a
                cidr:
                  "{{ ec2_vpc_net_list.0.cidr_block |
                      ansible.utils.ipsubnet(25, 0) }}"
              - name: molecule-ssm-instance-info-pvt
                az: us-east-1a
                cidr:
                  "{{ ec2_vpc_net_list.0.cidr_block |
                      ansible.utils.ipsubnet(25, 1) }}"

        iam_instance_profile_list:
          - name: molecule-ssm-instance-info-instance
            role: molecule-ssm-instance-info-instance

        iam_role_list:
          - name: molecule-ssm-instance-info-instance
            assume_role_policy_document:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ec2.amazonaws.com
                  Action:
                    - sts:AssumeRole
            managed_policies:
              - AmazonSSMManagedInstanceCore

        ssm_instance_info_connection_status: true

verifier:
  options:
    diff: false
...
