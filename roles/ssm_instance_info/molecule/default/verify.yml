---
- name: Verify
  hosts: all

  roles:
    - ec2_instance_info

  post_tasks:
    - name: Ensure aws systems manager instance is online
      linuxhq.aws.ssm_instance_info:
        instance_ids:
          - "{{ _ec2_instance_info_dict['molecule-ssm-instance-info'].instance_id }}"
        validate_certs: true
      register: __ssm_instance_info_wait
      until:
        - __ssm_instance_info_wait.instances.0.ping_status | d('') == 'Online'
      retries: 30
      delay: 10

    - name: Ensure role is included with instance ids
      ansible.builtin.include_role:
        name: ssm_instance_info
      vars:
        ssm_instance_info_connection_status: false
        ssm_instance_info_instance_ids:
          - "{{ _ec2_instance_info_dict['molecule-ssm-instance-info'].instance_id }}"

    - name: Ensure info with instance ids is verified
      ansible.builtin.assert:
        that:
          - _ssm_instance_info_list | length == 1
          - _ssm_instance_info_dict[
              _ec2_instance_info_dict['molecule-ssm-instance-info'].instance_id
            ].instance_id == _ec2_instance_info_dict['molecule-ssm-instance-info'].instance_id
          - _ssm_instance_info_dict[
              _ec2_instance_info_dict['molecule-ssm-instance-info'].instance_id
            ].ping_status == 'Online'
          - _ssm_instance_info_dict[
              _ec2_instance_info_dict['molecule-ssm-instance-info'].instance_id
            ].resource_type == 'EC2Instance'
          - "'connection_status' not in _ssm_instance_info_list.0"

    - name: Ensure role is included with ping status
      ansible.builtin.include_role:
        name: ssm_instance_info
      vars:
        ssm_instance_info_instance_ids:
          - "{{ _ec2_instance_info_dict['molecule-ssm-instance-info'].instance_id }}"
        ssm_instance_info_ping_status: Online

    - name: Ensure info with ping status is verified
      ansible.builtin.assert:
        that:
          - _ssm_instance_info_list | length == 1
          - _ssm_instance_info_list.0.ping_status == 'Online'

    - name: Ensure aws systems manager instance is connected
      linuxhq.aws.ssm_instance_info:
        connection_status: true
        instance_ids:
          - "{{ _ec2_instance_info_dict['molecule-ssm-instance-info'].instance_id }}"
        validate_certs: true
      register: __ssm_instance_info_connection
      until:
        - __ssm_instance_info_connection.instances.0.connection_status |
          d('') == 'connected'
      retries: 30
      delay: 10

    - name: Ensure role is included with connection status
      ansible.builtin.include_role:
        name: ssm_instance_info
      vars:
        ssm_instance_info_connection_status: true
        ssm_instance_info_instance_ids:
          - "{{ _ec2_instance_info_dict['molecule-ssm-instance-info'].instance_id }}"

    - name: Ensure info with connection status is verified
      ansible.builtin.assert:
        that:
          - _ssm_instance_info_list | length == 1
          - _ssm_instance_info_list.0.connection_status == 'connected'

    - name: Ensure role is included with an unregistered instance id
      ansible.builtin.include_role:
        name: ssm_instance_info
      vars:
        ssm_instance_info_instance_ids:
          - i-0123456789abcdef0

    - name: Ensure info with an unregistered instance id is verified
      ansible.builtin.assert:
        that:
          - _ssm_instance_info_list == []
          - _ssm_instance_info_dict == {}
...
