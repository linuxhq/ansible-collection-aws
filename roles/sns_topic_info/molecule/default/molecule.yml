---
provisioner:
  inventory:
    group_vars:
      all:
        sns_topic_list:
          - name: molecule-sns-topic-info-bounce
            subscriptions:
              - endpoint: "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-bounce"
                protocol: sqs
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ses.amazonaws.com
                  Action:
                    - sns:Publish
                  Resource:
                    - "arn:aws:sns:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-bounce"
                  Condition:
                    StringEquals:
                      'AWS:SourceAccount': "{{ _aws_caller_info_account }}"
                      'AWS:SourceArn':
                        - "arn:aws:ses:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:identity/molecule-sns-topic-info.org"

          - name: molecule-sns-topic-info-complaint
            subscriptions:
              - endpoint: "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-complaint"
                protocol: sqs
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ses.amazonaws.com
                  Action:
                    - sns:Publish
                  Resource:
                    - "arn:aws:sns:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-complaint"
                  Condition:
                    StringEquals:
                      'AWS:SourceAccount': "{{ _aws_caller_info_account }}"
                      'AWS:SourceArn':
                        - "arn:aws:ses:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:identity/molecule-sns-topic-info.org"

          - name: molecule-sns-topic-info-delivery
            subscriptions:
              - endpoint: "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-delivery"
                protocol: sqs
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ses.amazonaws.com
                  Action:
                    - sns:Publish
                  Resource:
                    - "arn:aws:sns:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-delivery"
                  Condition:
                    StringEquals:
                      'AWS:SourceAccount': "{{ _aws_caller_info_account }}"
                      'AWS:SourceArn':
                        - "arn:aws:ses:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:identity/molecule-sns-topic-info.org"

        sqs_queue_list:
          - name: molecule-sns-topic-info-bounce
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS:
                      - "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sqs:*
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-bounce"
                - Effect: Allow
                  Principal:
                    Service: sns.amazonaws.com
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-bounce"
                  Condition:
                    ArnEquals:
                      'aws:SourceArn':
                        "arn:aws:sns:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-bounce"

          - name: molecule-sns-topic-info-complaint
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS:
                      - "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sqs:*
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-complaint"
                - Effect: Allow
                  Principal:
                    Service: sns.amazonaws.com
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-complaint"
                  Condition:
                    ArnEquals:
                      'aws:SourceArn':
                        "arn:aws:sns:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-complaint"

          - name: molecule-sns-topic-info-delivery
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS:
                      - "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sqs:*
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-delivery"
                - Effect: Allow
                  Principal:
                    Service: sns.amazonaws.com
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - "arn:aws:sqs:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-delivery"
                  Condition:
                    ArnEquals:
                      'aws:SourceArn':
                        "arn:aws:sns:{{ _aws_az_info_list_l.0[:-1] }}:{{ _aws_caller_info_account }}:molecule-sns-topic-info-delivery"
...
