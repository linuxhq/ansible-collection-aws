---
- name: Cleanup
  hosts: all
  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ssm_parameter_list:
          "{{ ssm_parameter_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ssm_parameter
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
