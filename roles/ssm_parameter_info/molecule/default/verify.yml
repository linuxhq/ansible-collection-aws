---
- name: Verify
  hosts: all

  roles:
    - ssm_parameter_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _ssm_parameter_info_dict['/molecule-ssm-parameter-info/db/admin/username'].value ==
              ssm_parameter_list.0.value
          - _ssm_parameter_info_dict['/molecule-ssm-parameter-info/db/admin/password'].value ==
              ssm_parameter_list.1.value
          - _ssm_parameter_info_dict['/molecule-ssm-parameter-info/sys/username'].value == ssm_parameter_list.2.value
          - _ssm_parameter_info_dict['/molecule-ssm-parameter-info/sys/password'].value == ssm_parameter_list.3.value

    - name: Ensure info is gathered for the first parameter
      ansible.builtin.include_role:
        name: ssm_parameter_info
      vars:
        ssm_parameter_info_list:
          - name: "{{ ssm_parameter_list.0.name }}"

    - name: Ensure info is gathered again for the sys parameters
      ansible.builtin.include_role:
        name: ssm_parameter_info
      vars:
        ssm_parameter_info_list:
          - name: "{{ ssm_parameter_list.2.name }}"
          - name: "{{ ssm_parameter_list.3.name }}"

    - name: Ensure only the second call's parameters are published
      ansible.builtin.assert:
        that:
          - _ssm_parameter_info_list | map(attribute='name') ==
            [ssm_parameter_list.2.name, ssm_parameter_list.3.name]
          - _ssm_parameter_info_dict |
            dict2items |
            map(attribute='key') |
            sort ==
            [ssm_parameter_list.2.name, ssm_parameter_list.3.name] | sort
          - _ssm_parameter_info_dict[ssm_parameter_list.3.name].value == ssm_parameter_list.3.value
...
