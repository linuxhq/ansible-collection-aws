---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        ssm_parameter_info_list:
          "{{ ssm_parameter_list }}"

        ssm_parameter_list:
          - name: /molecule/db/admin/username
            value: pku9qt7smMqgUixdWpwPH43ooMX9nWcT

          - name: /molecule/db/admin/password
            string_type: SecureString
            value: iEkPpbh4ygXRAutHzLCpX4ytvEgNUsd9

          - name: /molecule/sys/username
            value: VsxKsdzrz9aKwJzFthtPwYXkHqdncKp9

          - name: /molecule/sys/password
            string_type: SecureString
            value: gPTcwxVg7UpJPrHPmAq3aH9C49AigLHw

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
