---
- name: Verify
  hosts: all
  tasks:
    - name: Ensure aws account region opt-in statuses are gathered
      linuxhq.aws.account_region:
        name: "{{ _region.name }}"
        state: present
        validate_certs: true
      loop: "{{ account_region_list }}"
      loop_control:
        label: "{{ _region.name }}"
        loop_var: _region
      register: __account_region_enabled
      check_mode: true

    # Check mode predicts region_opt_status; previous_region_opt_status is the status AWS returned.
    - name: Ensure enabled regions are verified
      ansible.builtin.assert:
        that:
          - __account_region_enabled is not changed
          - __account_region_enabled.results | map(attribute='previous_region_opt_status') |
            reject('in', ['ENABLED', 'ENABLED_BY_DEFAULT']) | list == []

    - name: Ensure aws account regions are reset
      linuxhq.aws.account_region:
        name: "{{ _region.name }}"
        state: absent
        validate_certs: true
      loop: "{{ account_region_list }}"
      loop_control:
        label: "{{ _region.name }}"
        loop_var: _region
...
