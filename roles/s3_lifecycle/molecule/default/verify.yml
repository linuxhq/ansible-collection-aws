---
- name: Verify
  hosts: all

  roles:
    - role: s3_bucket_info
      s3_bucket_info_bucket_facts:
        bucket_lifecycle_configuration: true
      s3_bucket_info_name: "{{ s3_lifecycle_list.0.name }}"

  post_tasks:
    - name: Ensure lifecycle rules are verified
      ansible.builtin.assert:
        that:
          - _s3_bucket_info_dict[s3_lifecycle_list.0.name].bucket_lifecycle_configuration.Rules |
            map(attribute='ID') |
            sort ==
              s3_lifecycle_list.0.lifecycle_rules |
              map(attribute='rule_id') |
              sort
...
