---
- name: Verify
  hosts: all

  roles:
    - cloudwatchlogs_log_group_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _cloudwatchlogs_log_group_info_dict['molecule-cloudwatchlogs-log-group-info-00'].arn is defined
          - _cloudwatchlogs_log_group_info_dict['molecule-cloudwatchlogs-log-group-info-00'].log_group_name is defined
          - _cloudwatchlogs_log_group_info_dict['molecule-cloudwatchlogs-log-group-info-00'].retention_in_days == 30
          - _cloudwatchlogs_log_group_info_dict['molecule-cloudwatchlogs-log-group-info-01'].arn is defined
          - _cloudwatchlogs_log_group_info_dict['molecule-cloudwatchlogs-log-group-info-01'].log_group_name is defined
          - _cloudwatchlogs_log_group_info_dict['molecule-cloudwatchlogs-log-group-info-01'].retention_in_days == 60
          - _cloudwatchlogs_log_group_info_dict['molecule-cloudwatchlogs-log-group-info-02'].arn is defined
          - _cloudwatchlogs_log_group_info_dict['molecule-cloudwatchlogs-log-group-info-02'].log_group_name is defined
          - _cloudwatchlogs_log_group_info_dict['molecule-cloudwatchlogs-log-group-info-02'].retention_in_days == 120
...
