---
- name: Verify
  hosts: all
  roles:
    - rds_option_group_info

  tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _rds_option_group_info_dict[_og.option_group_name].engine_name == _og.engine_name
          - _rds_option_group_info_dict[_og.option_group_name].major_engine_version ==
              _og.major_engine_version | string
      loop: "{{ rds_option_group_list }}"
      loop_control:
        label: "{{ _og.option_group_name }}"
        loop_var: _og
...
