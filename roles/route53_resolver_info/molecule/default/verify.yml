---
- name: Verify
  hosts: all

  roles:
    - ec2_security_group_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  tasks:
    - name: Ensure role is included without name
      ansible.builtin.include_role:
        name: route53_resolver_info
      vars:
        route53_resolver_info_filters: {}

    - name: Ensure info without name is verified
      ansible.builtin.assert:
        that:
          - _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].arn is defined
          - _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].direction == 'OUTBOUND'
          - _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].id is defined
          - _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].ip_address_count == 2
          - _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].ip_addresses |
            length == 2
          - _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].tags.molecule ==
              'route53_resolver_info'
          - route53_resolver_list.0.ip_addresses.0.ip in
              _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].ip_addresses |
              map(attribute='ip') |
              list
          - route53_resolver_list.0.ip_addresses.0.subnet_id in
              _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].ip_addresses |
              map(attribute='subnet_id') |
              list
          - route53_resolver_list.0.ip_addresses.1.ip in
              _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].ip_addresses |
              map(attribute='ip') |
              list
          - route53_resolver_list.0.ip_addresses.1.subnet_id in
              _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].ip_addresses |
              map(attribute='subnet_id') |
              list
          - _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].protocols.0 == 'Do53'
          - _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].resolver_endpoint_type == 'IPV4'
          - _route53_resolver_info_dict['molecule-route53-resolver-info-cloudflare'].security_group_ids.0 ==
              _ec2_security_group_info_dict['molecule-route53-resolver-info'].group_id
          - _route53_resolver_info_dict['molecule-route53-resolver-info-google'].arn is defined
          - _route53_resolver_info_dict['molecule-route53-resolver-info-google'].direction == 'OUTBOUND'
          - _route53_resolver_info_dict['molecule-route53-resolver-info-google'].id is defined
          - _route53_resolver_info_dict['molecule-route53-resolver-info-google'].ip_address_count == 2
          - _route53_resolver_info_dict['molecule-route53-resolver-info-google'].ip_addresses |
            length == 2
          - route53_resolver_list.1.ip_addresses.0.ip in
              _route53_resolver_info_dict['molecule-route53-resolver-info-google'].ip_addresses |
              map(attribute='ip') |
              list
          - route53_resolver_list.1.ip_addresses.0.subnet_id in
              _route53_resolver_info_dict['molecule-route53-resolver-info-google'].ip_addresses |
              map(attribute='subnet_id') |
              list
          - route53_resolver_list.1.ip_addresses.1.ip in
              _route53_resolver_info_dict['molecule-route53-resolver-info-google'].ip_addresses |
              map(attribute='ip') |
              list
          - route53_resolver_list.1.ip_addresses.1.subnet_id in
              _route53_resolver_info_dict['molecule-route53-resolver-info-google'].ip_addresses |
              map(attribute='subnet_id') |
              list
          - _route53_resolver_info_dict['molecule-route53-resolver-info-google'].protocols.0 == 'Do53'
          - _route53_resolver_info_dict['molecule-route53-resolver-info-google'].resolver_endpoint_type == 'IPV4'
          - _route53_resolver_info_dict['molecule-route53-resolver-info-google'].security_group_ids.0 ==
              _ec2_security_group_info_dict['molecule-route53-resolver-info'].group_id

    - name: Ensure role is included with name
      ansible.builtin.include_role:
        name: route53_resolver_info
      vars:
        route53_resolver_info_filters:
          Name: "{{ route53_resolver_list.0.name }}"

    - name: Ensure info with name is verified
      ansible.builtin.assert:
        that:
          - _route53_resolver_info_list | length == 1
          - _route53_resolver_info_dict[route53_resolver_list.0.name].arn is defined
          - _route53_resolver_info_dict[route53_resolver_list.0.name].direction == 'OUTBOUND'
          - _route53_resolver_info_dict[route53_resolver_list.0.name].id is defined
          - _route53_resolver_info_dict[route53_resolver_list.0.name].ip_address_count == 2
          - _route53_resolver_info_dict[route53_resolver_list.0.name].ip_addresses |
            length == 2
          - _route53_resolver_info_dict[route53_resolver_list.0.name].protocols.0 == 'Do53'
          - _route53_resolver_info_dict[route53_resolver_list.0.name].resolver_endpoint_type == 'IPV4'

    - name: Ensure role is included with a filter that matches nothing
      ansible.builtin.include_role:
        name: route53_resolver_info
      vars:
        route53_resolver_info_filters:
          Name: molecule-does-not-exist

    - name: Ensure info with no matches is verified
      ansible.builtin.assert:
        that:
          - _route53_resolver_info_list == []
          - _route53_resolver_info_dict == {}
...
