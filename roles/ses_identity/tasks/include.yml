---
- name: Ensure information about aws simple email service identity is gathered
  tags:
    - ses_identity
  linuxhq.aws.ses_identity_info:
    name: "{{ _identity.identity }}"
    region: "{{ __ses_identity_region }}"
    validate_certs: true
  register: __ses_identity_info_query

- name: Ensure aws simple email service identity is present
  tags:
    - ses_identity
  community.aws.ses_identity:
    bounce_notifications: "{{ _identity.bounce_notifications | d(omit) }}"
    complaint_notifications: "{{ _identity.complaint_notifications | d(omit) }}"
    delivery_notifications: "{{ _identity.delivery_notifications | d(omit) }}"
    feedback_forwarding: "{{ _identity.feedback_forwarding | d(true) }}"
    identity: "{{ _identity.identity }}"
    state: present
    validate_certs: true
  when:
    - _identity.state == 'present'

- name: Ensure aws simple email service identity dkim is enabled
  tags:
    - ses_identity
  linuxhq.aws.ses_identity_dkim:
    identity: "{{ _identity.identity }}"
    region: "{{ __ses_identity_region }}"
    validate_certs: true
  register: __ses_identity_dkim
  when:
    - _identity.state == 'present'
    # In check mode a new identity is not created, so its DKIM cannot be predicted.
    - not ansible_check_mode or __ses_identity_info_query.identities | length > 0

- name: Ensure aws simple email service identity dkim attributes are generated
  tags:
    - ses_identity
  ansible.builtin.set_fact:
    __ses_identity_dkim_attributes:
      "{{ __ses_identity_dkim.dkim_attributes
          if __ses_identity_dkim.dkim_attributes is defined else
          __ses_identity_info_query.identities |
          map(attribute='dkim_attributes', default={}) |
          first |
          d({}) }}"

- name: Ensure aws simple email service identity dns records are generated
  tags:
    - ses_identity
  ansible.builtin.set_fact:
    __ses_identity_value_dkim: "{{ __ses_identity_dkim_attributes.tokens | d([]) }}"

- name: Ensure aws simple email service identity dmarc records are managed
  tags:
    - ses_identity
  amazon.aws.route53:
    # A TXT record with another value is replaced.
    overwrite: true
    record: "_dmarc.{{ _identity.identity }}"
    state: "{{ _identity.state }}"
    type: TXT
    validate_certs: true
    # An omitted value deletes the stored record, whatever its value.
    value: "{{ omit if _identity.state == 'absent' else '\"v=DMARC1; p=quarantine;\"' }}"
    zone: "{{ _identity.zone }}"
  register: __ses_identity_dmarc_result
  failed_when:
    - __ses_identity_dmarc_result.failed | d(false)
    - _identity.state != 'absent' or
      __ses_identity_dmarc_result.msg | d('') is not search('does not exist in Route53')

- name: Ensure aws simple email service identity dkim records are managed
  tags:
    - ses_identity
  amazon.aws.route53:
    # A record from an earlier run can point to another DKIM domain, which is replaced.
    overwrite: true
    record: "{{ _dkim }}._domainkey.{{ _identity.identity }}"
    state: "{{ _identity.state }}"
    type: CNAME
    validate_certs: true
    # An omitted value deletes the stored record, whichever DKIM domain an earlier run pointed it to.
    value:
      "{{ omit if _identity.state == 'absent' else
          _dkim ~ '.' ~ __ses_identity_dkim_attributes.signing_hosted_zone }}"
    zone: "{{ _identity.zone }}"
  register: __ses_identity_dkim_record_result
  loop: "{{ __ses_identity_value_dkim }}"
  loop_control:
    label: "{{ _dkim | d(none) }}"
    loop_var: _dkim
  failed_when:
    - __ses_identity_dkim_record_result.failed | d(false)
    - _identity.state != 'absent' or
      __ses_identity_dkim_record_result.msg | d('') is not search('does not exist in Route53')

- name: Ensure aws simple email service identity spf records are managed
  tags:
    - ses_identity
  amazon.aws.route53:
    # A TXT record with another value is replaced.
    overwrite: true
    record: "{{ _identity.identity }}"
    state: "{{ _identity.state }}"
    type: TXT
    validate_certs: true
    # An omitted value deletes the stored record, whatever its value.
    value: "{{ omit if _identity.state == 'absent' else '\"v=spf1 include:amazonses.com -all\"' }}"
    zone: "{{ _identity.zone }}"
  register: __ses_identity_spf_result
  failed_when:
    - __ses_identity_spf_result.failed | d(false)
    - _identity.state != 'absent' or
      __ses_identity_spf_result.msg | d('') is not search('does not exist in Route53')

- name: Ensure aws simple email service identity is absent
  tags:
    - ses_identity
  community.aws.ses_identity:
    identity: "{{ _identity.identity }}"
    state: absent
    validate_certs: true
  when:
    - _identity.state == 'absent'
...
