---
- name: Verify
  hosts: all
  roles:
    - aws_az_info
    - aws_caller_info

  post_tasks:
    - name: Ensure identities are queried
      linuxhq.aws.ses_identity_info:
        name: "{{ _identity.identity }}"
      register: __ses_identity_verify
      loop: "{{ ses_identity_list }}"
      loop_control:
        label: "{{ _identity.identity }}"
        loop_var: _identity

    - name: Ensure identity dkim is verified
      ansible.builtin.assert:
        that:
          - _query.identities | length == 1
          - _query.identities.0.dkim_attributes.signing_attributes_origin == 'AWS_SES'
          - _query.identities.0.dkim_attributes.signing_enabled | bool
          - _query.identities.0.dkim_attributes.tokens | length == 3
          - _query.identities.0.dkim_attributes.signing_hosted_zone | length > 0
          - _query.identities.0.verification_token | length > 0
      loop: "{{ __ses_identity_verify.results }}"
      loop_control:
        label: "{{ _query._identity.identity }}"
        loop_var: _query

    - name: Ensure identity dkim record names are generated
      ansible.builtin.set_fact:
        __ses_identity_dkim_record_list: >-
          {%- set records = [] -%}
          {%- for _query in __ses_identity_verify.results -%}
          {%- for _token in _query.identities.0.dkim_attributes.tokens -%}
          {%- set _ = records.append({'name': _token ~ '._domainkey.' ~ _query._identity.identity,
                                      'value': _token ~ '.' ~
                                               _query.identities.0.dkim_attributes.signing_hosted_zone,
                                      'zone': _query._identity.zone}) -%}
          {%- endfor -%}
          {%- endfor -%}
          {{ records }}

    - name: Ensure a dkim record points to another dkim domain, as an earlier role version could set it
      amazon.aws.route53:
        overwrite: true
        record: "{{ __ses_identity_dkim_record_list.0.name }}"
        state: present
        type: CNAME
        value: "{{ __ses_identity_dkim_record_list.0.name.split('.') | first }}.dkim.ap-southeast-4.amazonses.com"
        zone: "{{ __ses_identity_dkim_record_list.0.zone }}"

    - name: Ensure ses identity role corrects the dkim record
      ansible.builtin.include_role:
        name: ses_identity

    - name: Ensure identity dkim records are queried
      amazon.aws.route53:
        record: "{{ _record.name }}"
        state: get
        type: CNAME
        zone: "{{ _record.zone }}"
      register: __ses_identity_dkim_records
      loop: "{{ __ses_identity_dkim_record_list }}"
      loop_control:
        label: "{{ _record.name }}"
        loop_var: _record

    - name: Ensure identity verification txt records are queried
      amazon.aws.route53:
        record: "_amazonses.{{ _identity.identity }}"
        state: get
        type: TXT
        zone: "{{ _identity.zone }}"
      register: __ses_identity_txt_records
      loop: "{{ ses_identity_list }}"
      loop_control:
        label: "{{ _identity.identity }}"
        loop_var: _identity

    - name: Ensure identity dns records are verified
      ansible.builtin.assert:
        that:
          - __ses_identity_dkim_records.results | length == ses_identity_list | length * 3
          - __ses_identity_dkim_records.results |
              map(attribute='resource_record_sets') |
              map('length') |
              min == 1
          - __ses_identity_txt_records.results |
              map(attribute='resource_record_sets') |
              map('length') |
              max == 0

    - name: Ensure identity dkim record values are verified
      ansible.builtin.assert:
        that:
          - _record.resource_record_sets.0.resource_records |
            map(attribute='value') |
            map('regex_replace', '[.]$', '') |
            list == [_record._record.value | regex_replace('[.]$', '')]
      loop: "{{ __ses_identity_dkim_records.results }}"
      loop_control:
        label: "{{ _record._record.name }}"
        loop_var: _record

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        route53_zone_list:
          "{{ route53_zone_list |
              map('combine', {'state': 'absent'}) }}"
        ses_identity_list:
          "{{ ses_identity_list |
              map('combine', {'state': 'absent'}) }}"
        sns_topic_list:
          "{{ sns_topic_list |
              map('combine', {'state': 'absent'}) }}"
        sqs_queue_list:
          "{{ sqs_queue_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure a dkim record points to another dkim domain before removal
      amazon.aws.route53:
        overwrite: true
        record: "{{ __ses_identity_dkim_record_list.0.name }}"
        state: present
        type: CNAME
        value: "{{ __ses_identity_dkim_record_list.0.name.split('.') | first }}.dkim.ap-southeast-4.amazonses.com"
        zone: "{{ __ses_identity_dkim_record_list.0.zone }}"

    - name: Ensure ses identity role is included
      ansible.builtin.include_role:
        name: ses_identity

    - name: Ensure identity dkim records are queried after removal
      amazon.aws.route53:
        record: "{{ _record.name }}"
        state: get
        type: CNAME
        zone: "{{ _record.zone }}"
      register: __ses_identity_dkim_removed
      loop: "{{ __ses_identity_dkim_record_list }}"
      loop_control:
        label: "{{ _record.name }}"
        loop_var: _record

    - name: Ensure identity dkim records are removed
      ansible.builtin.assert:
        that:
          - __ses_identity_dkim_removed.results |
            map(attribute='resource_record_sets') |
            map('length') |
            max == 0

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - sns_topic
        - sqs_queue
        - route53_zone
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify
...
