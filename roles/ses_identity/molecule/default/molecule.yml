---
provisioner:
  inventory:
    group_vars:
      all:
        route53_zone_list:
          - zone: molecule-ses-identity.org

        ses_identity_list:
          - identity: molecule-ses-identity.org
            zone: molecule-ses-identity.org
          - identity: a.molecule-ses-identity.org
            zone: molecule-ses-identity.org
          - identity: b.molecule-ses-identity.org
            zone: molecule-ses-identity.org
          - identity: c.molecule-ses-identity.org
            zone: molecule-ses-identity.org

        sns_topic_list:
          - name: molecule-ses-identity-bounce
            subscriptions:
              - endpoint:
                  "{{ 'arn:aws:sqs:' ~
                      _aws_az_info_list_l.0[:-1] ~ ':' ~
                      _aws_caller_info_account ~
                      ':molecule-ses-identity-bounce' }}"
                protocol: sqs
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ses.amazonaws.com
                  Action:
                    - sns:Publish
                  Resource:
                    - "{{ 'arn:aws:sns:' ~
                          _aws_az_info_list_l.0[:-1] ~ ':' ~
                          _aws_caller_info_account ~
                          ':molecule-ses-identity-bounce' }}"
                  Condition:
                    StringEquals:
                      'AWS:SourceAccount': "{{ _aws_caller_info_account }}"
                      'AWS:SourceArn':
                        - "{{ 'arn:aws:ses:' ~
                              _aws_az_info_list_l.0[:-1] ~ ':' ~
                              _aws_caller_info_account ~
                              ':identity/molecule-ses-identity.org' }}"

          - name: molecule-ses-identity-complaint
            subscriptions:
              - endpoint:
                  "{{ 'arn:aws:sqs:' ~
                      _aws_az_info_list_l.0[:-1] ~ ':' ~
                      _aws_caller_info_account ~
                      ':molecule-ses-identity-complaint' }}"
                protocol: sqs
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ses.amazonaws.com
                  Action:
                    - sns:Publish
                  Resource:
                    - "{{ 'arn:aws:sns:' ~
                          _aws_az_info_list_l.0[:-1] ~ ':' ~
                          _aws_caller_info_account ~
                          ':molecule-ses-identity-complaint' }}"
                  Condition:
                    StringEquals:
                      'AWS:SourceAccount': "{{ _aws_caller_info_account }}"
                      'AWS:SourceArn':
                        - "{{ 'arn:aws:ses:' ~
                              _aws_az_info_list_l.0[:-1] ~ ':' ~
                              _aws_caller_info_account ~
                              ':identity/molecule-ses-identity.org' }}"

          - name: molecule-ses-identity-delivery
            subscriptions:
              - endpoint:
                  "{{ 'arn:aws:sqs:' ~
                      _aws_az_info_list_l.0[:-1] ~ ':' ~
                      _aws_caller_info_account ~
                      ':molecule-ses-identity-delivery' }}"
                protocol: sqs
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: ses.amazonaws.com
                  Action:
                    - sns:Publish
                  Resource:
                    - "{{ 'arn:aws:sns:' ~
                          _aws_az_info_list_l.0[:-1] ~ ':' ~
                          _aws_caller_info_account ~
                          ':molecule-ses-identity-delivery' }}"
                  Condition:
                    StringEquals:
                      'AWS:SourceAccount': "{{ _aws_caller_info_account }}"
                      'AWS:SourceArn':
                        - "{{ 'arn:aws:ses:' ~
                              _aws_az_info_list_l.0[:-1] ~ ':' ~
                              _aws_caller_info_account ~
                              ':identity/molecule-ses-identity.org' }}"

        sqs_queue_list:
          - name: molecule-ses-identity-bounce
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS:
                      - "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sqs:*
                  Resource:
                    - "{{ 'arn:aws:sqs:' ~
                          _aws_az_info_list_l.0[:-1] ~ ':' ~
                          _aws_caller_info_account ~
                          ':molecule-ses-identity-bounce' }}"
                - Effect: Allow
                  Principal:
                    Service: sns.amazonaws.com
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - "{{ 'arn:aws:sqs:' ~
                          _aws_az_info_list_l.0[:-1] ~ ':' ~
                          _aws_caller_info_account ~
                          ':molecule-ses-identity-bounce' }}"
                  Condition:
                    ArnEquals:
                      'aws:SourceArn':
                        "{{ 'arn:aws:sns:' ~
                            _aws_az_info_list_l.0[:-1] ~ ':' ~
                            _aws_caller_info_account ~
                            ':molecule-ses-identity-bounce' }}"

          - name: molecule-ses-identity-complaint
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS:
                      - "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sqs:*
                  Resource:
                    - "{{ 'arn:aws:sqs:' ~
                          _aws_az_info_list_l.0[:-1] ~ ':' ~
                          _aws_caller_info_account ~
                          ':molecule-ses-identity-complaint' }}"
                - Effect: Allow
                  Principal:
                    Service: sns.amazonaws.com
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - "{{ 'arn:aws:sqs:' ~
                          _aws_az_info_list_l.0[:-1] ~ ':' ~
                          _aws_caller_info_account ~
                          ':molecule-ses-identity-complaint' }}"
                  Condition:
                    ArnEquals:
                      'aws:SourceArn':
                        "{{ 'arn:aws:sns:' ~
                            _aws_az_info_list_l.0[:-1] ~ ':' ~
                            _aws_caller_info_account ~
                            ':molecule-ses-identity-complaint' }}"

          - name: molecule-ses-identity-delivery
            policy:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    AWS:
                      - "arn:aws:iam::{{ _aws_caller_info_account }}:root"
                  Action:
                    - sqs:*
                  Resource:
                    - "{{ 'arn:aws:sqs:' ~
                          _aws_az_info_list_l.0[:-1] ~ ':' ~
                          _aws_caller_info_account ~
                          ':molecule-ses-identity-delivery' }}"
                - Effect: Allow
                  Principal:
                    Service: sns.amazonaws.com
                  Action:
                    - sqs:SendMessage
                  Resource:
                    - "{{ 'arn:aws:sqs:' ~
                          _aws_az_info_list_l.0[:-1] ~ ':' ~
                          _aws_caller_info_account ~
                          ':molecule-ses-identity-delivery' }}"
                  Condition:
                    ArnEquals:
                      'aws:SourceArn':
                        "{{ 'arn:aws:sns:' ~
                            _aws_az_info_list_l.0[:-1] ~ ':' ~
                            _aws_caller_info_account ~
                            ':molecule-ses-identity-delivery' }}"
...
