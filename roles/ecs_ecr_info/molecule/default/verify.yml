---
- name: Verify
  hosts: all

  tasks:
    - name: Ensure role is included with repository names
      ansible.builtin.include_role:
        name: ecs_ecr_info
      vars:
        ecs_ecr_info_repository_names:
          - molecule-ecs-ecr-info-00

  post_tasks:
    - name: Ensure info with repository names is verified
      ansible.builtin.assert:
        that:
          - _ecs_ecr_info_list | length == 1
          - _ecs_ecr_info_dict.keys() | list == ['molecule-ecs-ecr-info-00']
          - _ecs_ecr_info_dict['molecule-ecs-ecr-info-00'].encryption_configuration.encryption_type == 'AES256'
          - _ecs_ecr_info_dict['molecule-ecs-ecr-info-00'].image_scanning_configuration.scan_on_push |
            bool
          - _ecs_ecr_info_dict['molecule-ecs-ecr-info-00'].image_tag_mutability == 'IMMUTABLE'
          - _ecs_ecr_info_dict['molecule-ecs-ecr-info-00'].registry_id is defined
          - _ecs_ecr_info_dict['molecule-ecs-ecr-info-00'].repository_arn is defined
          - _ecs_ecr_info_dict['molecule-ecs-ecr-info-00'].repository_name is defined
          - _ecs_ecr_info_dict['molecule-ecs-ecr-info-00'].repository_uri is defined

    - name: Ensure role is included without filters
      ansible.builtin.include_role:
        name: ecs_ecr_info

