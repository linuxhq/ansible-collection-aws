---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        ssm_association_list_create:
          - name: AWS-UpdateSSMAgent
            schedule_expression: 'cron(0 0 * * ? *)'
            targets:
              - key: InstanceIds
                values: ['*']

        ssm_association_list_update:
          - name: AWS-UpdateSSMAgent
            schedule_expression: 'cron(15 0 * * ? *)'
            targets:
              - key: InstanceIds
                values: ['*']

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
