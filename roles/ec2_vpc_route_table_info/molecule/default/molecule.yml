---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_vpc_igw_list:
          - name: molecule-ec2-vpc-route-table-info
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ec2-vpc-route-table-info'].id | d(omit) }}"

        ec2_vpc_nat_gateway_list:
          - name: molecule-ec2-vpc-route-table-info-pub-a
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vpc-route-table-info-pub-a'].id |
                           d(omit) }}"
            wait: true
          - name: molecule-ec2-vpc-route-table-info-pub-c
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vpc-route-table-info-pub-c'].id |
                           d(omit) }}"
            wait: true
          - name: molecule-ec2-vpc-route-table-info-pub-d
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vpc-route-table-info-pub-d'].id |
                           d(omit) }}"
            wait: true

        ec2_vpc_net_list:
          - name: molecule-ec2-vpc-route-table-info
            cidr_block: 10.0.0.0/16

        ec2_vpc_route_table_info_filters:
          tag:Name:
            "{{ ec2_vpc_route_table_list |
                d([]) |
                map(attribute='route_tables') |
                flatten |
                map(attribute='name') }}"

        ec2_vpc_route_table_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ec2-vpc-route-table-info'].id | d(omit) }}"
            route_tables:
              - name: "molecule-ec2-vpc-route-table-info-pub"
                tags:
                  molecule: ec2_vpc_route_table_info
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id: igw
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vpc-route-table-info-pub-a'].id |
                        d(omit) }}"
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vpc-route-table-info-pub-c'].id |
                        d(omit) }}"
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vpc-route-table-info-pub-d'].id |
                        d(omit) }}"

              - name: "molecule-ec2-vpc-route-table-info-pvt-a"
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id:
                      "{{ _ec2_vpc_nat_gateway_info_dict['molecule-ec2-vpc-route-table-info-pub-a'].nat_gateway_id |
                          d(omit) }}"
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vpc-route-table-info-pvt-a'].id |
                        d(omit) }}"

              - name: "molecule-ec2-vpc-route-table-info-pvt-c"
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id:
                      "{{ _ec2_vpc_nat_gateway_info_dict['molecule-ec2-vpc-route-table-info-pub-c'].nat_gateway_id |
                          d(omit) }}"
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vpc-route-table-info-pvt-c'].id |
                        d(omit) }}"

              - name: "molecule-ec2-vpc-route-table-info-pvt-d"
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id:
                      "{{ _ec2_vpc_nat_gateway_info_dict['molecule-ec2-vpc-route-table-info-pub-d'].nat_gateway_id |
                          d(omit) }}"
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-vpc-route-table-info-pvt-d'].id |
                        d(omit) }}"

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ec2-vpc-route-table-info'].id | d(omit) }}"
            subnets:
              - name: molecule-ec2-vpc-route-table-info-pub-a
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,0) }}"
              - name: molecule-ec2-vpc-route-table-info-pub-c
                az: us-east-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,1) }}"
              - name: molecule-ec2-vpc-route-table-info-pub-d
                az: us-east-1d
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,2) }}"
              - name: molecule-ec2-vpc-route-table-info-pvt-a
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,3) }}"
              - name: molecule-ec2-vpc-route-table-info-pvt-c
                az: us-east-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,4) }}"
              - name: molecule-ec2-vpc-route-table-info-pvt-d
                az: us-east-1d
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24,5) }}"
...
