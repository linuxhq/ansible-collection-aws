---
- name: Verify
  hosts: all

  roles:
    - role: s3_bucket_info
      s3_bucket_info_bucket_facts:
        bucket_website: true
      s3_bucket_info_name_filter: "molecule-s3-website-{{ ansible_facts.date_time.date }}-"

  post_tasks:
    - name: Ensure websites are verified
      ansible.builtin.assert:
        that:
          - _s3_bucket_info_dict[_website.name].bucket_website.IndexDocument.Suffix == 'index.html'
      loop: "{{ s3_website_list }}"
      loop_control:
        label: "{{ _website.name }}"
        loop_var: _website
...
