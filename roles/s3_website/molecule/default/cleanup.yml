---
- name: Cleanup
  hosts: all

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        s3_bucket_list:
          "{{ s3_bucket_list |
              map('combine', {'state': 'absent'}) }}"
        s3_website_list:
          "{{ s3_website_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - s3_website
        - s3_bucket
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
