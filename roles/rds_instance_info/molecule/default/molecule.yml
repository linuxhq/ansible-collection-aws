---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-rds-instance-info'].id | d(omit) }}"
            security_groups:
              - name: molecule-rds-instance-info-mariadb106
                rules:
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 3306
                    proto: tcp
              - name: molecule-rds-instance-info-mariadb118
                rules:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    ports:
                      - 3306
                    proto: tcp

        ec2_vpc_igw_list:
          - name: molecule-rds-instance-info
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-rds-instance-info'].id | d(omit) }}"

        ec2_vpc_net_list:
          - name: molecule-rds-instance-info
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-rds-instance-info'].id | d(omit) }}"
            subnets:
              - name: molecule-rds-instance-info-a
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,0) }}"
              - name: molecule-rds-instance-info-c
                az: us-east-1c
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,1) }}"

        iam_role_list:
          - name: molecule-rds-instance-info-monitoring
            assume_role_policy_document:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: monitoring.rds.amazonaws.com
                  Action:
                    - sts:AssumeRole
            create_instance_profile: false
            managed_policies:
              - AmazonRDSEnhancedMonitoringRole

        rds_instance_info_filters:
          db-instance-id:
            "{{ rds_instance_list |
                map(attribute='db_instance_identifier') }}"

        rds_instance_list:
          - allocated_storage: 20
            db_instance_class: db.t3.medium
            db_instance_identifier: molecule-rds-instance-info-mariadb106
            db_subnet_group_name: molecule-rds-instance-info
            engine: mariadb
            engine_version: 10.6.27
            master_user_password: sTxmp3nXHCiMf34e9eWcH39v
            master_username: mnkes9JwUdsq
            publicly_accessible: true
            skip_final_snapshot: true
            vpc_security_group_ids:
              - "{{ _ec2_security_group_info_dict['molecule-rds-instance-info-mariadb106'].group_id |
                    d(omit) }}"

          - allocated_storage: 20
            auto_minor_version_upgrade: false
            ca_certificate_identifier: rds-ca-rsa2048-g1
            copy_tags_to_snapshot: true
            db_instance_class: db.t3.medium
            db_instance_identifier: molecule-rds-instance-info-mariadb118
            db_parameter_group_name: molecule-rds-instance-info-mariadb118
            db_subnet_group_name: molecule-rds-instance-info
            enable_cloudwatch_logs_exports:
              - audit
              - error
              - general
              - slowquery
            enable_iam_database_authentication: true
            engine: mariadb
            engine_version: 11.8.5
            master_user_password: sTxmp3nXHCiMf34e9eWcH39v
            master_username: mnkes9JwUdsq
            max_allocated_storage: 40
            monitoring_interval: 60
            monitoring_role_arn:
              'arn:aws:iam::{{ _aws_caller_info_account }}:role/molecule-rds-instance-info-monitoring'
            multi_az: true
            option_group_name: molecule-rds-instance-info-mariadb118
            publicly_accessible: false
            storage_encrypted: true
            storage_type: gp3
            skip_final_snapshot: true
            vpc_security_group_ids:
              - "{{ _ec2_security_group_info_dict['molecule-rds-instance-info-mariadb118'].group_id |
                    d(omit) }}"

        rds_instance_param_group_list:
          - name: molecule-rds-instance-info-mariadb118
            engine: mariadb11.8
            immediate: true
            params:
              character_set_client: utf8mb4
              character_set_connection: utf8mb4
              character_set_database: utf8mb4
              character_set_results: utf8mb4
              character_set_server: utf8mb4
              collation_connection: utf8mb4_general_ci
              collation_server: utf8mb4_general_ci
              init_connect: SET NAMES utf8mb4 COLLATE utf8mb4_general_ci
              log_warnings: 2
              max_allowed_packet: 33554432

        rds_option_group_list:
          - engine_name: mariadb
            major_engine_version: 11.8
            option_group_name: molecule-rds-instance-info-mariadb118
            options:
              - option_name: MARIADB_AUDIT_PLUGIN
                option_settings:
                  - name: SERVER_AUDIT_FILE_ROTATE_SIZE
                    value: '1000000'
                  - name: SERVER_AUDIT_FILE_ROTATIONS
                    value: '30'
                  - name: SERVER_AUDIT_QUERY_LOG_LIMIT
                    value: '1024'

        rds_subnet_group_list:
          - name: molecule-rds-instance-info
            subnets:
              - "{{ _ec2_vpc_subnet_info_dict['molecule-rds-instance-info-a'].id | d(omit) }}"
              - "{{ _ec2_vpc_subnet_info_dict['molecule-rds-instance-info-c'].id | d(omit) }}"
...
