---
- name: Cleanup
  hosts: all

  roles:
    - ec2_security_group_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_security_group_list:
          "{{ [ec2_security_group_list.0 |
               combine({'security_groups': ec2_security_group_list.0.security_groups |
                                           map('combine', {'state': 'absent'})})] }}"
        ec2_vpc_igw_list:
          "{{ ec2_vpc_igw_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              map('combine', {'state': 'absent'}) }}"
        elb_application_lb_list:
          "{{ elb_application_lb_list |
              map('combine', {'state': 'absent'}) }}"
        elb_target_group_list:
          "{{ elb_target_group_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure application load balancer role is included
      ansible.builtin.include_role:
        name: elb_application_lb

    - name: Ensure application load balancer network interfaces are deleted
      amazon.aws.ec2_eni_info:
        filters:
          description: ELB app/molecule-elb-application-lb-*
      register: _eni_query
      delay: 10
      retries: 60
      until: _eni_query.network_interfaces | length == 0

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ec2_security_group
        - elb_target_group
        - ec2_vpc_subnet
        - ec2_vpc_igw
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
