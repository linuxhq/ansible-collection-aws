---
- name: Verify
  hosts: all

  roles:
    - ec2_security_group_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info
    - elb_application_lb_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _elb_application_lb_info_dict[_loadbalancer.name].listeners.0.port ==
              _loadbalancer.listeners.0.Port
          - _elb_application_lb_info_dict[_loadbalancer.name].vpc_id ==
              _ec2_vpc_net_info_dict['molecule'].id
      loop: "{{ elb_application_lb_list }}"
      loop_control:
        label: "{{ _loadbalancer.name }}"
        loop_var: _loadbalancer
...
