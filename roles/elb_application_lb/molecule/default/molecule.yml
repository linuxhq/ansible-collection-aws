---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-elb-application-lb'].id | d(omit) }}"
            security_groups:
              - name: molecule-elb-application-lb-80
                rules:
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 80
                      - 443
                    proto: tcp
              - name: molecule-elb-application-lb-81
                rules:
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 81
                    proto: tcp
                rules_egress:
                  - cidr_ip: "{{ ec2_vpc_net_list.0.cidr_block }}"
                    proto: -1

        ec2_vpc_igw_list:
          - name: molecule-elb-application-lb
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-elb-application-lb'].id | d(omit) }}"

        ec2_vpc_net_list:
          - name: molecule-elb-application-lb
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-elb-application-lb'].id | d(omit) }}"
            subnets:
              - name: molecule-elb-application-lb-a
                az: us-east-1a
                cidr: 192.168.0.0/25
              - name: molecule-elb-application-lb-c
                az: us-east-1c
                cidr: 192.168.0.128/25

        elb_application_lb_list:
          - name: molecule-elb-application-lb-80
            listeners:
              - Protocol: HTTP
                Port: 80
                DefaultActions:
                  - Type: forward
                    TargetGroupName: molecule-elb-application-lb-8080
            security_groups:
              - "{{ _ec2_security_group_info_dict['molecule-elb-application-lb-80'].group_id |
                    d(omit) }}"
            subnets:
              - "{{ _ec2_vpc_subnet_info_dict['molecule-elb-application-lb-a'].id | d(omit) }}"
              - "{{ _ec2_vpc_subnet_info_dict['molecule-elb-application-lb-c'].id | d(omit) }}"

          - name: molecule-elb-application-lb-81
            listeners:
              - Protocol: HTTP
                Port: 81
                DefaultActions:
                  - Type: forward
                    TargetGroupName: molecule-elb-application-lb-8081
            security_groups:
              - "{{ _ec2_security_group_info_dict['molecule-elb-application-lb-81'].group_id |
                    d(omit) }}"
            subnets:
              - "{{ _ec2_vpc_subnet_info_dict['molecule-elb-application-lb-a'].id | d(omit) }}"
              - "{{ _ec2_vpc_subnet_info_dict['molecule-elb-application-lb-c'].id | d(omit) }}"

        elb_target_group_list:
          - name: molecule-elb-application-lb-8080
            health_check_interval: 10
            health_check_path: /healthcheck
            health_check_port: 8080
            health_check_protocol: http
            healthy_threshold_count: 3
            modify_targets: false
            port: 8080
            protocol: http
            stickiness_enabled: true
            target_type: instance
            unhealthy_threshold_count: 3
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-elb-application-lb'].id | d(omit) }}"

          - name: molecule-elb-application-lb-8081
            health_check_interval: 10
            health_check_path: /admin
            health_check_port: 8081
            health_check_protocol: http
            healthy_threshold_count: 3
            modify_targets: false
            port: 8081
            protocol: http
            stickiness_enabled: true
            target_type: instance
            unhealthy_threshold_count: 3
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-elb-application-lb'].id | d(omit) }}"
...
