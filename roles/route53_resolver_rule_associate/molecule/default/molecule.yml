---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-1'].id | d(omit) }}"
            security_groups:
              - name: molecule-route53resolver
                rules:
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 53
                      - 443
                    proto: tcp
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 53
                    proto: udp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1

        ec2_vpc_net_list:
          - name: molecule-1
            cidr_block: 192.168.0.0/24
          - name: molecule-2
            cidr_block: 192.168.1.0/24
          - name: molecule-3
            cidr_block: 192.168.2.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-1'].id | d(omit) }}"
            subnets:
              - name: molecule-a
                az:
                  "{{ lookup('ansible.builtin.ini',
                             'region',
                             file='~/.aws/config',
                             section='profile molecule') ~ 'a' }}"
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,0) }}"
              - name: molecule-c
                az:
                  "{{ lookup('ansible.builtin.ini',
                             'region',
                             file='~/.aws/config',
                             section='profile molecule') ~ 'c' }}"
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,1) }}"

        route53_resolver_list:
          - name: molecule-cloudflare
            direction: OUTBOUND
            ip_addresses:
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-a'].id |
                               d(omit) }}"
                ip: 192.168.0.125
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-c'].id |
                               d(omit) }}"
                ip: 192.168.0.253
            security_group_ids:
              - "{{ _ec2_security_group_info_dict['molecule-route53resolver'].group_id |
                    d(omit) }}"

          - name: molecule-google
            direction: OUTBOUND
            ip_addresses:
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-a'].id |
                               d(omit) }}"
                ip: 192.168.0.126
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-c'].id |
                               d(omit) }}"
                ip: 192.168.0.254
            security_group_ids:
              - "{{ _ec2_security_group_info_dict['molecule-route53resolver'].group_id |
                    d(omit) }}"

        route53_resolver_rule_associate_list:
          - name: molecule-1
            resolver_rule_id: "{{ _route53_resolver_rule_info_dict['molecule-cloudflare'].id |
                                  d(omit) }}"
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-1'].id | d(omit) }}"

          - name: molecule-1
            resolver_rule_id: "{{ _route53_resolver_rule_info_dict['molecule-google'].id |
                                  d(omit) }}"
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-1'].id | d(omit) }}"

          - name: molecule-2
            resolver_rule_id: "{{ _route53_resolver_rule_info_dict['molecule-cloudflare'].id |
                                  d(omit) }}"
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-2'].id | d(omit) }}"

          - name: molecule-2
            resolver_rule_id: "{{ _route53_resolver_rule_info_dict['molecule-google'].id |
                                  d(omit) }}"
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-2'].id | d(omit) }}"

          - name: molecule-3
            resolver_rule_id: "{{ _route53_resolver_rule_info_dict['molecule-cloudflare'].id |
                                  d(omit) }}"
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-3'].id | d(omit) }}"

          - name: molecule-3
            resolver_rule_id: "{{ _route53_resolver_rule_info_dict['molecule-google'].id |
                                  d(omit) }}"
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-3'].id | d(omit) }}"

        route53_resolver_rule_list:
          - name: molecule-cloudflare
            domain_name: cloudflare.com
            resolver_endpoint_id: "{{ _route53_resolver_info_dict['molecule-cloudflare'].id |
                                      d(omit) }}"
            rule_type: FORWARD
            target_ips:
              - ip: 1.1.1.1
                port: 53
              - ip: 1.1.1.2
                port: 53

          - name: molecule-google
            domain_name: google.com
            resolver_endpoint_id: "{{ _route53_resolver_info_dict['molecule-google'].id |
                                      d(omit) }}"
            rule_type: FORWARD
            target_ips:
              - ip: 8.8.8.8
                port: 53
              - ip: 8.8.8.4
                port: 53
...
