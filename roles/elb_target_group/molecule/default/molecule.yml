---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_ami_info_list:
          - name: 'AlmaLinux OS 9'
            filters:
              owner-alias: aws-marketplace
              product-code: 3kukoxmnoighcsbjd0u4nq9ds
              product-code.type: marketplace
              is-public: true
              virtualization-type: hvm

        ec2_instance_list:
          - name: molecule-elb-target-group-1
            exact_count: 1
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t3a.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-elb-target-group-a'].id |
                               d(omit) }}"
          - name: molecule-elb-target-group-2
            exact_count: 1
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t3a.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-elb-target-group-a'].id |
                               d(omit) }}"
          - name: molecule-elb-target-group-3
            exact_count: 1
            image_id: "{{ _ec2_ami_info_latest['AlmaLinux OS 9'] }}"
            instance_type: t3a.medium
            vpc_subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-elb-target-group-a'].id |
                               d(omit) }}"

        ec2_vpc_net_list:
          - name: molecule-elb-target-group
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-elb-target-group'].id | d(omit) }}"
            subnets:
              - name: molecule-elb-target-group-a
                az: us-east-1a
                cidr: 192.168.0.0/24

        elb_target_group_list:
          - name: molecule-elb-target-group-lambda
            modify_targets: false
            target_type: lambda

          - name: molecule-elb-target-group-8080
            health_check_interval: 10
            health_check_path: /healthcheck
            health_check_port: 8080
            health_check_protocol: http
            healthy_threshold_count: 3
            port: 8080
            protocol: http
            stickiness_enabled: true
            target_type: instance
            targets:
              - Id: "{{ _ec2_instance_info_dict['molecule-elb-target-group-1'].instance_id |
                        d(omit) }}"
                Port: 8080
              - Id: "{{ _ec2_instance_info_dict['molecule-elb-target-group-2'].instance_id |
                        d(omit) }}"
                Port: 8080
              - Id: "{{ _ec2_instance_info_dict['molecule-elb-target-group-3'].instance_id |
                        d(omit) }}"
                Port: 8080
            unhealthy_threshold_count: 3
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-elb-target-group'].id | d(omit) }}"

          - name: molecule-elb-target-group-8081
            health_check_interval: 10
            health_check_path: /admin
            health_check_port: 8081
            health_check_protocol: http
            healthy_threshold_count: 3
            port: 8081
            protocol: http
            stickiness_enabled: true
            target_type: instance
            targets:
              - Id: "{{ _ec2_instance_info_dict['molecule-elb-target-group-1'].instance_id |
                        d(omit) }}"
                Port: 8081
              - Id: "{{ _ec2_instance_info_dict['molecule-elb-target-group-2'].instance_id |
                        d(omit) }}"
                Port: 8081
              - Id: "{{ _ec2_instance_info_dict['molecule-elb-target-group-3'].instance_id |
                        d(omit) }}"
                Port: 8081
            unhealthy_threshold_count: 3
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-elb-target-group'].id | d(omit) }}"
...
