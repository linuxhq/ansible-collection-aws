---
- name: Verify
  hosts: all
  roles:
    - ec2_instance_info
    - ec2_vpc_net_info
    - elb_target_group_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _elb_target_group_info_dict[_tg.name].target_type == _tg.target_type
          - _tg.vpc_id is not defined or
            _elb_target_group_info_dict[_tg.name].vpc_id == _tg.vpc_id
      loop: "{{ elb_target_group_list }}"
      loop_control:
        label: "{{ _tg.name }}"
        loop_var: _tg
...
