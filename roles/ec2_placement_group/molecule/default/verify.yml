---
- name: Verify
  hosts: all

  roles:
    - ec2_placement_group_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _ec2_placement_group_info_dict[_pg.1.name].group_id is defined
          - _ec2_placement_group_info_dict[_pg.1.name].strategy == _pg.0.strategy
      loop:
        "{{ q('ansible.builtin.subelements',
              ec2_placement_group_list,
              'placement_groups') }}"
      loop_control:
        label: "{{ _pg.1.name }}"
        loop_var: _pg
...
