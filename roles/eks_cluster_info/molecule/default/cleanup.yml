---
- name: Cleanup
  hosts: all

  roles:
    - aws_caller_info
    - ec2_security_group_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_security_group_list:
          "{{ [ec2_security_group_list.0 |
               combine({'security_groups': ec2_security_group_list.0.security_groups |
                                           map('combine', {'state': 'absent'})})] }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              map('combine', {'state': 'absent'}) }}"
        eks_cluster_list:
          "{{ eks_cluster_list |
              map('combine', {'state': 'absent'}) }}"
        iam_role_list:
          "{{ iam_role_list |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - eks_cluster
        - ec2_security_group
        - ec2_vpc_subnet
        - ec2_vpc_net
        - iam_role
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
