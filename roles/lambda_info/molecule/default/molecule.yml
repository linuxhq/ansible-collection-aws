---
provisioner:
  inventory:
    group_vars:
      all:
        iam_role_list:
          - name: molecule-lambda-info-pass
            assume_role_policy_document:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Principal:
                    Service: lambda.amazonaws.com
                  Action:
                    - sts:AssumeRole
            create_instance_profile: false
            delete_instance_profile: true
            managed_policies:
              - ReadOnlyAccess

        lambda_list:
          - name: molecule-lambda-info-pass
            architecture: x86_64
            environment_variables:
              MOLECULE: 'true'
            handler: lambda_function.lambda_handler
            memory_size: 128
            region: us-east-1
            role: "arn:aws:iam::{{ _aws_caller_info_account }}:role/molecule-lambda-info-pass"
            runtime: python3.11
            tracing_mode: PassThrough
            zip_file: "{{ role_path | d }}/files/pass.zip"
...
