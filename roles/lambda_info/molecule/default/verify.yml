---
- name: Verify
  hosts: all

  roles:
    - aws_caller_info
    - lambda_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - _lambda_info_dict['molecule-lambda-info-pass'].architectures.0 == lambda_list.0.architecture
          - _lambda_info_dict['molecule-lambda-info-pass'].description == lambda_list.0.name
          - _lambda_info_dict['molecule-lambda-info-pass'].environment.variables.MOLECULE == lambda_list.0.environment_variables.MOLECULE
          - _lambda_info_dict['molecule-lambda-info-pass'].function_arn is defined
          - _lambda_info_dict['molecule-lambda-info-pass'].function_name == lambda_list.0.name
          - _lambda_info_dict['molecule-lambda-info-pass'].memory_size == lambda_list.0.memory_size
          - _lambda_info_dict['molecule-lambda-info-pass'].role == lambda_list.0.role
          - _lambda_info_dict['molecule-lambda-info-pass'].runtime == lambda_list.0.runtime
          - _lambda_info_dict['molecule-lambda-info-pass'].tracing_config.mode == lambda_list.0.tracing_mode
...
