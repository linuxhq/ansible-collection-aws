---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_transit_gateway_list:
          - name: molecule-ec2-transit-gateway-vpc-attachment-info

        ec2_transit_gateway_vpc_attachment_list:
          - name: molecule-ec2-transit-gateway-vpc-attachment-info
            tags:
              molecule: ec2_transit_gateway_vpc_attachment_info
            subnets:
              - "{{ _ec2_vpc_subnet_info_dict['molecule-ec2-transit-gateway-vpc-attachment-info'].id | d(omit) }}"
            transit_gateway: "{{ _ec2_transit_gateway_info_dict['molecule-ec2-transit-gateway-vpc-attachment-info'].transit_gateway_id |
                                 d(omit) }}"

        ec2_vpc_net_list:
          - name: molecule-ec2-transit-gateway-vpc-attachment-info
            cidr_block: 10.0.0.0/16

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ec2-transit-gateway-vpc-attachment-info'].id | d(omit) }}"
            subnets:
              - name: molecule-ec2-transit-gateway-vpc-attachment-info
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(24, 0) }}"
...
