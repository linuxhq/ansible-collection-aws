---
- name: Cleanup
  hosts: all
  roles:
    - ec2_vpc_nat_gateway_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_vpc_igw_list:
          "{{ (ec2_vpc_igw_list |
               map('combine', {'state': 'absent'}))
              if 'molecule' in _ec2_vpc_net_info_dict
              else [] }}"
        ec2_vpc_nat_gateway_list:
          "{{ (ec2_vpc_nat_gateway_list |
               map('combine', {'state': 'absent'}))
              if 'molecule' in _ec2_vpc_nat_gateway_info_dict
              else [] }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_route_table_list:
          "{{ (ec2_vpc_route_table_list |
               map('combine', {'state': 'absent'}))
              if 'molecule' in _ec2_vpc_nat_gateway_info_dict and
                 'molecule-c' in _ec2_vpc_subnet_info_dict
              else [] }}"
        ec2_vpc_subnet_list:
          "{{ (ec2_vpc_subnet_list |
               map('combine', {'state': 'absent'}))
              if 'molecule' in _ec2_vpc_net_info_dict
              else [] }}"
        ssm_parameter_list:
          "{{ dict(ssm_parameter_list |
                   map(attribute='name') |
                   zip_longest([], fillvalue='')) |
              dict2items(key_name='name', value_name='value') |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ssm_parameter
        - ec2_vpc_route_table
        - ec2_vpc_nat_gateway
        - ec2_vpc_subnet
        - ec2_vpc_igw
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
