---
- name: Verify
  hosts: all

  roles:
    - ec2_vpc_igw_info
    - ec2_vpc_nat_gateway_info
    - ec2_vpc_net_info
    - ec2_vpc_route_table_info
    - ec2_vpc_subnet_info

  tasks:
    - name: Ensure parameter info is gathered
      ansible.builtin.include_role:
        name: ssm_parameter_info
      vars:
        ssm_parameter_info_list: "{{ ssm_parameter_list }}"

    - name: Ensure parameters are verified
      ansible.builtin.assert:
        that:
          - _ssm_parameter_info_dict[_parameter.name].value == _parameter.value
      loop: "{{ ssm_parameter_list }}"
      loop_control:
        label: "{{ _parameter.name }}"
        loop_var: _parameter
...
