---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_vpc_igw_list:
          - name: molecule-ssm-parameter
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ssm-parameter'].id | d(omit) }}"

        ec2_vpc_nat_gateway_list:
          - name: molecule-ssm-parameter
            if_exist_do_not_create: true
            release_eip: true
            subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-ssm-parameter-a'].id |
                           d(omit) }}"
            wait: true

        ec2_vpc_net_list:
          - name: molecule-ssm-parameter
            cidr_block: 192.168.0.0/24

        ec2_vpc_route_table_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ssm-parameter'].id | d(omit) }}"
            route_tables:
              - name: molecule-ssm-parameter-a
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id: igw
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-ssm-parameter-a'].id | d(omit) }}"

              - name: molecule-ssm-parameter-c
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id: "{{ _ec2_vpc_nat_gateway_info_dict['molecule-ssm-parameter'].nat_gateway_id |
                                    d(omit) }}"
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule-ssm-parameter-c'].id | d(omit) }}"

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-ssm-parameter'].id | d(omit) }}"
            subnets:
              - name: molecule-ssm-parameter-a
                az:
                  "{{ lookup('ansible.builtin.ini',
                             'region',
                             file='~/.aws/config',
                             section='profile molecule') ~ 'a' }}"

                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,0) }}"
              - name: molecule-ssm-parameter-c
                az:
                  "{{ lookup('ansible.builtin.ini',
                             'region',
                             file='~/.aws/config',
                             section='profile molecule') ~ 'c' }}"
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,1) }}"

        ssm_parameter_list:
          - name: /molecule-ssm-parameter/vpc/id
            value: "{{ _ec2_vpc_net_info_dict['molecule-ssm-parameter'].id | d(omit) }}"

          - name: /molecule-ssm-parameter/vpc/igw/id
            value: "{{ _ec2_vpc_igw_info_dict['molecule-ssm-parameter'].internet_gateway_id |
                       d(omit) }}"

          - name: /molecule-ssm-parameter/vpc/nat/id
            value: "{{ _ec2_vpc_nat_gateway_info_dict['molecule-ssm-parameter'].nat_gateway_id |
                       d(omit) }}"

          - name: /molecule-ssm-parameter/vpc/rtb/a/id
            value: "{{ _ec2_vpc_route_table_info_dict['molecule-ssm-parameter-a'].route_table_id |
                       d(omit) }}"

          - name: /molecule-ssm-parameter/vpc/rtb/c/id
            value: "{{ _ec2_vpc_route_table_info_dict['molecule-ssm-parameter-c'].route_table_id |
                       d(omit) }}"

          - name: /molecule-ssm-parameter/vpc/subnet/a/id
            value: "{{ _ec2_vpc_subnet_info_dict['molecule-ssm-parameter-a'].id | d(omit) }}"

          - name: /molecule-ssm-parameter/vpc/subnet/c/id
            value: "{{ _ec2_vpc_subnet_info_dict['molecule-ssm-parameter-c'].id | d(omit) }}"
...
