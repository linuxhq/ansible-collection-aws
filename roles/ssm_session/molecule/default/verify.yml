---
- name: Verify
  hosts: all

  tasks:
    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _role }}"
      loop:
        - aws_caller_info
        - aws_az_info
        - ec2_instance_info
      loop_control:
        label: "{{ _role | d(none) }}"
        loop_var: _role

    - name: Ensure session document is gathered
      linuxhq.aws.ssm_document_info:
        name: SSM-SessionManagerRunShell
        validate_certs: true
      register: __ssm_session_document_query

    - name: Ensure session document shell profiles are trimmed
      ansible.builtin.assert:
        that:
          - __ssm_session_document_query.document.content.inputs.shellProfile.linux == 'cd'
          - __ssm_session_document_query.document.content.inputs.shellProfile.windows == ''

    - name: Ensure command is executed
      linuxhq.aws.ssm_send_command:
        document_name: AWS-RunShellScript
        parameters:
          commands:
            - touch /tmp/molecule
        targets:
          - key: InstanceIds
            values:
              - "{{ _ec2_instance_info_dict[ec2_instance_list.0.name].instance_id }}"
        validate_certs: true
        wait: true
      register: __ssm_send_command_result
      until:
        - __ssm_send_command_result is not failed
      retries: 30
      delay: 10

    - name: Ensure command return values are unmasked
      ansible.builtin.assert:
        that:
          - __ssm_send_command_result.command.parameters.commands == ['touch /tmp/molecule']
          - __ssm_send_command_result.command_id == __ssm_send_command_result.command.command_id

    - name: Ensure command result is gathered
      ansible.builtin.stat:
        path: /tmp/molecule
      register: __ssm_session_stat
      vars:
        ansible_aws_ssm_bucket_name:
          "{{ _aws_caller_info_account }}-{{ _aws_az_info_list_l.0[:-1] }}-ssm-ansible"
        ansible_aws_ssm_instance_id: "{{ _ec2_instance_info_dict[ec2_instance_list.0.name].instance_id }}"
        ansible_aws_ssm_region: "{{ _aws_az_info_list_l.0[:-1] }}"
        ansible_aws_ssm_s3_addressing_style: virtual
        ansible_aws_ssm_timeout: 3600
        ansible_connection: community.aws.aws_ssm
        ansible_python_interpreter: /usr/bin/python3
        ansible_user: ec2-user

    - name: Ensure command result is verified
      ansible.builtin.assert:
        that:
          - __ssm_session_stat.stat.exists | bool
...
