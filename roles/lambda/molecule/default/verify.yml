---
- name: Verify
  hosts: all
  roles:
    - aws_caller_info

    - role: lambda_info
      lambda_info_function_name: "{{ lambda_list.0.name }}"
      lambda_info_query: config

  post_tasks:
    - name: Ensure aws lambda functions are verified
      ansible.builtin.assert:
        that:
          - _lambda_info_dict[_function.name].function_arn is defined
          - _lambda_info_dict[_function.name].role == _function.role
          - _lambda_info_dict[_function.name].runtime == _function.runtime
      loop: "{{ lambda_list }}"
      loop_control:
        label: "{{ _function.name }}"
        loop_var: _function
...
