---
dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_DEPRECATION_WARNINGS: false
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        ec2_instance_metadata_http_endpoint: enabled
        ec2_instance_metadata_http_tokens: required
        ec2_instance_metadata_http_put_response_hop_limit: 2
        ec2_instance_metadata_instance_metadata_tags: disabled
        ec2_instance_metadata_regions:
          "{{ (_aws_region_info_list |
              map(attribute='region_name')) |
              d(['us-east-1']) }}"
        ec2_instance_metadata_info_regions:
          "{{ (_aws_region_info_list |
              map(attribute='region_name')) |
              d(['us-east-1']) }}"

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
