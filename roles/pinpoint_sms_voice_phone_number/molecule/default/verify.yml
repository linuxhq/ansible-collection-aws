---
- name: Verify
  hosts: all
  roles:
    - pinpoint_sms_voice_phone_number_info

  post_tasks:
    - name: Ensure requested phone number is selected
      ansible.builtin.set_fact:
        __pinpoint_sms_voice_phone_number_verify:
          "{{ _pinpoint_sms_voice_phone_number_info_dict['molecule-pinpoint-simulator'] }}"

    - name: Ensure requested phone number is verified
      ansible.builtin.assert:
        that:
          - __pinpoint_sms_voice_phone_number_verify.iso_country_code == 'US'
          - __pinpoint_sms_voice_phone_number_verify.message_type == 'TRANSACTIONAL'
          - __pinpoint_sms_voice_phone_number_verify.number_capabilities == ['SMS']
          - __pinpoint_sms_voice_phone_number_verify.number_type == 'SIMULATOR'
          - __pinpoint_sms_voice_phone_number_verify.status == 'ACTIVE'
          - __pinpoint_sms_voice_phone_number_verify.tags | dict2items | length == 2
          - __pinpoint_sms_voice_phone_number_verify.tags.Name == 'molecule-pinpoint-simulator'
          - __pinpoint_sms_voice_phone_number_verify.tags.molecule == 'pinpoint_sms_voice_phone_number'

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        pinpoint_sms_voice_phone_number_list:
          "{{ pinpoint_sms_voice_phone_number_list |
              map('combine',
                  {'phone_number_id':
                   __pinpoint_sms_voice_phone_number_verify.phone_number_id,
                   'state':
                   'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - pinpoint_sms_voice_phone_number
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify

    - name: Ensure information about aws end user messaging sms phone numbers is gathered after release
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_number_info

    - name: Ensure released phone number is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_phone_number_info_list |
            selectattr('phone_number_id', 'equalto', __pinpoint_sms_voice_phone_number_verify.phone_number_id) |
            rejectattr('status', 'equalto', 'DELETED') | list == []
...
