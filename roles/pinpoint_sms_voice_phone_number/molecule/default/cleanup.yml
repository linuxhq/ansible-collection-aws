---
- name: Cleanup
  hosts: all

  roles:
    - pinpoint_sms_voice_phone_number_info

  post_tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        pinpoint_sms_voice_phone_number_list:
          "{{ pinpoint_sms_voice_phone_number_list |
              map('combine',
                  {'phone_number_id':
                   _pinpoint_sms_voice_phone_number_info_dict['molecule-pinpoint-sms-voice-phone-number-simulator'].phone_number_id,
                   'state':
                   'absent'})
              if 'molecule-pinpoint-sms-voice-phone-number-simulator' in _pinpoint_sms_voice_phone_number_info_dict
              else [] }}"

    - name: Ensure phone numbers are removed
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_number
...
