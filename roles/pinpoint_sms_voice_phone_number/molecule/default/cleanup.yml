---
- name: Cleanup
  hosts: all
  roles:
    - pinpoint_sms_voice_phone_number_info

  post_tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        pinpoint_sms_voice_phone_number_list:
          "{{ pinpoint_sms_voice_phone_number_list |
              map('combine',
                  {'phone_number_id':
                   _pinpoint_sms_voice_phone_number_info_dict['molecule-pinpoint-simulator'].phone_number_id,
                   'state':
                   'absent'})
              if 'molecule-pinpoint-simulator' in _pinpoint_sms_voice_phone_number_info_dict
              else [] }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - pinpoint_sms_voice_phone_number
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
