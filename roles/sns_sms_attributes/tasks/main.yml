---
- name: Ensure aws simple notification service sms attributes are managed
  tags:
    - sns_sms_attributes
  linuxhq.aws.sns_sms_attributes:
    default_sender_id:
      "{{ sns_sms_attributes_default_sender_id
          if sns_sms_attributes_default_sender_id is not none
          else omit }}"
    default_sms_type:
      "{{ sns_sms_attributes_default_sms_type
          if sns_sms_attributes_default_sms_type is not none
          else omit }}"
    delivery_status_iam_role:
      "{{ sns_sms_attributes_delivery_status_iam_role
          if sns_sms_attributes_delivery_status_iam_role is not none
          else omit }}"
    delivery_status_success_sampling_rate:
      "{{ sns_sms_attributes_delivery_status_success_sampling_rate
          if sns_sms_attributes_delivery_status_success_sampling_rate is not none
          else omit }}"
    monthly_spend_limit:
      "{{ sns_sms_attributes_monthly_spend_limit
          if sns_sms_attributes_monthly_spend_limit is not none
          else omit }}"
    usage_report_s3_bucket:
      "{{ sns_sms_attributes_usage_report_s3_bucket
          if sns_sms_attributes_usage_report_s3_bucket is not none
          else omit }}"
    validate_certs: true
...
