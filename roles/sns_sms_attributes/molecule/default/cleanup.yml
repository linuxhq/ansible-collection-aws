---
# Molecule runs cleanup after a failed step, before it prunes the ephemeral directory; verify has not restored
# the saved original then. The first cleanup of the next run restores it if this one could not.
- name: Cleanup
  hosts: all
  tasks:
    - name: Ensure saved aws simple notification service sms attributes file is checked
      ansible.builtin.stat:
        path: "{{ lookup('ansible.builtin.env', 'MOLECULE_EPHEMERAL_DIRECTORY') }}/original-sms-attributes.json"
      register: __sns_sms_attributes_saved

    - name: Ensure original aws simple notification service sms attributes are restored
      ansible.builtin.include_tasks: restore.yml
      when: __sns_sms_attributes_saved.stat.exists
...
