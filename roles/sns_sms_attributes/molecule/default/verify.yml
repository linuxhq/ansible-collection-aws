---
- name: Verify
  hosts: all
  tasks:
    - name: Ensure aws simple notification service sms attributes are verified
      block:
        - name: Ensure information about aws simple notification service sms attributes is gathered
          ansible.builtin.include_role:
            name: sns_sms_attributes_info

        - name: Ensure converged aws simple notification service sms attributes are verified
          ansible.builtin.assert:
            that:
              - _sns_sms_attributes_info_dict is mapping
              - _sns_sms_attributes_info_dict.default_sender_id is not defined
              - _sns_sms_attributes_info_dict.default_sms_type == 'Transactional'
              - _sns_sms_attributes_info_dict.delivery_status_success_sampling_rate == '0'

      always:
        - name: Ensure original aws simple notification service sms attributes are restored
          ansible.builtin.include_tasks: restore.yml
...
