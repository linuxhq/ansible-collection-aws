---
- name: Verify
  hosts: all
  roles:
    - role: s3_bucket_info
      s3_bucket_info_name_filter: "molecule-bucket-{{ ansible_facts.date_time.date }}-"

  post_tasks:
    - name: Ensure buckets are verified
      ansible.builtin.assert:
        that:
          - _s3_bucket_info_dict[_bucket.name].name == _bucket.name
      loop: "{{ s3_bucket_list }}"
      loop_control:
        label: "{{ _bucket.name }}"
        loop_var: _bucket
...
