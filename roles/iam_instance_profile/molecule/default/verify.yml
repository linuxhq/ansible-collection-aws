---
- name: Verify
  hosts: all

  roles:
    - iam_instance_profile_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _iam_instance_profile_info_dict[_instance_profile.name].roles.0.role_name ==
              _instance_profile.role
      loop: "{{ iam_instance_profile_list }}"
      loop_control:
        label: "{{ _instance_profile.name }}"
        loop_var: _instance_profile
...
