---
- name: Cleanup
  hosts: all
  roles:
    - ec2_vpc_endpoint_info
    - ec2_vpc_net_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_vpc_endpoint_list:
          - name: molecule
            service: com.amazonaws.us-east-1.s3
            state: absent
            vpc_id: "{{ _ec2_vpc_endpoint_info_dict['molecule'].vpc_id | d(omit) }}"
            wait: true
        ec2_vpc_igw_list:
          - name: molecule
            state: absent
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_route_table_list:
          - state: absent
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            route_tables:
              - name: molecule
                routes: []
                subnets: []
        ec2_vpc_subnet_list:
          - state: absent
            subnets: "{{ ec2_vpc_subnet_list.0.subnets }}"
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ec2_vpc_endpoint
        - ec2_vpc_route_table
        - ec2_vpc_subnet
        - ec2_vpc_igw
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
