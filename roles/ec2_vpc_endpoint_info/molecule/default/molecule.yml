---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_vpc_endpoint_info_filters:
          vpc-endpoint-state:
            - available

        ec2_vpc_endpoint_list:
          - name: molecule
            tags:
              molecule: ec2_vpc_endpoint_info
            route_table_ids:
              - "{{ _ec2_vpc_route_table_info_dict['molecule'].id | d(omit) }}"
            service: com.amazonaws.us-east-1.s3
            vpc_endpoint_type: Gateway
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            wait: true

        ec2_vpc_igw_list:
          - name: molecule
            vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"

        ec2_vpc_net_list:
          - name: molecule
            cidr_block: 192.168.0.0/24

        ec2_vpc_route_table_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            route_tables:
              - name: molecule
                routes:
                  - dest: '0.0.0.0/0'
                    gateway_id: igw
                subnets:
                  - "{{ _ec2_vpc_subnet_info_dict['molecule'].id | d(omit) }}"

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule'].id | d(omit) }}"
            subnets:
              - name: molecule
                az: us-east-1a
                cidr: "{{ ec2_vpc_net_list.0.cidr_block }}"
...
