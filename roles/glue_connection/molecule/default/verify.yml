---
- name: Verify
  hosts: all

  roles:
    - ec2_security_group_info
    - ec2_vpc_subnet_info
    - glue_connection_info

  post_tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        quiet: true
        that:
          - _glue_connection_info_dict[_connection.name].connection_type ==
              _connection.connection_type
          - _glue_connection_info_dict[_connection.name].physical_connection_requirements.subnet_id ==
              _connection.subnet_id
      loop: "{{ glue_connection_list }}"
      loop_control:
        label: "{{ _connection.name }}"
        loop_var: _connection
...
