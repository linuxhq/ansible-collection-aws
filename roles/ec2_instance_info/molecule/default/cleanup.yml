---
- name: Cleanup
  hosts: all
  roles:
    - ec2_ami_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info

  post_tasks:
    # Inventory entries reference fixture ids, so skip entries whose fixtures do not exist.
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_instance_list:
          "{{ ec2_instance_list |
              map('combine', {'state': 'absent'})
              if ['molecule-pvt-a', 'molecule-pvt-c', 'molecule-pvt-d'] is subset(_ec2_vpc_subnet_info_dict)
              else [] }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              map('combine', {'state': 'absent'})
              if 'molecule' in _ec2_vpc_net_info_dict
              else [] }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - ec2_instance
        - ec2_vpc_subnet
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
