---
- name: Verify
  hosts: all

  roles:
    - ec2_vpc_subnet_info
    - rds_subnet_group_info

  tasks:
    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - (_rds_subnet_group_info_dict['molecule'].subnets |
             map(attribute='subnet_identifier') |
             sort) == (rds_subnet_group_list.0.subnets |
             sort)
...
