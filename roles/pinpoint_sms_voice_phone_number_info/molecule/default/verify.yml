---
- name: Verify
  hosts: all
  tasks:
    - name: Ensure role is included without filters
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_number_info

    - name: Ensure requested phone number is selected
      ansible.builtin.set_fact:
        __pinpoint_sms_voice_phone_number_verify:
          "{{ _pinpoint_sms_voice_phone_number_info_dict['molecule-pinpoint-simulator'] }}"

    - name: Ensure info is verified
      ansible.builtin.assert:
        that:
          - __pinpoint_sms_voice_phone_number_verify.iso_country_code == 'US'
          - __pinpoint_sms_voice_phone_number_verify.message_type == 'TRANSACTIONAL'
          - __pinpoint_sms_voice_phone_number_verify.number_capabilities.0 == 'SMS'
          - __pinpoint_sms_voice_phone_number_verify.number_type == 'SIMULATOR'
          - __pinpoint_sms_voice_phone_number_verify.phone_number is defined
          - __pinpoint_sms_voice_phone_number_verify.phone_number_arn is defined
          - __pinpoint_sms_voice_phone_number_verify.phone_number_id is defined
          - __pinpoint_sms_voice_phone_number_verify.status == 'ACTIVE'
          - __pinpoint_sms_voice_phone_number_verify.tags.molecule ==
              'pinpoint_sms_voice_phone_number_info'

    - name: Ensure phone number id filter target is generated
      ansible.builtin.set_fact:
        pinpoint_sms_voice_phone_number_info_id_filter:
          "{{ __pinpoint_sms_voice_phone_number_verify.phone_number_id }}"

    - name: Ensure role is included with phone number id
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_number_info
      vars:
        pinpoint_sms_voice_phone_number_info_phone_number_ids:
          - "{{ pinpoint_sms_voice_phone_number_info_id_filter }}"

    - name: Ensure info with phone number id is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_phone_number_info_list | length == 1
          - _pinpoint_sms_voice_phone_number_info_list.0.phone_number_id ==
              pinpoint_sms_voice_phone_number_info_id_filter

    - name: Ensure role is included with filters
      ansible.builtin.include_role:
        name: pinpoint_sms_voice_phone_number_info
      vars:
        pinpoint_sms_voice_phone_number_info_filters:
          iso-country-code: US
          message-type: TRANSACTIONAL
          number-capability: SMS
          number-type: SIMULATOR

    - name: Ensure info with filters is verified
      ansible.builtin.assert:
        that:
          - _pinpoint_sms_voice_phone_number_info_dict['molecule-pinpoint-simulator'].phone_number_id is defined

    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        pinpoint_sms_voice_phone_number_list:
          "{{ pinpoint_sms_voice_phone_number_list |
              map('combine',
                  {'phone_number_id':
                   __pinpoint_sms_voice_phone_number_verify.phone_number_id,
                   'state':
                   'absent'}) }}"

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _verify }}"
      loop:
        - pinpoint_sms_voice_phone_number
      loop_control:
        label: "{{ _verify }}"
        loop_var: _verify
...
