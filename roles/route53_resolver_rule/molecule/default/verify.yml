---
- name: Verify
  hosts: all
  tasks:
    - name: Ensure ec2_security_group_info facts are gathered
      ansible.builtin.include_role:
        name: ec2_security_group_info

    - name: Ensure ec2_vpc_net_info facts are gathered
      ansible.builtin.include_role:
        name: ec2_vpc_net_info

    - name: Ensure ec2_vpc_subnet_info facts are gathered
      ansible.builtin.include_role:
        name: ec2_vpc_subnet_info

    - name: Ensure route53_resolver_info facts are gathered
      ansible.builtin.include_role:
        name: route53_resolver_info

    - name: Ensure route53_resolver_rule_info facts are gathered
      ansible.builtin.include_role:
        name: route53_resolver_rule_info

    - name: Ensure rules are verified
      ansible.builtin.assert:
        that:
          - _route53_resolver_rule_info_dict[_rule.name].status == 'COMPLETE'
          - _route53_resolver_rule_info_dict[_rule.name].tags.molecule == 'route53_resolver_rule'
          - (_route53_resolver_rule_info_dict[_rule.name].target_ips | map(attribute='ip') | sort) ==
              (_rule.target_ips | map(attribute='ip') | sort)
          - _route53_resolver_rule_info_dict[_rule.name].target_ips | map(attribute='port') | unique == [53]
      loop: "{{ route53_resolver_rule_list }}"
      loop_control:
        label: "{{ _rule.name }}"
        loop_var: _rule

    - name: Ensure rule target addresses are changed
      ansible.builtin.include_role:
        name: route53_resolver_rule
      vars:
        route53_resolver_rule_list:
          - name: molecule-cloudflare
            tags:
              molecule: route53_resolver_rule
            domain_name: cloudflare.com
            resolver_endpoint_id: "{{ _route53_resolver_info_dict['molecule-cloudflare'].id | d(omit) }}"
            rule_type: FORWARD
            target_ips:
              - ip: 1.1.1.3
                port: 53
              - ip: 1.1.1.4
                port: 53

          - name: molecule-google
            tags:
              molecule: route53_resolver_rule
            domain_name: google.com
            resolver_endpoint_id: "{{ _route53_resolver_info_dict['molecule-google'].id | d(omit) }}"
            rule_type: FORWARD
            target_ips:
              - ip: 8.8.8.9
              - ip: 8.8.8.5
                port: 53

    - name: Ensure route53_resolver_rule_info facts are gathered after the change
      ansible.builtin.include_role:
        name: route53_resolver_rule_info

    - name: Ensure changed rule target addresses are verified
      ansible.builtin.assert:
        that:
          - _route53_resolver_rule_info_dict['molecule-cloudflare'].status == 'COMPLETE'
          - (_route53_resolver_rule_info_dict['molecule-cloudflare'].target_ips | map(attribute='ip') | sort) ==
              ['1.1.1.3', '1.1.1.4']
          - _route53_resolver_rule_info_dict['molecule-cloudflare'].target_ips | map(attribute='port') | unique ==
              [53]
          - _route53_resolver_rule_info_dict['molecule-google'].status == 'COMPLETE'
          - (_route53_resolver_rule_info_dict['molecule-google'].target_ips | map(attribute='ip') | sort) ==
              ['8.8.8.5', '8.8.8.9']
          - _route53_resolver_rule_info_dict['molecule-google'].target_ips | map(attribute='port') | unique ==
              [53]
...
