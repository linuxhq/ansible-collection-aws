---
- name: Verify
  hosts: all
  tasks:
    - name: Ensure ec2_security_group_info facts are gathered
      ansible.builtin.include_role:
        name: ec2_security_group_info

    - name: Ensure ec2_vpc_net_info facts are gathered
      ansible.builtin.include_role:
        name: ec2_vpc_net_info

    - name: Ensure ec2_vpc_subnet_info facts are gathered
      ansible.builtin.include_role:
        name: ec2_vpc_subnet_info

    - name: Ensure route53_resolver_info facts are gathered
      ansible.builtin.include_role:
        name: route53_resolver_info

    - name: Ensure route53_resolver_rule_info facts are gathered
      ansible.builtin.include_role:
        name: route53_resolver_rule_info

    - name: Ensure created rules are verified
      ansible.builtin.assert:
        that:
          - _route53_resolver_rule_info_dict[_rule.name].status == 'COMPLETE'
          - _route53_resolver_rule_info_dict[_rule.name].tags.molecule == 'route53_resolver_rule'
          - (_route53_resolver_rule_info_dict[_rule.name].target_ips | map(attribute='ip') | sort) ==
              (_rule.target_ips | map(attribute='ip') | sort)
          - _route53_resolver_rule_info_dict[_rule.name].target_ips | map(attribute='port') | unique == [53]
      loop: "{{ route53_resolver_rule_list_create }}"
      loop_control:
        label: "{{ _rule.name }}"
        loop_var: _rule

    - name: Ensure rules are updated
      ansible.builtin.include_role:
        name: route53_resolver_rule
      vars:
        route53_resolver_rule_list: "{{ route53_resolver_rule_list_update }}"

    - name: Ensure route53_resolver_rule_info facts are gathered after the update
      ansible.builtin.include_role:
        name: route53_resolver_rule_info

    - name: Ensure updated rules are verified
      ansible.builtin.assert:
        that:
          - _route53_resolver_rule_info_dict[_rule.name].status == 'COMPLETE'
          - _route53_resolver_rule_info_dict[_rule.name].tags.molecule == 'route53_resolver_rule'
          - (_route53_resolver_rule_info_dict[_rule.name].target_ips | map(attribute='ip') | sort) ==
              (_rule.target_ips | map(attribute='ip') | sort)
          - _route53_resolver_rule_info_dict[_rule.name].target_ips | map(attribute='port') | unique == [53]
      loop: "{{ route53_resolver_rule_list_update }}"
      loop_control:
        label: "{{ _rule.name }}"
        loop_var: _rule
...
