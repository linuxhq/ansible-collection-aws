---
- name: Cleanup
  hosts: all
  roles:
    - ec2_security_group_info
    - ec2_vpc_net_info
    - ec2_vpc_subnet_info
    - route53_resolver_info

  tasks:
    - name: Ensure inventory lists are formatted
      ansible.builtin.set_fact:
        ec2_security_group_list:
          "{{ ec2_security_group_list |
              selectattr('vpc_id', 'defined') |
              map('combine', {'security_groups': ec2_security_group_list.0.security_groups |
                                                 map('combine', {'state': 'absent'})}) }}"
        ec2_vpc_net_list:
          "{{ ec2_vpc_net_list |
              map('combine', {'state': 'absent'}) }}"
        ec2_vpc_subnet_list:
          "{{ ec2_vpc_subnet_list |
              selectattr('vpc_id', 'defined') |
              map('combine', {'state': 'absent'}) }}"
        route53_resolver_list:
          "{{ route53_resolver_list |
              selectattr('name', 'in', _route53_resolver_info_dict) |
              map('combine', {'state': 'absent'}) }}"
        route53_resolver_rule_list:
          "{{ route53_resolver_rule_list_update |
              selectattr('resolver_endpoint_id', 'defined') |
              map('combine', {'state': 'absent'}) }}"

    - name: Ensure rules are deleted
      ansible.builtin.include_role:
        name: route53_resolver_rule

    - name: Ensure role is included after deletion
      ansible.builtin.include_role:
        name: route53_resolver_rule_info

    - name: Ensure deleted rules are verified
      ansible.builtin.assert:
        that:
          - _rule not in _route53_resolver_rule_info_dict
      loop: "{{ route53_resolver_rule_list_update | map(attribute='name') }}"
      loop_control:
        loop_var: _rule

    - name: Ensure roles are included
      ansible.builtin.include_role:
        name: "{{ _cleanup }}"
      loop:
        - route53_resolver
        - ec2_security_group
        - ec2_vpc_subnet
        - ec2_vpc_net
      loop_control:
        label: "{{ _cleanup }}"
        loop_var: _cleanup
...
