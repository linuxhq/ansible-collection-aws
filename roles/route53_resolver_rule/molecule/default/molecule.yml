---
provisioner:
  inventory:
    group_vars:
      all:
        ec2_security_group_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-route53-resolver-rule'].id | d(omit) }}"
            security_groups:
              - name: molecule-route53-resolver-rule
                rules:
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 53
                      - 443
                    proto: tcp
                  - cidr_ip: 0.0.0.0/0
                    ports:
                      - 53
                    proto: udp
                rules_egress:
                  - cidr_ip: 0.0.0.0/0
                    proto: -1

        ec2_vpc_net_list:
          - name: molecule-route53-resolver-rule
            cidr_block: 192.168.0.0/24

        ec2_vpc_subnet_list:
          - vpc_id: "{{ _ec2_vpc_net_info_dict['molecule-route53-resolver-rule'].id | d(omit) }}"
            subnets:
              - name: molecule-route53-resolver-rule-a
                az:
                  "{{ lookup('ansible.builtin.ini',
                             'region',
                             file='~/.aws/config',
                             section='profile molecule') ~ 'a' }}"
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,0) }}"
              - name: molecule-route53-resolver-rule-c
                az:
                  "{{ lookup('ansible.builtin.ini',
                             'region',
                             file='~/.aws/config',
                             section='profile molecule') ~ 'c' }}"
                cidr: "{{ ec2_vpc_net_list.0.cidr_block |
                          ansible.utils.ipsubnet(25,1) }}"

        route53_resolver_list:
          - name: molecule-route53-resolver-rule-cloudflare
            direction: OUTBOUND
            ip_addresses:
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-route53-resolver-rule-a'].id |
                               d(none) }}"
                ip: 192.168.0.125
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-route53-resolver-rule-c'].id |
                               d(none) }}"
                ip: 192.168.0.253
            security_group_ids:
              - "{{ _ec2_security_group_info_dict['molecule-route53-resolver-rule'].group_id |
                    d(omit) }}"

          - name: molecule-route53-resolver-rule-google
            direction: OUTBOUND
            ip_addresses:
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-route53-resolver-rule-a'].id |
                               d(none) }}"
                ip: 192.168.0.126
              - subnet_id: "{{ _ec2_vpc_subnet_info_dict['molecule-route53-resolver-rule-c'].id |
                               d(none) }}"
                ip: 192.168.0.254
            security_group_ids:
              - "{{ _ec2_security_group_info_dict['molecule-route53-resolver-rule'].group_id |
                    d(omit) }}"

        route53_resolver_rule_list:
          - name: molecule-route53-resolver-rule-cloudflare
            tags:
              molecule: route53_resolver_rule
            domain_name: cloudflare.com
            resolver_endpoint_id: "{{ _route53_resolver_info_dict['molecule-route53-resolver-rule-cloudflare'].id |
                                      d(omit) }}"
            rule_type: FORWARD
            target_ips:
              - ip: 1.1.1.1
                port: 53
              - ip: 1.1.1.2
                port: 53

          - name: molecule-route53-resolver-rule-google
            tags:
              molecule: route53_resolver_rule
            domain_name: google.com
            resolver_endpoint_id: "{{ _route53_resolver_info_dict['molecule-route53-resolver-rule-google'].id |
                                      d(omit) }}"
            rule_type: FORWARD
            target_ips:
              - ip: 8.8.8.8
                port: 53
              - ip: 8.8.8.4
                port: 53
...
