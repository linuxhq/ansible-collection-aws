---
driver:
  name: vagrant
  options:
    managed: true

platforms:
  - name: almalinux9
    box: bento/almalinux-9.6
    cpus: 4
    memory: 4096

  - name: almalinux10
    box: bento/almalinux-10.0
    cpus: 4
    memory: 4096

provisioner:
  inventory:
    group_vars:
      all:
        rds_ca_bundle_list:
          - url: https://truststore.pki.rds.amazonaws.com/global/global-bundle.pem
...
