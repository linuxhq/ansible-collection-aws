---
bugfixes:
  - acm_certificate_request - with a supplied ``idempotency_token``, a certificate that ACM created for the request is
    no longer reported as a reused token with ``changed=false`` when ACM sets it to another status within seconds,
    such as ``FAILED`` with ``ADDITIONAL_VERIFICATION_REQUIRED``. The module now fails with ``changed=true``, the
    ``certificate_arn``, and the status and failure reason. It treats the returned certificate as a replayed earlier
    request only when ACM listed it, in any status, before the request, or when it was created more than a few seconds
    before the request.
