---
bugfixes:
  - ec2_vpc_dhcp_option role - removing an option set that does not exist now succeeds. Before,
    ``amazon.aws.ec2_vpc_dhcp_option`` failed with ``Unable to describe VPC associations for dhcp option id None``.
  - elb_target_group role - removing a target group no longer passes ``target_type``, so it no longer needs
    ``protocol``, ``port`` and ``vpc_id``, for example after its VPC is gone.
  - glue_connection role - removing a connection no longer passes ``connection_type``, so a ``NETWORK`` connection
    no longer needs ``availability_zone``, ``security_groups`` and ``subnet_id``.
  - iam_policy role - removing an inline policy now succeeds when the user, group or role that owns it does not
    exist.
  - route53_record role - removing a record now succeeds when its hosted zone does not exist.
  - s3_lifecycle role - removing a lifecycle rule now succeeds when its bucket does not exist.
  - s3_website role - removing a website configuration now succeeds when its bucket does not exist.
  - ses_identity role - removing an identity now succeeds when the hosted zone for its DNS records does not exist.
...
