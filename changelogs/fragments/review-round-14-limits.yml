---
bugfixes:
  - ec2_flow_log - delete flow logs and describe newly created flow logs in batches of at most 100 flow log IDs,
    because EC2 ``DeleteFlowLogs`` and ``DescribeFlowLogs`` return ``InternalError`` for more than 100 IDs even
    though the API documents 1000, so removing, purging, or creating more than 100 flow logs no longer fails;
    report ``changed=true`` when a later delete batch fails after an earlier batch deleted flow logs; and when EC2
    rejects a delete request because a flow log is already gone, delete only the flow logs that still exist
    instead of failing.
  - ec2_flow_log - add and remove tags in batches of at most 100 flow logs, because EC2 ``CreateTags`` and
    ``DeleteTags`` return ``InternalError`` for more than 100 flow log IDs, so retagging more than 100 flow logs no
    longer fails, and report ``changed=true`` when a later tag batch fails after an earlier batch succeeded.
  - ec2_flow_log_info - describe flow logs in batches of at most 100 ``flow_log_ids``, and split ``resource_ids``
    so each request has at most 200 filter values across all filters, the EC2 limit, so requesting more flow log
    IDs or resource IDs than EC2 accepts in one call no longer fails. The module fails before calling AWS when
    ``filters`` leaves no room for ``resource_ids``.
  - ec2_placement_group_info - describe each requested ``group_ids`` entry that the account-wide query did not
    return by its ID, so placement groups shared with the account are returned, because EC2 describes shared
    placement groups only by ID. An ID that does not exist still results in no entry.
  - ec2_placement_group_info - split ``group_names`` so each request has at most 200 filter values across all
    filters, the EC2 limit, so requesting more than 200 placement group names no longer fails. The module fails
    before calling AWS when ``filters`` leaves no room for ``group_names``.
  - ec2_transit_gateway_route_table_info - split ``transit_gateway_route_table_ids`` so each request has at most
    200 filter values across all filters, the EC2 limit, so requesting more than 200 route tables no longer fails.
    The module fails before calling AWS when ``filters`` leaves no room for ``transit_gateway_route_table_ids``.
  - ec2_vpc_prefix_list_info - split ``prefix_list_ids`` so each request has at most 200 filter values across all
    filters, the EC2 limit, so requesting more than 200 prefix lists no longer fails. The module fails before
    calling AWS when ``filters`` leaves no room for ``prefix_list_ids``.
