---
bugfixes:
  - eks_cluster - fail before any AWS change, also in check mode, when a ``remote_network_config`` node or pod network
    CIDR block is not in canonical form, instead of applying earlier updates before EKS rejects the remote network
    configuration.
  - eks_cluster - send a CIDR block repeated in a ``remote_network_config`` node or pod network list once, as EKS
    rejects repeated blocks.
