---
bugfixes:
  - ec2_transit_gateway_route_table - check mode now predicts the settled result a waited run returns. A pending
    route table is returned as ``available`` when ``wait=true`` or ``routes`` is set, a matching pending route as
    ``active`` when ``wait=true``, and a ``routes[].state=absent`` route that is already deleting is left out of
    ``routes`` when ``wait=true``. Before, check mode returned the pending or deleting objects.
