---
minor_changes:
  - glue_connection_info - return the connection properties AWS Glue provides unmodified, including
    ``KAFKA_SASL_SCRAM_PASSWORD``, which Glue returns even when ``hide_password=true``. ``hide_password`` is still
    passed to Glue as its ``HidePassword`` request flag. Callers should protect the output with task-level ``no_log``.
  - ec2_vpc_vpn - return the VPN connection as EC2 provides it, unmodified, including ``customer_gateway_configuration``
    and each tunnel's ``pre_shared_key`` when EC2 returns them. Ansible still masks a key supplied in
    ``tunnel_options[].pre_shared_key`` wherever it appears in the results; callers should protect other keys and
    the configuration with task-level ``no_log``.
