---
minor_changes:
  - ssm_association_info - a O(filters) key with more than one value now sends one filter entry per value, and Systems
    Manager rejects the repeated key instead of the module; empty and null values are still rejected by the module.
  - wafv2_web_acl_logging - a web ACL ARN from another region is now rejected by AWS WAFv2 on the first read instead
    of by the module.
trivial:
  - ssm_association and ssm_document - reuse the tag changes calculated before the write instead of calculating them
    again, and skip them after a create, which sends its tags.
  - ssm_document - always convert the returned document.
  - ssm_document_info - clarify the RV(document) return description.
  - wafv2_web_acl_logging - compare only the logging destinations, which AWS always returns.
  - Custom waiters - drop explicit retry acceptors for statuses, which botocore already keeps polling, and fold the
    single-use waiter factory helper into custom_waiter.
