---
bugfixes:
  - ec2_transit_gateway_route_table - match O(name) exactly against the C(Name) tag, so C(*) and C(?) no longer select
    or purge routes in a different route table.
  - ec2_vpc_prefix_list - match O(name) exactly, so C(*) and C(?) no longer select and rewrite a different prefix list.
  - ec2_vpc_vpn - match O(name) exactly against the C(Name) tag, so C(*) and C(?) no longer select a different VPN
    connection.
