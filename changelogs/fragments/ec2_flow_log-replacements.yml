---
minor_changes:
  - ec2_flow_log - add the ``RegionalNatGateway`` resource type; ``traffic_type`` defaults to ``ALL`` for it, as for
    the VPC, subnet, and network interface resource types.
bugfixes:
  - ec2_flow_log - send a client token with ``CreateFlowLogs`` so SDK retries of a request that already
    succeeded do not create duplicate flow logs.
  - ec2_flow_log - reject ``max_aggregation_interval=600`` for transit gateway resource types before
    calling AWS, which requires ``60``.
