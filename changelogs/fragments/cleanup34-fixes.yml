---
bugfixes:
  - eks_cluster - fail before any change, including in check mode, when ``version`` has the cluster's major version
    and is more than one minor version above it. EKS updates a cluster only one minor version at a time, so the
    configuration updates were applied before the version update was rejected.
trivial:
  - ec2_pricing_info - state that the listed Pricing API Regions are those of the aws partition.
  - global_accelerator - document that AWS does not support client IP address preservation for Network Load
    Balancer endpoints with TLS listeners.
