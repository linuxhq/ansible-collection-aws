---
bugfixes:
  - ec2_vpc_vpn - an existing IPv6 VPN connection attached to neither a transit gateway nor a VPN concentrator, such as
    one attached to Cloud WAN, no longer fails every O(state=present) run with "IPv6 VPN connections require a transit
    gateway", including check mode and runs that change only tags. EC2 accepts such a connection, so the module now
    checks for a transit gateway only when it creates an IPv6 connection.
