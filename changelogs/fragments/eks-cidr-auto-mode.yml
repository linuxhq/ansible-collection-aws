---
bugfixes:
  - eks_cluster - convert ``resources_vpc_config.public_access_cidrs`` to canonical CIDR form before comparing and
    sending it, as EKS stores it, instead of re-sending a CIDR with host bits set, such as ``52.94.76.5/24``, on every
    run and failing because EKS reports the cluster is already at the desired configuration.
  - eks_cluster - treat the Auto Mode blocks that EKS omits on a standard cluster as disabled, so explicitly setting
    ``compute_config.enabled``, ``kubernetes_network_config.elastic_load_balancing.enabled``, or
    ``storage_config.block_storage.enabled`` to ``false`` converges instead of sending an Auto Mode update that EKS
    rejects on every run.
