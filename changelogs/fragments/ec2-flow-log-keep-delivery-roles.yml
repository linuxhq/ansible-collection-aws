---
bugfixes:
  - ec2_flow_log - a replacement flow log now keeps the ``deliver_cross_account_role`` and
    ``deliver_logs_permission_arn`` of the flow log it replaces when the task omits them and both deliver to the same
    ``log_destination_type`` (``cloud-watch-logs`` or ``kinesis-data-firehose``); before, the replacement was created
    without them. A kept ``deliver_logs_permission_arn`` also satisfies the CloudWatch Logs create requirement.
