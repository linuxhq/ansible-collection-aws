---
removed_features:
  - ses_identity_tokens_info - remove the module. It called ``VerifyDomainDkim`` and ``VerifyDomainIdentity``,
    which create or re-verify the SES identity, while reporting no change.
    Use ``linuxhq.aws.ses_identity_info`` to read DKIM tokens and ``linuxhq.aws.ses_identity_dkim`` to enable Easy DKIM.
breaking_changes:
  - ses_identity role - stop managing the ``_amazonses`` TXT verification record; domains are verified by their
    DKIM CNAME records. Existing TXT records are no longer updated or removed.
bugfixes:
  - ses_identity role - stop recreating the identity when ``state=absent``; the identity is read with
    ``ses_identity_info`` and deleted after its DNS records.
major_changes:
  - ses_identity_dkim - new module that enables Easy DKIM for an SES domain identity and returns its DKIM tokens.
minor_changes:
  - ses_identity_info - document the DKIM and verification fields.
...
