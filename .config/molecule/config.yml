---
prerun: false

dependency:
  name: galaxy
  options:
    requirements-file: ../../requirements.yml

driver:
  name: default
  options:
    managed: false
    ansible_connection_options:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

platforms:
  - name: localhost

provisioner:
  name: ansible
  env:
    ANSIBLE_ACTION_WARNINGS: false
    ANSIBLE_COLLECTIONS_PATH: ${ANSIBLE_COLLECTIONS_PATH}
    ANSIBLE_DEPRECATION_WARNINGS: false
    OBJC_DISABLE_INITIALIZE_FORK_SAFETY: 'YES'
  log: true
  options:
    diff: true
  inventory:
    group_vars:
      all:
        ec2_customer_gateway_info_filters:
          state:
            - available

        ec2_instance_info_filters:
          instance-state-name:
            - running

        ec2_launch_template_info_filters:
          launch-template-name:
            "{{ ec2_launch_template_list |
                d([]) |
                map(attribute='template_name') }}"

        ec2_placement_group_info_filters:
          state:
            - available

        ec2_transit_gateway_info_filters:
          state:
            - available

        ec2_transit_gateway_route_table_info_filters:
          state:
            - available

        ec2_transit_gateway_vpc_attachment_info_filters:
          state:
            - available

        ec2_vpc_endpoint_info_filters:
          vpc-endpoint-state:
            - available

        ec2_vpc_igw_info_filters:
          attachment.state:
            - available

        ec2_vpc_nat_gateway_info_filters:
          state:
            - available

        ec2_vpc_net_info_filters:
          state:
            - available
          tag:Name:
            "{{ ec2_vpc_net_list |
                d([]) |
                map(attribute='name') }}"

        ec2_vpc_subnet_info_filters:
          state:
            - available

        ec2_vpc_vgw_info_filters:
          state:
            - available

        ec2_vpc_vpn_info_filters:
          state:
            - available

scenario:
  test_sequence:
    - dependency
    - cleanup
    - destroy
    - syntax
    - create
    - prepare
    - check
    - converge
    - check
    - idempotence
    - verify
    - cleanup
    - destroy

verifier:
  name: ansible
  options:
    diff: true
...
