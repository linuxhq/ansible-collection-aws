[tox]
env_list =
    ansible-lint
    black-lint
    ruff-lint
    unit
    yamllint
skipsdist = true
skip_missing_interpreters = true

[common]
ansible_home = {envtmpdir}/ansible_home
ansible_collections_path = {[common]ansible_home}/collections
full_collection_path = {[common]ansible_collections_path}/ansible_collections/linuxhq/aws
format_dirs = {toxinidir}/plugins {toxinidir}/tests
lint_dirs = {toxinidir}/plugins {toxinidir}/tests

[testenv]
base_python = python3.13
change_dir = {toxinidir}

[testenv:ansible-lint]
labels = lint
description = Run ansible-lint
deps =
    ansible-core>=2.21.2,<2.22
    ansible-lint==26.6.0
    jmespath==1.1.0
commands = ansible-lint {posargs}

[testenv:black]
labels = format
description = Format Python files
deps = black==26.5.1
commands = black {posargs:{[common]format_dirs}}

[testenv:black-lint]
labels = lint
description = Check Python formatting
deps = {[testenv:black]deps}
commands = black --check {posargs:{[common]format_dirs}}

[testenv:ruff]
labels = format
description = Fix Python lint findings
deps = ruff==0.16.1
commands = ruff check --fix {posargs:{[common]lint_dirs}}

[testenv:ruff-lint]
labels = lint
description = Check Python lint findings
deps = {[testenv:ruff]deps}
commands = ruff check {posargs:{[common]lint_dirs}}

[testenv:yamllint]
labels = lint
description = Lint YAML files
deps = yamllint==1.38.0
commands = yamllint --strict {posargs:.}

[testenv:changelog]
description = Manage changelog fragments and releases
deps = antsibull-changelog==0.35.1
commands = antsibull-changelog {posargs:lint}

[testenv:build]
description = Build the collection tarball
deps = ansible-core>=2.21.2,<2.22
commands = ansible-galaxy collection build {posargs}

[testenv:pre-commit]
description = Install the pre-commit hook
deps = pre-commit==4.6.1
commands = pre-commit install

[testenv:unit]
labels = unit
description = Run unit tests from the required collection layout
deps =
    ansible-core>=2.21.2,<2.22
    pytest==9.1.1
    -r requirements.txt
allowlist_externals = rsync
args_are_paths = false
change_dir = {[common]full_collection_path}
set_env =
    ANSIBLE_HOME={[common]ansible_home}
    ANSIBLE_COLLECTIONS_PATH={[common]ansible_collections_path}
    PYTHONPATH={[common]ansible_collections_path}
commands_pre =
    rsync --delete --filter=':- .gitignore' --exclude=/.git -qraugpo {toxinidir}/ {[common]full_collection_path}/
    ansible-galaxy collection install -r {toxinidir}/requirements.yml -p {[common]ansible_collections_path}
commands = pytest {posargs:tests/unit}

[testenv:ansible-test]
description = Run ansible-test from the required collection layout
deps =
    ansible-core>=2.21.2,<2.22
    -r requirements.txt
allowlist_externals =
    git
    rsync
args_are_paths = false
change_dir = {[common]full_collection_path}
set_env =
    ANSIBLE_HOME={[common]ansible_home}
    ANSIBLE_COLLECTIONS_PATH={[common]ansible_collections_path}
commands_pre =
    rsync --delete --filter=':- .gitignore' --exclude=/.git -qraugpo {toxinidir}/ {[common]full_collection_path}/
    ansible-galaxy collection install -r {toxinidir}/requirements.yml -p {[common]ansible_collections_path}
    git init --quiet
    git add --all
commands = ansible-test {posargs:sanity}

[testenv:molecule]
description = Run Molecule for the role named by MOLECULE_ROLE
deps =
    ansible-core>=2.21.2,<2.22
    molecule==25.1.0
    molecule-plugins==23.7.0
    python-vagrant==1.0.0
    -r requirements.txt
allowlist_externals =
    git
    rsync
change_dir = {[common]full_collection_path}/roles/{env:MOLECULE_ROLE}
pass_env =
    AWS_*
    SSH_AUTH_SOCK
    VAGRANT_*
    VBOX_*
set_env =
    ANSIBLE_HOME={[common]ansible_home}
    ANSIBLE_COLLECTIONS_PATH={[common]ansible_collections_path}
commands_pre =
    rsync --delete --filter=':- .gitignore' --exclude=/.git -qraugpo {toxinidir}/ {[common]full_collection_path}/
    ansible-galaxy collection install -r {toxinidir}/requirements.yml -p {[common]ansible_collections_path}
    git -C {[common]full_collection_path} init --quiet
    git -C {[common]full_collection_path} add --all
commands = molecule -c {toxinidir}/.config/molecule/tox.yml {posargs:syntax -s default}
